description: Environnement d'exécution simple d'un projet basique

# La base de l'application — le storage du modèle, legacy sert la reprise

storage: database

# Configuration de la journalisation

logging: ~{logging.yml}
# Le nettoyage des fichiers — les règles de rétention (D1073), en sommeil (D800)
cleanup-disable: ~{cleanup.yml}

# Configuration des connecteurs de l'application

connectors: ~{connectors.yml}
