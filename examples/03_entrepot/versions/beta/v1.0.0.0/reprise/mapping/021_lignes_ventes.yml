# L'étape 21 — les lignes de commandes de vente : LCOMCLI vers
# commande.ligne_vente, la composition de l'entête (D399/D931 : to: nomme
# l'entité fille). Le possesseur est la révision (numéro, indice) — LCKTPSF
# est l'indice de la commande (D951) ; les deux clés converties à la
# lecture, jamais dans parent: (D990) : le calculé numero de la source,
# l'indice tel quel. L'identité de la ligne au sein de la commande : le
# numéro de ligne, le calculé ligne (D841/D930). L'article par sa clé
# composée, la même carte que le possesseur (D931). Les prix en amount à
# la devise de la ligne (D771) ; le prix de revient sans devise chez PMI —
# celle de l'entreprise, le défaut du type (D993). Les délais sont des
# jours : « sur les commandes, il n'y a pas d'heures », la colonne S est
# la semaine, déduite du jour, non reprise (D1000). Le statut traduit
# depuis les valeurs de PMI (D1002) — sans « ... », un code hors liste est
# un rejet visible. L'entête fautive emporte ses lignes ; la ligne fautive tombe
# seule, l'entête entre sans elle (D933).

LCOMCLI:
  to: commande.ligne_vente
  parent:
    commande_vente: { numero: numero, indice: LCKTPSF }   # les champs mappés du possesseur (D931), le calculé de la source (D990)
  fields:
    # --- l'identité au sein de la commande (D930) ---
    numero:  ligne                        # le calculé de la source (D990)
    # --- l'article ---
    article: { code: LCCTCODART, complement: LCCTCOMART }   # la référence par la clé composée (D931)
    # --- les quantités ---
    quantite:          LCCNQTECDE
    unite:             LCCTUNICDE
    quantite_expediee: LCCNQTEEXP
    quantite_lancee:   LCCNQTELAN
    # --- les prix — la devise dans la valeur (D771) ---
    prix_brut:    amount(LCCNPUBRUT, LCCTDEVISE)
    prix_net:     amount(LCCNPUNET, LCCTDEVISE)
    prix_revient: amount(LCCNPUREVI)      # la devise de l'entreprise — le défaut du type (D993)
    # --- les délais — des jours (D1000) ---
    delai_demande:     LCCJDELDDE
    delai_accuse:      LCCJDELARR
    delai_expedition:  LCCJDELEXP
    delai_fabrication: LCCJDELFAB
    # --- l'état ---
    statut: 'LCCTSTATUT.select(null: "non_traite", A: "en_cours", P: "partielle", S: "soldee", T: "terminee")'   # les valeurs de PMI (D1002) ; le vide = le nul (D366) ; sans "..." : hors liste = rejet
  validation:
    - me.quantite_expediee <= me.quantite         # sur la ligne importée, le construit par me (D932)
  report:
    when: [migration]
    to: [commercial]
    by: [notification, mail]
