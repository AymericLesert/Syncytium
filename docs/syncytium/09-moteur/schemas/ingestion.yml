# Le logigramme de l'ingestion
# Le chemin d'une version, de son dépôt à son activation : chaque contrôle peut la refuser, et le registre des versions
# consigne l'issue.
title: Le chemin d'une version, de son dépôt à son activation
steps:
  - start: Début
  - action: Une version est déposée
    note: la description est contrôlée dès le dépôt
  - decision: Format supporté ?
    no: {to: refus}
  - decision: Dossier des versions cohérent ?
    no: {to: refus}
  - decision: Description valide ?
    no: {to: refus}
  - action: La description est convertie
  - action: Le moteur attend une faible affluence
    note: les données ne migrent pas en pleine activité
  - decision: Migration à blanc correcte ?
    no: {to: refus}
  - action: La version s'active
    note: l'estampille avance
  - action: Le registre consigne l'issue
    id: registre
  - end: Fin
sides:
  refus:
    from: 3
    col: 2
    steps:
      - action: La version est refusée
        id: refus
        note: l'application garde sa version
    to: registre
