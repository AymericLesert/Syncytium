# La révision — la règle de l'échéancier (D826) : « Révisions tous
# les 25 000 km » (thermique), « tous les 20 000 km » (électrique).
# La règle porte un pas en kilomètres OU en délai. Les révisions
# faites restent des lignes du journal de vie (D831) — la ligne
# marquée révision (le booléen d'entretien), la règle en déduit la
# prochaine échéance (le booléen ne distingue pas les règles — le
# réel n'en a qu'une par véhicule).
# LA NOTIFICATION = L'OPÉRATION AUTOMATIQUE + notify (D436 — « couvre
# tout ») : echue se recalcule d'elle-même (D255/D298), l'opération
# notifier se déclenche à l'échéance (le cliquet D354) et porte
# l'information aux utilisateurs (notify, 15e opération du socle —
# D574) — in-app pour tous (D836) ; le relais mail = un setting de
# l'application, défaut néant (D836) — et smtp: none ici de toute
# façon (D763) ; la surface du morceau 4 fera écho.
name: revision
label: "{designation}"
fields:
  designation: { type: text[..60], required: true }
  pas_km:      integer[0..]          # « sur un km » — 25 000, 20 000
  pas_duree:   duration              # « ou sur un délai » — 1y, 6m (D476)
  # les révisions faites — les lignes du journal marquées révision
  derniere_km:   { type: integer, formula: owner.entretiens.max(km if revision) }
  derniere_date: { type: date, formula: owner.entretiens.max(date if revision) }
  # la prochaine échéance : depuis la dernière révision faite, sinon depuis l'origine du véhicule
  prochaine_km:   { type: integer, formula: iif(pas_km = null, null, iif(derniere_km != null, derniere_km, owner.km_initial) + pas_km) }
  prochaine_date: { type: date, formula: iif(pas_duree = null, null, iif(derniere_date != null, derniere_date, owner.date_achat) + pas_duree) }
  # la notification (D826) — échue sur le km OU sur le délai, tant que le véhicule est actif
  echue: { formula: owner.statut = actif and ((prochaine_km != null and owner.km_courant >= prochaine_km) or (prochaine_date != null and context.now >= prochaine_date)) }
operations:
  notifier:                        # l'automatisme (D428) — à l'échéance
    when: echue
    commit: auto
    effects:
      - notify                     # la référence au hook du socle (D432/D609)
validation:
  - pas_km != null or pas_duree != null   # une règle sans pas ne dit rien

# La présentation graphique — inline (l'éclatement libre D767)
gui:
  forms:
    record:
      title:
        create: { fr: "Nouvelle règle de révision" }
        read:   { fr: "{designation}" }
        update: { fr: "Modification de la règle '{designation}'" }
        delete: { fr: "Suppression de la règle '{designation}'" }
      items:
        - field[designation]
        - field[pas_km]              # « sur un km »…
        - field[pas_duree]           # … « ou sur un délai »
  lists:
    toutes:                          # la première déclarée = le défaut (D437)
      title: { fr: "Les révisions" }
      searchable:
        - vehicule: { select: mono, required: true }
      columns: [designation, pas_km, pas_duree, derniere_date, derniere_km, prochaine_date, prochaine_km, echue]
      sort: [designation]
      selection: 1
    echues:                          # l'écho (D826) — la partition par le filtre (D783)
      title: { fr: "Les révisions échues" }
      filter: echue = true
      columns: [vehicule, designation, derniere_km, prochaine_km, prochaine_date]
      sort: [designation]
      selection: 1
