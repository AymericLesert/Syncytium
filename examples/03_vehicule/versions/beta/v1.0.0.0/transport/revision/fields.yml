designation:
  type: text[..60]
  required: true
  label:
    fr: Désignation
  placeholder:
    fr: Révision constructeur

pas_km:
  type: integer[0..]
  label:
    fr: Tous les (km)
  hint:
    fr: Le pas en kilomètres — « Révisions tous les 25 000 km ».

pas_duree:
  # les unités du duration (D476) — 1y, 6m
  type: duration
  label:
    fr: Tous les (délai)
  hint:
    fr: Le pas en délai — l'autre voie de l'échéancier.

# ------ Champs calculés ------

derniere_km:
  # les révisions faites — les lignes du journal marquées révision
  type: integer
  formula: owner.entretiens.max(km if revision)
  label:
    fr: Dernière (km)

derniere_date:
  type: date
  formula: owner.entretiens.max(date if revision)
  label:
    fr: Dernière (date)

prochaine_km:
  # depuis la dernière révision faite, sinon depuis l'origine du véhicule
  type: integer
  formula: iif(pas_km = null, null, iif(derniere_km != null, derniere_km, owner.km_initial) + pas_km)
  label:
    fr: Prochaine (km)

prochaine_date:
  type: date
  formula: iif(pas_duree = null, null, iif(derniere_date != null, derniere_date, owner.date_achat) + pas_duree)
  label:
    fr: Prochaine (date)

echue:
  # la notification (D826) — sur le km OU le délai, tant que le véhicule est actif
  formula: owner.statut = actif and ((prochaine_km != null and owner.km_courant >= prochaine_km) or (prochaine_date != null and context.now >= prochaine_date))
  label:
    fr: Échue ?
  hint:
    fr: La règle est à échéance — la notification part, la surface met en avant.
