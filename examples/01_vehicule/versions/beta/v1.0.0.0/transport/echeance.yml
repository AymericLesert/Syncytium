# L'échéance — la ligne du tableau CREDIT | LOA.
# Le cycle de vie tient en deux hooks (D831, le morceau 3) :
# - creer_echeancier — les lignes sont ENGENDRÉES à la validation du
#   financement du véhicule ; les formules du classeur (la mensualité
#   constante, intérêt = reste × taux périodique, amortissement =
#   mensualité − intérêt) vivent dans le générateur, pas dans la
#   grammaire (D826 : « des calculés déclarés, pas une saisie ») ;
# - clore_echeancier — à la vente du véhicule, l'échéancier est clos :
#   toutes les échéances non payées sont supprimées.
# La coche « Payé » du classeur devient un calculé : l'échéance est
# payée dès que la date du jour dépasse sa date (le jour d'échéance
# du mois porté par le financement — D831).
name: echeance
label: "${name}"
fields:
  numero:        { type: integer[1..], required: true }   # le rang (1..durée)
  date:          { type: date, required: true }           # au jour d'échéance du mois, depuis le premier mois
  interet:       decimal                                  # crédit — reporté par le générateur
  amortissement: decimal                                  # crédit
  assurance:     decimal                                  # crédit — 34,40
  mensualite:    { type: decimal, required: true }        # 473,86 / 434,48
  paye:          { formula: context.now >= date }         # la coche automatique (D831)
  # le reste dû en début de période : crédit — le capital moins l'amorti,
  # LOA — les loyers restants (B(n) = B(n−1) − F(n−1) du classeur)
  reste_du:
    type: decimal
    formula: owner.financement.select(credit: owner.capital - owner.echeances.sum(amortissement if numero < me.numero), loa: owner.echeances.sum(mensualite if numero >= me.numero), comptant: 0)

# La présentation graphique — inline (l'éclatement libre D767).
# Pas de formulaire : les lignes naissent de creer_echeancier, se
# reprennent par ajuster_echeancier, la coche Payé est calculée —
# rien à saisir à la ligne.
gui:
  lists:
    echeancier:                      # le tableau CREDIT | LOA du classeur
      title: { fr: "L'échéancier" }
      searchable:
        - vehicule: { select: mono, required: true }
      columns: [numero, date, reste_du, interet, amortissement, assurance, mensualite, paye]
      sort: [numero]
      selection: 1
