# La déclaration de la présentation graphique — le morceau 4.
# Pas de formulaire déclaré : le défaut du socle suffit — la règle
# s'écrit dans la liste (l'édition en ligne, D205/D445).
widgets:

  # le widget de l'échue — un seul texte : UNE ALERTE,
  annonce:
                                   # rien de plus (pas de lien vers le véhicule ou la
                                   # règle — « nous n'avons pas plus de 2 véhicules »)
    items:
      # le gabarit mustache, les chemins D71, l'alinéa au if:
      - paragraph:
          if: prochaine_date != null
          label:
            fr: "Révision « {{designation}} » du véhicule {{owner.nom}} — prévue le {{prochaine_date}}"
      - paragraph:
          if: prochaine_date = null
          label:
            fr: "Révision « {{designation}} » du véhicule {{owner.nom}} — prévue à {{prochaine_km}} km"

lists:

  # la première déclarée = le défaut (D437)
  revisions:
    title:
      fr: "Les révisions"
    columns: [designation, pas_km, pas_duree, derniere_date, derniere_km, prochaine_date, prochaine_km, echue]
    # la règle ; les échéances se déduisent (D255)
    editable: [designation, pas_km, pas_duree]
    sort: [designation]

  # l'écho (D826) — TOUS les véhicules, la partition par le filtre (D783)
  echues:
    title:
      fr: "Les révisions échues"
    filter: echue = true
    # la liste de widgets (D492) — le texte unique par échue
    widget: annonce
    # le nul en tête (D381) — les règles au km d'abord
    sort: [prochaine_date]
