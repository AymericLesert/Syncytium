# Le logigramme de la migration de version
# De la comparaison des facettes à l'activation : identiques et sans règle de transformation, les règles qui changent
# se rebalaient à blanc ; sinon, une nouvelle instance reçoit les données par un plan de reprise ; une erreur annule
# la bascule.
title: La migration de version, de la comparaison des facettes à l'activation
steps:
  - start: Début
  - action: Le nouveau schéma est construit
    note: dans la facette de stockage du connecteur
  - decision: Facettes identiques ?
    no:
      side: [{action: Une nouvelle instance est créée, id: instance}, {action: Le plan de reprise l'alimente}]
      to: controle
  - decision: Règle de transformation ?
    yes: {to: instance}
  - decision: Règle ou validation changée ?
    no: {to: active}
  - action: Les règles sont rebalayées, à blanc
  - action: Les données sont contrôlées
    id: controle
  - decision: Tout est correct ?
    no: {to: erreur}
  - action: La version s'active
    id: active
  - end: Fin
    id: fin
sides:
  erreur:
    from: 7
    col: 2
    steps:
      - action: Erreur d'ingestion
        id: erreur
        note: la bascule est annulée
    to: fin
