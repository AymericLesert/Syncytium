# Le numéro de la version
# Quatre nombres : la majeure, la mineure, l'indice et le build.
version: 1.0.0.0

# Les langues de l'application
# La première est la langue par défaut ; ajouter ou retirer une langue fait une nouvelle version. Avec une seule
# langue, les libellés et les descriptions s'écrivent en texte simple.
languages: [fr]

# Les notes de version
# Ce que la version apporte, en Markdown.
release-notes: |
  La première version de la maintenance des véhicules du foyer — du classeur Excel à l'application.

  # Le modèle
  - Le véhicule — l'identification (la plaque), le financement à plat (comptant, crédit, LOA), le cycle Création →
    Actif → Clôture, le bilan tout calculé (0,249 €/km).
  - La consommation (les pleins et les charges au rang), le journal de vie, les règles de révision, l'échéancier.

  # Les opérations
  - creer_echeancier à la validation du financement, ajuster_echeancier au bouton, clore_echeancier à la vente,
    finaliser_vehicule après la migration.

  # Les surfaces
  - L'accueil — les révisions échues puis les véhicules en cartes ; le formulaire aux six onglets, l'édition en ligne.

  # La reprise
  - Les dix classeurs 1992-2026 — huit sources, dix phases, la jointure par la plaque.

# Les hooks
# Les opérations du projet, par famille.
hooks: ~{hooks/hooks.yml}

# Les migrations
# La reprise des classeurs historiques : le legacy, les entités sources, les règles.
migrations: ~{reprise/reprise.yml}

# Les modules de l'application
# Un seul : le transport.
modules:
  - ~{transport/transport.yml}
