# La révision — la règle de l'échéancier (D826) : « Révisions tous
# les 25 000 km » (thermique), « tous les 20 000 km » (électrique).
# La règle porte un pas en kilomètres OU en délai. Les révisions
# faites restent des lignes du journal de vie (D831) — la ligne qui
# solde une règle la nomme (entretien.revision), la règle en déduit
# la prochaine échéance.
# LA NOTIFICATION EST DÉCLARATIVE : echue se recalcule d'elle-même
# (D255/D298) — la surface (le morceau 4) met les règles échues en
# avant ; le mail reste muet (smtp none, D763), rien de plus à faire.
name: revision
label: "{designation}"
fields:
  designation: { type: text[..60], required: true }
  pas_km:      integer[0..]          # « sur un km » — 25 000, 20 000
  pas_duree:   duration              # « ou sur un délai » — 1y, 6m (D476)
  # les révisions faites — l'accès retour automatique de entretien.revision (D398)
  derniere_km:   { type: integer, formula: entretiens.max(km) }
  derniere_date: { type: date, formula: entretiens.max(date) }
  # la prochaine échéance : depuis la dernière révision faite, sinon depuis l'origine du véhicule
  prochaine_km:   { type: integer, formula: iif(pas_km = null, null, iif(derniere_km != null, derniere_km, owner.km_initial) + pas_km) }
  prochaine_date: { type: date, formula: iif(pas_duree = null, null, iif(derniere_date != null, derniere_date, owner.date_achat) + pas_duree) }
  # la notification (D826) — échue sur le km OU sur le délai, tant que le véhicule est actif
  echue: { formula: owner.statut = actif and ((prochaine_km != null and owner.km_courant >= prochaine_km) or (prochaine_date != null and context.now >= prochaine_date)) }
validation:
  - pas_km != null or pas_duree != null   # une règle sans pas ne dit rien
