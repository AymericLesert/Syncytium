# Les connecteurs de l'environnement de production (D617 — chaque
# environnement les siens ; les secrets = les paramètres marqués *
# (D944), par variable d'environnement chiffrée, jamais dans le dépôt
# — D321/D902).

# L'entrepôt — le storage cible : un schéma PostgreSQL (D860). L'instance
# du contrat (D680) est ce schéma ; la duplication et la bascule de la
# migration à chaud (D674) y prennent leur forme native.
entrepot:
  type: storage
  class: postgresql
  parameters:
    host: ${ENTREPOT_HOST}
    database: ${ENTREPOT_DATABASE}
    schema: entrepot
    user: ${ENTREPOT_USER}
    password*: ${ENTREPOT_PASSWORD}   # la marque * : confidentiel, la variable chiffrée

# Cegid PMI — le storage source : le schéma d'une instance SQL Server
# (D860), lu EN DIRECT sur la base de production (D863), en lecture
# seule (D175 : le connecteur de reprise est un storage ordinaire qui ne
# fait que lire — la classe n'écrit jamais chez PMI). Pas de carte
# entities: (D829 — optionnelle, la base se décrit elle-même) : la
# comparaison du schéma réel à la description (D861/D868) doit voir
# toutes les tables, les non définies comprises.
cegid:
  type: storage
  class: sqlserver
  parameters:
    server: ${CEGID_SERVER}
    database: ${CEGID_DATABASE}
    schema: dbo
    user: ${CEGID_USER}
    password*: ${CEGID_PASSWORD}
  # La facette des types portée par le connecteur (D876) — la convention
  # de nommage de PMI, <XX><K|C|I><T|N|J|S><nom> (D865), surchargeable à
  # l'entité ou au champ (D877). LA FORME EST EN PROPOSITION (D876 la
  # renvoyait à l'assise) : le motif à groupes nommés (D817) découpe la
  # colonne ; identity: dit les lettres de la clé ; types: la lettre du
  # type — le type SQL tranche entre entier et décimal pour N.
  convention:
    columns: '^(?<prefix>[A-Z]{2})(?<kind>[KCI])(?<type>[TNJS])(?<name>[A-Z0-9]+)$'
    identity: [K, I]
    types:
      T: text
      N: decimal
      J: date[yyyymmdd]
      S: time[hhmm]                 # « hhmm seulement » (D992) — le nchar(6) ne porte pas de secondes

# Les plans des articles — le connecteur file en complément du storage
# source (D883) : le nom du fichier vient d'ARTICLE (ARCTFICPLA), le
# contenu du répertoire des plans (D634 — get_file).
plans:
  type: file
  class: file_std
  parameters:
    directory: ${PLANS_DIRECTORY}

# L'authentification — Microsoft 365 (D692 : la classe azure_ad ; la
# question 10 du cadrage, D945) : les utilisateurs se connectent avec
# leur compte de l'entreprise ; l'affectation aux groupes reste un acte
# d'administration (D341). Les paramètres de la classe sont ceux de
# l'exemple (en proposition) ; le secret est un paramètre marqué * (D944).
authentication:
  class: azure_ad
  parameters:
    tenant: ${AZURE_TENANT}
    client_id: ${AZURE_CLIENT_ID}
    client_secret*: ${AZURE_CLIENT_SECRET}

# Le mail sortant — le relais de l'entreprise (D628 : smtp_std, la
# condition indispensable D626 vérifiée au démarrage ; D945) : les
# rapports des règles (D929) et les alertes partent par lui.
smtp:
  class: smtp_std
  parameters:
    host: ${SMTP_HOST}
    port: 587
    from: ${SMTP_FROM}
    password*: ${SMTP_PASSWORD}
