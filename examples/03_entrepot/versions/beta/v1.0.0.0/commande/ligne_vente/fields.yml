# --- l'identité (LCKTLIGNE, LCKTPSF) ---

numero:
  # LCKTLIGNE nchar(3)
  type: integer[1..]
  required: true
  label:
    fr: Ligne

# --- l'article ---

article:
  # LCCTCODART + LCCTCOMART — la référence (D396), résolue par la clé au
  # mapping (D654)
  type: technique.article
  required: true
  label:
    fr: Article

# la désignation de la ligne n'est plus ici : « le commentaire d'une ligne
# d'une commande d'achat ou de vente est présent dans une autre table
# LIBEL40… que nous ne décrirons pas ici » (D989) — LIBEL40 ignorée, les
# deux libellés de la ligne non lus

# --- les quantités ---

quantite:
  # LCCNQTECDE
  type: decimal
  required: true
  label:
    fr: Quantité commandée

unite:
  # LCCTUNICDE
  type: text[..2]
  label:
    fr: Unité

quantite_expediee:
  # LCCNQTEEXP
  type: decimal
  required: true
  default: 0
  label:
    fr: Quantité expédiée

quantite_lancee:
  # LCCNQTELAN — lancée en fabrication
  type: decimal
  label:
    fr: Quantité lancée

# --- les prix — amount à la devise de la ligne (LCCTDEVISE — D771) ---

prix_brut:
  # LCCNPUBRUT + LCCTDEVISE
  type: amount
  label:
    fr: Prix unitaire brut

prix_net:
  # LCCNPUNET + LCCTDEVISE — le prix après remises
  type: amount
  required: true
  label:
    fr: Prix unitaire net

prix_revient:
  # LCCNPUREVI — le prix de revient de la ligne : restreint (D859)
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix de revient

# --- les délais — des jours : « sur les commandes, il n'y a pas d'heures », la colonne S est la semaine, déduite du jour (D1000) ---

delai_demande:
  # LCCJDELDDE — la date demandée par le client
  type: date
  label:
    fr: Délai demandé

delai_accuse:
  # LCCJDELARR — le délai accusé (LCCSDELARR, la semaine, ignorée)
  type: date
  label:
    fr: Délai accusé

delai_expedition:
  # LCCJDELEXP — l'expédition prévue (LCCSDELEXP, la semaine, ignorée)
  type: date
  label:
    fr: Expédition prévue

delai_fabrication:
  # LCCJDELFAB (LCCSDELFAB, la semaine, ignorée)
  type: date
  label:
    fr: Fin de fabrication prévue

# --- l'état ---

statut:
  # LCCTSTATUT nchar(2) — les valeurs de PMI (D1002) : « A » acompte / en
  # cours, « » (vide) non traité, « S » soldé, « T » terminé, « P »
  # partiel — la liste close en énuméré (D883), les codes traduits à la
  # règle (D893) ; LCCTETACDE porte un état aux valeurs inconnues,
  # ignorée. Le vide de PMI est le nul du texte (D366) : non traité
  type: enum
  required: true
  label:
    fr: Statut
  values:
    non_traite:
      label:
        fr: Non traitée
    en_cours:
      label:
        fr: En cours
    partielle:
      label:
        fr: Partiellement livrée
    soldee:
      label:
        fr: Soldée
    terminee:
      label:
        fr: Terminée

# ------ Champs calculés ------

devise:
  # la devise de la commande, par l'accès montant (D760)
  type: text[3]
  formula: owner.devise
  label:
    fr: Devise

client:
  # le client de la commande, par l'accès montant (D760) — la ligne le
  # porte pour les listes calculées de l'article (D997 :
  # commandes_vente.last().client)
  type: tiers.client
  formula: owner.client
  label:
    fr: Client

montant:
  # la valeur de la ligne — amount * decimal (D581)
  type: amount
  formula: prix_net * quantite
  label:
    fr: Montant

marge:
  # la marge unitaire — réservée à la direction (D859) ; amount - amount
  # à devise compatible (D581)
  type: amount
  formula: prix_net - prix_revient if prix_revient != null
  confidentiality: ${settings.confidentiality.direction}
  label:
    fr: Marge unitaire

reste_a_livrer:
  type: decimal
  formula: quantite - quantite_expediee
  label:
    fr: Reste à livrer

en_retard:
  # le tableau de bord (D859) — l'expédition prévue dépassée, la ligne
  # non soldée
  type: boolean
  formula: delai_expedition < context.today and statut not in ["soldee", "terminee"]
  label:
    fr: En retard
