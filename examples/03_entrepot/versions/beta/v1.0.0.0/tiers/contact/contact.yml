# Le contact — la table CONTACT de PMI (CTKTSOC, CTKNID ; le tiers par
# CTCTTYPCPT, C ou F, et CTCTCOMPTE — D950) : les personnes chez le
# tiers. La composition du tiers (D399) ;
# les champs nominatifs portent le marquage RGPD (D695 — personal) :
# l'anonymisation (D696) et la rétention (D698) savent où frapper —
# le premier exemple au RGPD.
name: contact
description: Une personne chez un tiers — son rôle et ses coordonnées
label: "{prenom} {nom}"
identity: [identifiant]
history: true

fields:
  identifiant:
    # CTKNID int — l'identifiant de PMI
    type: integer[1..]
    required: true
    label:
      fr: Identifiant

  civilite:
    # CTCTCIVILI nchar(6) — la civilité de PMI, traduite au mapping (D893)
    type: enum
    label:
      fr: Civilité
    values:
      madame:
        label:
          fr: Madame
      monsieur:
        label:
          fr: Monsieur

  nom:
    # CTCTNOM
    type: text[..40]
    required: true
    rgpd: personal
    searchable: mutualizable[qui]
    label:
      fr: Nom

  prenom:
    # CTCTPRENOM nchar(20)
    type: text[..40]
    rgpd: personal
    label:
      fr: Prénom

  fonction:
    # CTCTFONCTI nchar(3) — le code de fonction de PMI ; le libellé au
    # mapping
    type: text[..40]
    label:
      fr: Fonction
    placeholder:
      fr: Responsable des achats

  telephone:
    # CTCTNOTEL1 — la première des six paires type/numéro (D950)
    type: phone
    rgpd: personal
    label:
      fr: Téléphone

  portable:
    # CTCTNOTEL2 — la seconde paire (D950)
    type: phone
    rgpd: personal
    label:
      fr: Portable

  email:
    # CTCTMAIL1
    type: email
    rgpd: personal
    label:
      fr: Courriel

  anniversaire:
    # CTCJANNIV — AAAAMMJJ au masque ; une date de naissance est
    # personnelle (D695)
    type: date
    rgpd: personal
    label:
      fr: Date de naissance

  actif:
    # CTCTACTIF — O actif ; le vide vaut actif (D950)
    type: boolean
    required: true
    default: true
    label:
      fr: Actif

  date_creation:
    # CTCJCRE
    type: date
    label:
      fr: Créé le
