# La phase 4 — les ravitaillements : toutes les lignes SAUF l'origine
# (la ligne 1, devenue le km_initial). Le numéro = le rang moins
# l'origine (D831/D841 — la clé au sein du véhicule). Les colonnes
# calculées du classeur ne s'importent pas : le modèle les refait.

consommation:
  to: transport.consommation
  filter: connector.line > 1
  parent:
    vehicule: immatriculation              # le possesseur par son identité (D850)
  fields:
    numero:        connector.line - 1
    date:          date
    total_km:      total_km
    quantite:      quantite_n
    prix_unitaire: prix_unitaire_n
