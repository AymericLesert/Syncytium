# L'échéance — la ligne du tableau CREDIT | LOA.
# Les lignes sont ENGENDRÉES par l'opération du morceau 3 (le patron
# creer_releve de la banque) : les formules du classeur — la mensualité
# constante, intérêt = reste × taux périodique, amortissement =
# mensualité − intérêt — vivent dans le hook générateur, pas dans la
# grammaire (D826 : « des calculés déclarés, pas une saisie »).
# La seule saisie de la vie courante : la coche « Payé ».
name: echeance
label: "${name}"
fields:
  numero:        { type: integer[1..], required: true }   # le rang (1..durée)
  date:          { type: date, required: true }           # mensuelle depuis la première échéance
  interet:       { type: amount, currencies: [EUR, FRF] } # crédit — reporté par le générateur
  amortissement: { type: amount, currencies: [EUR, FRF] } # crédit
  assurance:     { type: amount, currencies: [EUR, FRF] } # crédit — 34,40
  mensualite:    { type: amount, currencies: [EUR, FRF], required: true }   # 473,86 / 434,48
  paye:          boolean                                  # la coche « x » du classeur
  # le reste dû en début de période : crédit — le capital moins l'amorti,
  # LOA — les loyers restants (B(n) = B(n−1) − F(n−1) du classeur)
  reste_du:
    type: amount
    currencies: [EUR]
    formula: owner.financement.select(credit: owner.capital - owner.echeances.sum(amortissement if numero < me.numero), loa: owner.echeances.sum(mensualite if numero >= me.numero))
  interet_euro:
    type: amount
    currencies: [EUR]
    formula: interet.currency.select(EUR: interet, FRF: amount(interet.value / 6.55957, EUR))
  mensualite_euro:
    type: amount
    currencies: [EUR]
    formula: mensualite.currency.select(EUR: mensualite, FRF: amount(mensualite.value / 6.55957, EUR))
