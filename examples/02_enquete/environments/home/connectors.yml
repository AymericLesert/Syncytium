# Les connecteurs de l'environnement : la base, l'authentification et le mail. Chaque connecteur porte sa famille
# (type), son implémentation (class) et, au besoin, les paramètres de l'implémentation ; quand le nom du connecteur est
# sa famille, le type ne s'écrit pas.

# La base du foyer
# Le natif du domestique : un fichier SQLite, sans paramètre.
database:
  type: storage
  class: sqlite

# L'authentification
# Pas de secrets dans la famille : aucune.
authentication:
  class: none

# Le mail sortant
# Muet, assumé.
smtp:
  class: none
