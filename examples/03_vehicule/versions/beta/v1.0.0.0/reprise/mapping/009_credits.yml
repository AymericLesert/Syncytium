# La phase 9 — l'ancrage du crédit : le premier mois et le jour du
# prélèvement à la première échéance (l'intérêt rempli = le crédit,
# D847). Une règle par fichier — la clé YAML ne se répète pas.

echeance:
  to: transport.vehicule
  filter: connector.line = 1 and interet != null
  fields:
    immatriculation: immatriculation   # l'identité alimentée — la mise à jour (D930)
    premier_mois:  date
    jour_echeance: date.day
