# Le module banque
# Le compte bancaire du foyer : les comptes, leurs écritures, les référentiels des budgets et des lieux.
name: banque

# La description du module
description:
  fr: La gestion des comptes bancaires du foyer
  en: The household's bank accounts
  es: La gestión de las cuentas bancarias del hogar

# Les entités du module
# Les chemins sont relatifs à ce fichier ; les deux référentiels partagent un dossier.
entities:
  - ~{compte/compte.yml}
  - ~{ecriture/ecriture.yml}
  - ~{referentiel/budget.yml}
  - ~{referentiel/lieu.yml}
