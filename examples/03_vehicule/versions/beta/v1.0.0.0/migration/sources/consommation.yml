# Le nom de l'entité source
# La feuille CONSOMMATION, lue à la carte : connector.line est le rang de la ligne dans la plage, la ligne vivante. Les
# entêtes diffèrent entre le thermique et l'électrique : chaque colonne porte son entête (label), et les colonnes
# absentes d'un classeur restent nulles ; les colonnes calculées du classeur — les kilomètres, la consommation, le prix
# total — ne sont pas lues, le modèle les recalcule.
name: consommation

# La description de l'entité source
description: Les lignes de ravitaillement — le plein du thermique, la charge de l'électrique

# Les colonnes
# Le connecteur expose les colonnes de la plage et la plaque, une cellule d'un autre onglet répétée sur chaque
# ligne : la jointure des règles au véhicule. La source ajoute des descriptions et les calculés de normalisation,
# qui réunissent les colonnes du thermique et de l'électrique.
fields:

  immatriculation:
    description: La plaque du classeur.

  total_km:
    description: Le compteur au ravitaillement.

  nb_litres:
    description: Le thermique.

  charge:
    description: L'électrique.

  quantite_n:
    formula: ifnull(nb_litres, charge)
    description: La quantité, litres ou kWh — les deux colonnes en une.

  prix_unitaire_n:
    formula: ifnull(prix_litre, prix_kwh)
    description: Le prix unitaire, du litre ou du kWh — les deux colonnes en une.
