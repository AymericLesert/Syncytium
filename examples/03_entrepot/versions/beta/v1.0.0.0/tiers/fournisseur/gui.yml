# Les surfaces du fournisseur — le lot 1 du morceau 5 ; un tiers (D353),
# la recherche par le mutualisé « qui » (D780). Lecture seule (D882).

lists:
  fournisseurs:                      # le menu : tiers.fournisseur
    title: { fr: "Les fournisseurs" }
    searchable: [ qui, pays, actif ]
    columns: [ code, nom, abrege, pays, telephone, email, delai_livraison, actif, bloque ]
    sort: [nom]
    selection: 1..
    exports: [ csv, 'excel[fournisseurs.xlsx]' ]

forms:
  fiche:
    title: "{code} — {nom}"
    mode: read-only
    page:
      - sections:
          layout: row
          items:
            - section:
                title: { fr: Identité }
                items: [ 'field[code]', 'field[nom]', 'field[abrege]', 'field[siret]', 'field[siren]', 'field[tva]', 'field[actif]', 'field[bloque]' ]
            - section:
                title: { fr: Coordonnées }
                items: [ 'field[adresse]', 'field[pays]', 'field[telephone]', 'field[fax]', 'field[email]', 'field[site]' ]
      - sections:
          layout: row
          items:
            - section:
                title: { fr: Conditions }
                items: [ 'field[devise]', 'field[langue]', 'field[echeance]', 'field[base_echeance]', 'field[delai_livraison]', 'field[iban]', 'field[bic]' ]   # le bancaire : restreint (D885)
            - section:
                title: { fr: Suivi }
                items: [ 'field[note_interne]', 'field[engage]', 'field[date_creation]', 'field[date_modification]' ]
      - tabs:
          items:
            - tab: { title: { fr: Adresses }, items: [ 'field[adresses]' ] }
            - tab: { title: { fr: Contacts }, items: [ 'field[contacts]' ] }
            - tab: { title: { fr: Articles }, items: [ 'field[articles]' ] }
            - tab: { title: { fr: Commandes }, items: [ 'field[commandes]' ] }
