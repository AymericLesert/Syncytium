# La ligne de commande de vente — la table LCOMCLI de PMI (124
# colonnes) : la composition de la commande (D399). L'identité au sein
# de la commande : le numéro de ligne (LCKTLIGNE) ; LCKTPSF est l'indice
# de la commande, la clé du possesseur, que le morceau 2 lisait comme un
# sous-numéro (D951). La ligne référence l'article — la référence (D396),
# jamais une composition : l'article supprimé ne la touche pas (D882).
name: ligne_vente
description: Une ligne de commande de vente — l'article, les quantités, le prix, les délais
label: "{numero} — {article}"
identity: [numero]
history: true

fields: ~{fields.yml}

# aucune validation sur les quantités (D1006) : « les quantités sont à
# titre indicatif, puis utilisées pour vérifier la validité d'un mode
# opératoire ou identifier les cas limites de nos processus » — une
# expédition au-delà de la commande s'observe, elle ne se rejette pas ;
# ni sur les prix : « le net peut dépasser le brut, en effet »
