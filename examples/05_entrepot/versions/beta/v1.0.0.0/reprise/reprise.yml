# La reprise des données de PMI — la migration déclarée (D662/D664) : le
# connecteur source, les entités sources (un fichier par table, au nom de
# la table — D947), les règles (le morceau 4), les opérations périodiques
# (D943). L'ordre de définition est l'ordre d'exécution (D662).

cegid:
  connector: cegid                      # le storage sqlserver de l'environnement (D617)
  buffer: temporaire                    # la base miroir, en mémoire (D1044/D1045) — supprimée à la fin de la migration
  storage:                              # le fichier SQLite de chaque passage (D1066/D1072)
    directory: ${SYNCYTIUM_MIGRATION_DIRECTORY}
    filename: ${now:yyyy-mm-dd}-cegid.syncytium   # évalué à chaque exécution (D1069)
    cleanup:                            # la rétention générique des fichiers (D1070/D1071)
      interval: 86400                   # gardé pour la forme commune — le nettoyage suit aussi chaque migrate
      pattern: '^(?<date>[0-9]{4}-[0-9]{2}-[0-9]{2})-cegid\.syncytium$'
      retention: 90d                    # le défaut, écrit pour l'exemple (D1068)
  mode: relative                        # les conformes portés, les erreurs au rapport (D671)
  reset: false                          # jamais d'effacement : l'historique et l'enrichissement tiennent (D941)
  source:
    - ~{source/.*\.yml}                 # les tables analysées — le regex (D806) ; les tables ignorées
                                        # pour l'exemple s'y déclarent aussi (D657/D869)
  mapping:
    - ~{mapping/[0-9]+_.*\.yml}         # les règles, à venir au morceau 4 — l'ordre alphabétique fait les étapes (D665)
  operations:                           # les opérations périodiques de la migration (D943)
    delta_nocturne:
      every: daily[02:00]               # le calendaire (D434) — l'heure à fixer avec l'entreprise
      operations: [ migrate ]           # le hook du socle (D667), sur cette migration
    relecture_complete:
      every: weekly[saturday at 23:00]  # la nuit de samedi (D881) : le migrate du dimanche relit tout
      operations: [ reset_coverage(MVTSTO), reset_coverage(ECOMCLI), reset_coverage(LCOMCLI), reset_coverage(ECOMFOU), reset_coverage(LCOMFOU) ]
