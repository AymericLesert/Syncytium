# L'identification

nom:
  type: text[..40]
  label: Nom
  placeholder: Partner Outdoor
  hint: La marque et le modèle — un classeur, un véhicule, un nom.
  description: Le réel ne sépare pas la marque du modèle ; le nom les porte ensemble.

immatriculation:
  type: text[..12]
  required: true
  label: Immatriculation
  placeholder: AA-999-AA
  hint: La plaque du véhicule, au format du moment.
  description: L'identité du véhicule ; les formats anciens interdisent un masque unique.

photo:
  type: image[512x512]
  label: Photo
  hint: Le visage du véhicule — la vignette des listes et de la carte.
  description: Le visage porté par l'image ; la vignette est automatique.

type:
  type: enum
  required: true
  label: Type de véhicule
  hint: Il porte l'unité de la consommation — les litres du thermique, les kWh de l'électrique.
  description: L'unité vit dans le type, pas dans la valeur.
  values:
    thermique:  { label: Thermique }
    electrique: { label: Électrique }

devise:
  type: enum
  required: true
  label: Devise
  hint: Visuelle seulement — elle habille l'affichage des montants, la valeur reste nue.
  values:
    euro:  { label: "€" }
    franc:
      label: "F"
      description: Les classeurs antérieurs au passage à l'euro.

statut:
  type: enum
  required: true
  default: creation
  label: Statut
  hint: La vie du véhicule — Création, Actif, Clôture ; la vente clôt sans retour.
  description: >-
    La naissance à la valeur par défaut, l'activation libre, la clôture au cliquet dès que la vente est posée ;
    l'archive ne se réécrit pas.
  values:
    creation:
      label: Création
      allow: [create, read, update, delete]
      promote:
        - to: actif
    actif:
      label: Actif
      allow: [create, read, update]
      promote:
        - to: cloture
          when: date_vente != null
      description: Le journal s'écrit — create est la création des composants.
    cloture:
      label: Clôture
      allow: [read]
      description: L'archive — la vie ne se réécrit pas.

mode_achat:
  type: text[..40]
  label: Mode d'achat
  placeholder: Acheté concessionnaire

lieu_achat:
  type: text[..60]
  label: Lieu d'achat
  placeholder: Garage Peugeot à Dôle

date_achat:
  type: date
  required: true
  label: Date d'achat

date_vente:
  type: date
  label: Date de vente
  hint: La vente ou la restitution — elle bascule le statut en Clôture et fige le véhicule.
  description: >-
    Après la clôture, elle ne se modifie plus : l'état ne porte que la lecture, sans retour, et aucune opération n'y
    touche.

lieu_vente:
  type: text[..60]
  label: Lieu de vente
  hint: Nul tant que le véhicule vit — le site de vente, la reprise du concessionnaire…

km_initial:
  type: integer[0..]
  required: true
  label: Kilométrage initial
  hint: Le compteur au retrait du véhicule — la première ligne de consommation en part.

# Le financement — à plat, comptant, crédit ou LOA

financement:
  type: enum
  label: Financement
  values:
    comptant: { label: Comptant }
    credit:   { label: Crédit }
    loa:      { label: LOA }

capital:
  type: decimal
  label: Capital emprunté
  hint: Le crédit seulement — 24 500.

taux_annuel:
  type: percentage
  label: Taux annuel
  hint: Le taux nominal du crédit — 6,187.

assurance_mensuelle:
  type: decimal
  label: Assurance mensuelle
  hint: Le crédit seulement — 34,40 par mois, en sus de la mensualité.

mensualite:
  type: decimal
  label: Mensualité
  hint: La mensualité de la LOA — celle du crédit se calcule à l'échéancier.

duree_contrat:
  type: integer[0..]
  label: Durée du contrat
  hint: Le nombre d'échéances du contrat — 60 mensualités, 36 loyers.
  description: L'intention contractuelle, que le générateur engendre ; le nombre d'échéances dit le réel compté.

premier_mois:
  type: date[yyyy-mm]
  label: Premier mois
  hint: Le premier mois du financement — 2016-02, 2023-10.

jour_echeance:
  type: integer[1..31]
  label: Jour d'échéance
  hint: Le jour du mois du prélèvement — le 10, le 5.
  description: La coche Payé des échéances s'en déduit.

km_annuel:
  type: integer[0..]
  label: Kilométrage annuel
  hint: Le forfait de la LOA — 23 000 km/an, il nourrit le « km prévu ».

# Les compositions — le grain d'écriture

consommations:
  type: list of consommation
  label: Consommations

entretiens:
  type: list of entretien
  label: Entretiens

revisions:
  type: list of revision
  label: Révisions
  hint: L'échéancier des règles.

echeances:
  type: list of echeance
  label: Échéances
  description: >-
    Engendrées à la validation du financement par creer_echeancier ; closes à la vente par clore_echeancier, qui
    supprime les non payées.

# Les champs calculés

duree_echeances:
  type: integer
  formula: echeances.count()
  label: Nombre d'échéances
  hint: 60 mensualités du crédit, 34 loyers de la LOA — le compte des échéances.

unite:
  type: text
  formula: 'type.select(thermique: "litres", electrique: "kWh")'
  label: Unité
  hint: L'unité de la quantité — litres ou kWh, dérivée du type de véhicule.

# Le bilan — tout calculé, les formules de la feuille BILAN

km_courant:
  type: integer
  formula: iif(entretiens.max(km) > consommations.max(total_km), entretiens.max(km), consommations.max(total_km))
  label: Kilométrage courant
  hint: Le plus grand compteur vu — consommations et entretiens confondus.

nb_jours:
  type: duration
  formula: consommations.sum(nb_jours)
  label: Nombre de jours
  hint: La durée de vie suivie — la somme des intervalles entre ravitaillements.

km_total:
  type: integer
  formula: consommations.sum(km)
  label: Kilomètres parcourus

quantite_totale:
  type: decimal
  formula: consommations.sum(quantite)
  label: Quantité totale
  hint: Les litres ou kWh consommés sur la vie du véhicule.

conso_moyenne:
  type: decimal
  formula: 100 * quantite_totale / km_total
  label: Consommation moyenne
  hint: Aux 100 km — litres ou kWh selon le type.

duree_moyenne:
  type: decimal
  formula: nb_jours.days / consommations.count()
  label: Durée moyenne d'un plein
  hint: En jours — l'intervalle moyen entre deux ravitaillements.

total_entretien:
  type: decimal
  formula: entretiens.sum(montant)
  label: Total achat et entretien
  hint: L'achat et la vente sont des lignes du journal.

total_energie:
  type: decimal
  formula: consommations.sum(prix_total)
  label: Total énergie

cout_financement:
  type: decimal
  formula: >-
    financement.select(credit: echeances.sum(interet if paye), loa: echeances.sum(mensualite if paye), comptant: 0)
  label: Coût du financement
  hint: Les intérêts payés du crédit, ou les loyers payés de la LOA.

cout_total:
  type: decimal
  formula: total_entretien + total_energie + cout_financement
  label: Coût total

prix_energie_km:
  type: decimal
  formula: total_energie / km_total
  label: Prix de l'énergie au km

prix_km:
  type: decimal
  formula: cout_total / km_total
  label: Prix de revient au km

prix_jour:
  type: decimal
  formula: cout_total / nb_jours.days
  label: Prix de revient journalier
