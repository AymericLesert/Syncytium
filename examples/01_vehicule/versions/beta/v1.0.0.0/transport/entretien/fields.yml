numero:
  # le compteur auto (D409) — masqué aux surfaces
  type: counter

date:
  type: date
  required: true
  label:
    fr: Date

designation:
  # le multi-ligne déduit de la taille (D366)
  type: text[..200]
  required: true
  label:
    fr: Désignation
  placeholder:
    fr: Changement du pneu avant droit
  hint:
    fr: Le fait marquant — un frais, un événement, l'achat, la vente.

montant:
  # la devise est visuelle (D832)
  type: decimal
  label:
    fr: Montant
  hint:
    fr: Optionnel — l'événement sans montant est licite, la vente en recette négative.

km:
  type: integer[0..]
  label:
    fr: Kilométrage

revision:
  # l'arbitrage : la référence à la règle n'avait pas d'intérêt, le
  # booléen suffit ; les révisions faites restent des lignes du journal (D831)
  type: boolean
  label:
    fr: Révision ?
  hint:
    fr: La ligne est une révision — sinon, une intervention hors révision.
