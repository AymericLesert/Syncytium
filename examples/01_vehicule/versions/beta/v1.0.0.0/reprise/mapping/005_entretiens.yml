# La phase 5 — le journal de vie, tel quel (les montants optionnels,
# la vente en négatif). La règle sans clé = la création seule (D825 —
# admise : absolute + reset). Le booléen revision naît faux — le
# classeur ne marque pas ses révisions (les lignes « Entretien
# 300.000 km » restent des lignes) ; le marquage viendra de l'usage.

# Les lignes de continuation de la Zoe (la désignation étalée, sans
# date) NE SE FILTRENT PAS : elles échouent à la cible (date requise)
# et la migration les signale en anomalie — l'utilisateur ajuste le
# classeur et rejoue (D851, l'esprit D183 : jamais de perte silencieuse).
entretien:
  to: transport.entretien
  parent:
    vehicule: immatriculation
  fields:
    date:        date
    designation: designation
    montant:     montant
    km:          km
