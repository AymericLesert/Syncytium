# Les versions éligibles au mode beta

# pas de déclaration orpheline (D805) — les versions beta s'essaient sur
# le staging, la copie de PMI (D945)
environment: staging

# Le pattern regex des versions (D806) — le standard que le projet se fixe
versions:
  - v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/version\.yml
