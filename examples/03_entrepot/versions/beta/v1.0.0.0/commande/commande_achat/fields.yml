# --- l'identité (ECKTNUMERO, ECKTINDICE) ---

numero:
  # ECKTNUMERO — le counter surchargé par la migration (D883)
  type: counter
  format: "{counter:000000}"
  label:
    fr: Numéro

indice:
  # ECKTINDICE — la révision ; les lignes la portent sous LCKTPSF (D951)
  type: text[..3]
  required: true
  default: "000"
  label:
    fr: Indice

# --- le fournisseur et les références ---

fournisseur:
  # ECCTCODE — la référence au fournisseur (D396)
  type: tiers.fournisseur
  required: true
  label:
    fr: Fournisseur

reference_fournisseur:
  # ECCTREFCDE — l'accusé de réception du fournisseur
  type: text[..20]
  label:
    fr: Référence fournisseur

# --- les dates ---

date:
  # ECCJCRE
  type: date
  searchable: range   # (D784)
  searchable: range   # (D784)
  required: true
  label:
    fr: Date

date_echeance:
  # ECCJECHFOR
  type: date
  label:
    fr: Échéance

derniere_reception:
  # ECCJDERBL — chez le fournisseur, le dernier bon est une réception
  type: date
  label:
    fr: Dernière réception

derniere_facture:
  # ECCJDERFA
  type: date
  label:
    fr: Dernière facture

# --- les conditions ---

devise:
  # ECCTDEVISE
  type: text[3]
  required: true
  label:
    fr: Devise

taux_change:
  # ECCNTXDEVI
  type: decimal
  decimals: 6
  label:
    fr: Taux de change

# le statut de l'entête n'est pas repris : « ECCTSTATUT peut être ignoré »
# (D1002) — « l'état d'une commande se déduit de l'état des lignes » : le
# calculé statut, plus bas (D1003)

# --- la composition (D399) ---

lignes:
  # LCOMFOU
  type: list of ligne_achat
  label:
    fr: Lignes

# ------ Champs calculés ------

statut:
  # « l'état d'une commande se déduit de l'état des lignes » (D1003) — un
  # calculé, jamais repris (ECCTSTATUT ignorée, D1002) : non traitée tant
  # qu'aucune ligne ne l'est, soldée quand toutes le sont (soldée ou
  # terminée), en cours entre les deux ; les cas en chaîne par
  # « valeur if condition else … » (forme mienne, D1003)
  type: enum
  formula: >-
    "non_traite" if lignes.count(statut != "non_traite") = 0
    else "soldee" if lignes.count(statut not in ["soldee", "terminee"]) = 0
    else "en_cours"
  label:
    fr: Statut
  values:
    non_traite:
      label:
        fr: Non traitée
    en_cours:
      label:
        fr: En cours
    soldee:
      label:
        fr: Soldée

total:
  # les montants d'achat sont restreints (D859)
  type: amount
  formula: lignes.sum(montant)
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Total

nombre_lignes:
  type: integer
  formula: lignes.count()
  label:
    fr: Lignes

reste_a_recevoir:
  type: decimal
  formula: lignes.sum(quantite - quantite_recue)
  label:
    fr: Reste à recevoir
