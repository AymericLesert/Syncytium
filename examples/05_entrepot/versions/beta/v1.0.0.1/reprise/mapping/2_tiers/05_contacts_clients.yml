# Les contacts des clients
CONTACT:
  description: >-
    Les contacts des clients : une règle par sorte de tiers, filtrée sur le type de compte ; le client se retrouve par
    son code. Les champs nominatifs sont des données personnelles.
  to: tiers.contact
  filter: CTCTTYPCPT = "C"
  parent: { client: CTCTCOMPTE }
  fields:
    identifiant:  CTKNID
    civilite:     'CTCTCIVILI.select(M: "monsieur", MME: "madame")'
    nom:          CTCTNOM
    prenom:       CTCTPRENOM
    fonction:
      formula: >-
        CTCTFONCTI.select(DIR: "Direction", ACH: "Acheteur", COM: "Commercial",
        TEC: "Technicien", "...": CTCTFONCTI)
      description: Le libellé de la fonction ; un code inconnu se reprend tel quel.
    telephone:
      formula: CTCTNOTEL1
      description: Le premier numéro de PMI.
    portable:
      formula: CTCTNOTEL2
      description: Le second numéro de PMI.
    email:        CTCTMAIL1
    anniversaire: CTCJANNIV
    actif:
      formula: CTCTACTIF != "N"
      description: Vide, le contact est actif.
    date_creation: CTCJCRE
  report:
    when: [migration]
    to: [commercial]
    by: [notification, mail]
