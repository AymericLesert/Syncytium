# --- l'identité (ARKTCODART, ARKTCOMART) ---

code:
  # ARKTCODART nchar(18)
  type: text[..18]
  required: true
  label:
    fr: Code article
  placeholder:
    fr: PIE-00123
  hint:
    fr: Le code de l'article chez PMI — avec son complément, il l'identifie.

complement:
  # ARKTCOMART nchar(6) — souvent vide ; l'identité le comprend
  type: text[..6]
  label:
    fr: Complément
  hint:
    fr: Le complément du code — vide pour la plupart des articles.

# --- la désignation (ARCTLIB01, ARCTLIB02) ---

libelle:
  # ARCTLIB01
  type: text[..40]
  required: true
  label:
    fr: Libellé
  placeholder:
    fr: Bride acier 40 mm
  hint:
    fr: La désignation principale.

libelle_secondaire:
  # ARCTLIB02
  type: text[..40]
  label:
    fr: Libellé secondaire
  hint:
    fr: La seconde ligne de désignation, souvent une précision technique.

# --- la classification — les listes closes de PMI en énumérés (D883) ;
# les clés sont celles de l'entrepôt, les codes PMI s'y traduisent au
# mapping (le morceau 4) ---

type:
  # ARCTTYPART — le type d'article
  type: enum
  required: true
  label:
    fr: Type d'article
  hint:
    fr: Ce que l'article est pour l'entreprise — fabriqué, acheté, sous-traité ou fantôme.
  values:
    fabrique:
      label:
        fr: Fabriqué
    achete:
      label:
        fr: Acheté
    sous_traite:
      label:
        fr: Sous-traité
    fantome:
      label:
        fr: Fantôme
      description:
        fr: Un niveau de nomenclature sans existence en stock.

famille:
  # ARCTCODFAM nchar(4) — la liste close se relève à l'analyse (D883)
  type: enum
  required: true
  label:
    fr: Famille
  hint:
    fr: La famille de l'article — les valeurs de la liste close de PMI.
  values:
    matiere:
      label:
        fr: Matière première
    composant:
      label:
        fr: Composant
    produit_fini:
      label:
        fr: Produit fini
    consommable:
      label:
        fr: Consommable

sous_famille:
  # ARCTCOSFAM nchar(4)
  type: enum
  label:
    fr: Sous-famille
  hint:
    fr: Le second niveau de classification.
  values:
    acier:
      label:
        fr: Acier
    aluminium:
      label:
        fr: Aluminium
    plastique:
      label:
        fr: Plastique
    visserie:
      label:
        fr: Visserie
    autre:
      label:
        fr: Autre

gestion:
  # ARCTGSAV — le code de gestion (D883)
  type: enum
  label:
    fr: Code de gestion
  hint:
    fr: La façon dont l'article est géré — sur stock, à la commande, sans stock.
  values:
    stock:
      label:
        fr: Sur stock
    commande:
      label:
        fr: À la commande
    sans_stock:
      label:
        fr: Sans stock

matieres:
  # ARCTCODMA1 … ARCTCODMA9 — neuf colonnes, une liste (D362)
  type: list of text[..6]
  label:
    fr: Codes matière
  hint:
    fr: Les matières de l'article — jusqu'à neuf chez PMI.

# --- les unités et les dimensions ---

unite_stock:
  # ARCTUNISTO nchar(2)
  type: text[..2]
  required: true
  label:
    fr: Unité de stock
  placeholder:
    fr: PC
  hint:
    fr: L'unité dans laquelle l'article est tenu en stock.

unite_commande:
  # ARCTUNICDE
  type: text[..2]
  label:
    fr: Unité de commande

poids:
  # ARCNPDSUNI — le poids unitaire, l'unité au type mesure (D391)
  type: measure
  units: [kg, g]
  label:
    fr: Poids unitaire
  hint:
    fr: Le poids d'une unité — en kilogrammes.

longueur:
  # ARCNLONGUE
  type: measure
  units: [mm]
  label:
    fr: Longueur

largeur:
  # ARCNLARGEU
  type: measure
  units: [mm]
  label:
    fr: Largeur

epaisseur:
  # ARCNEPAISS
  type: measure
  units: [mm]
  label:
    fr: Épaisseur

volume:
  # ARCNVOLUNI
  type: measure
  units: [dm3, m3]
  label:
    fr: Volume unitaire

# --- les codes-barres — la sortie code-barres (D300) se construit sur
# ces valeurs ---

ean13:
  # ARCTEAN13
  type: text[13]
  mask: "9999999999999"
  label:
    fr: EAN 13

# --- le stock de référence ---

stock_minimum:
  # ARCNSTOMIN
  type: decimal
  label:
    fr: Stock minimum
  hint:
    fr: Le seuil de réapprovisionnement.

stock_maximum:
  # ARCNSTOMAX
  type: decimal
  label:
    fr: Stock maximum

quantite_economique:
  # ARCNQTECO
  type: decimal
  label:
    fr: Quantité économique
  hint:
    fr: La quantité de commande ou de lancement qui minimise le coût.

# --- les prix — les montants en amount à devise dans la valeur (D771/
# D882) ; les champs financiers restreints aux achats et à la direction
# (D859 — la confidentialité au champ D25/D364, resserrée par groupes
# D26) : le profil nommé des settings, référencé par l'interpolation
# de la configuration (D885 — settings.yml : financier) ---

prix_revient:
  # ARCNPRS — le prix de revient standard
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix de revient
  hint:
    fr: Le prix de revient standard — réservé aux achats et à la direction.

prix_moyen_pondere:
  # ARCNPMP
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix moyen pondéré
  hint:
    fr: Le PMP du stock — réservé aux achats et à la direction.

prix_achat:
  # ARCNPUACH1 — le prix d'achat du premier fournisseur
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix d'achat
  hint:
    fr: Le dernier prix d'achat connu — réservé aux achats et à la direction.

# --- la vie de l'article ---

actif:
  # ARCTBLOCAG — vide = actif, sinon le motif de blocage
  type: boolean
  required: true
  default: true
  label:
    fr: Actif
  hint:
    fr: Faux quand PMI bloque l'article.

date_creation:
  # ARCJCRE — nchar(8) AAAAMMJJ, lue au masque (D820/D866)
  type: date
  label:
    fr: Créé le

date_modification:
  # ARCJMOD
  type: date
  label:
    fr: Modifié le

plans:
  # ARCTFICPLA — le nom du fichier plan ; la liste de pièces jointes
  # remplie par un connecteur file en complément du storage source
  # (D883 — la forme au morceau de la source)
  type: list of file
  extensions: [pdf, dwg, dxf, step]
  label:
    fr: Plans
  hint:
    fr: Les plans de l'article, lus dans le répertoire des plans.

# --- les liens (D399–D405) ---

fournisseurs:
  # ARCTNOFOU1, ARCTNOFOU2 — les fournisseurs habituels : l'association
  # stockée (D400), libre et inter-modules
  type: association with tiers.fournisseur
  label:
    fr: Fournisseurs habituels

nomenclature:
  # la composition (D399) — la nomenclature et la gamme réunies, comme
  # chez PMI (NOMENC : la nature de la ligne dit le composant ou
  # l'opération) ; la composition auto-référencée (D135) : le composant
  # est un article
  type: list of ligne_nomenclature
  label:
    fr: Nomenclature et gamme

tarifs:
  # LA GRILLE TARIFAIRE — l'hypercube (D134/D402, la forme 1 de D895
  # validée par D897) : « le prix unitaire est conditionné par
  # l'article, le client/fournisseur, une tranche » ET une date
  # d'application — trois dimensions, tiers × tranche × date, une
  # cellule par combinaison (D403) ; le temps est une dimension du
  # tuple (les clés typées de D134 — l'extension de D402 : une
  # dimension de valeur à côté des entités nommées). La grille se lit
  # à toute date, le planifié se voit, et « les évolutions de la grille
  # tarifaire dans le temps » se visualisent (le morceau 5). La forme
  # relationnelle de D894 (une entité tarif à clé composée) est retirée
  # (D895–D896 : l'objet naturel au modèle, la traduction au stockage).
  # Le tuple porte un « : » — les guillemets (la règle 1, D892) ; la
  # cellule en bloc (la forme éclatée de D403 — la clé fields: en
  # proposition).
  type: 'list of [tiers.tiers, technique.tranche, date_application: date]'
  fields:
    prix:
      # TACNPU + TACTDEVISE — à devise dans la valeur (D771)
      type: amount
      required: true
      label:
        fr: Prix unitaire
    forfait:
      # TACNFORFAI
      type: amount
      label:
        fr: Forfait
    numero:
      # TAKTTARIF nchar(1) — le numéro de tarif de PMI
      type: text[1]
      label:
        fr: Numéro de tarif
    valide:
      # TACTVALID
      type: boolean
      required: true
      default: true
      label:
        fr: Valide
    commentaire:
      # TACTCOMMEN
      type: text[..20]
      label:
        fr: Commentaire
    # ------ Champs calculés de la cellule (D403 — toute la puissance
    # des champs) ------
    planifie:
      # la cellule à venir — visible avant sa date
      type: boolean
      formula: date_application > context.now
      label:
        fr: Planifié
    en_vigueur:
      # la cellule applicable aujourd'hui pour son tiers et sa tranche :
      # sa date est passée et aucune cellule sœur de même tiers et même
      # tranche à date plus récente ne l'est — any à condition seule
      # (D887), les sœurs par owner (D760), les dimensions par leur nom
      type: boolean
      formula: >-
        valide and date_application <= context.now
        and not owner.tarifs.any(tiers = me.tiers and tranche = me.tranche
        and date_application > me.date_application and date_application <= context.now)
      label:
        fr: En vigueur
  label:
    fr: Grille tarifaire

commandes_vente:
  # l'association dérivée (D405/D882) — les lignes de commande de vente
  # qui portent l'article ; la vérité reste la référence de la ligne
  type: association with commande.ligne_vente if article = me
  label:
    fr: Lignes de commande de vente

commandes_achat:
  type: association with commande.ligne_achat if article = me
  label:
    fr: Lignes de commande d'achat

mouvements:
  # l'accès retour aux mouvements de l'article (D394), nommé en vue
  # dérivée (D405) — l'agrégat d'une formule s'applique à une
  # collection déclarée, jamais à l'entité entière (D891)
  type: association with stock.mouvement if article = me
  label:
    fr: Mouvements de stock

# ------ Champs calculés ------

nombre_composants:
  type: integer
  formula: nomenclature.count(nature = "composant")
  label:
    fr: Composants
  hint:
    fr: Le nombre de composants de la nomenclature.

nombre_operations:
  type: integer
  formula: nomenclature.count(nature = "operation")
  label:
    fr: Opérations
  hint:
    fr: Le nombre d'opérations de la gamme.

temps_gamme:
  # la somme des temps d'ouverture des opérations — une durée (D378)
  type: duration
  formula: nomenclature.sum(temps_ouverture if nature = "operation")
  label:
    fr: Temps de gamme
  hint:
    fr: Le temps total des opérations de la gamme.

dormant:
  # le tableau de bord (D858/D859) — l'article sans mouvement depuis six
  # mois ; le contexte courant (D588) donne la date du jour
  type: boolean
  formula: context.now - derniere_sortie > 180d if derniere_sortie != null
  label:
    fr: Dormant
  hint:
    fr: Aucune sortie de stock depuis six mois.

derniere_sortie:
  # la date du dernier mouvement de sortie — sur l'association dérivée
  # mouvements (D891), le if suffixé sur la valeur (D580)
  type: date
  formula: mouvements.max(date if sens = "sortie")
  label:
    fr: Dernière sortie
