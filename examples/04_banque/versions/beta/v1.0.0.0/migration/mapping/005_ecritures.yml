# Les écritures
budget:
  description:
    fr: >-
      La phase 2 : les écritures courantes, hors marqueurs. Le legacy n'a aucune clé naturelle, 54 doublons du quintuple
      compte, date, libellé, montant : l'identité de l'écriture est donc le fichier et la ligne, que le connecteur
      donne. La règle empile les virements référencés au cache — la première phase du rapprochement.
    en: >-
      Phase 2: the ordinary entries, markers excluded. The legacy has no natural key, 54 duplicates of the quintuple
      account, date, description, amount: the identity of an entry is therefore the file and the line, which the
      connector gives. The rule pushes the referenced transfers onto the cache — the first phase of the matching.
    es: >-
      La fase 2: los apuntes corrientes, sin los marcadores. El legacy no tiene ninguna clave natural, 54 duplicados
      del quíntuple cuenta, fecha, concepto, importe: la identidad del apunte es por tanto el fichero y la línea, que
      da el conector. La regla apila las transferencias referenciadas en la caché — la primera fase de la conciliación.
  to: banque.ecriture
  filter: Budget != "OUVERTURE" and Budget != "FERMETURE"
  parent: { compte: Numero_Compte }
  fields:
    fichier:  connector.filename
    numero:   connector.line
    date_operation: Date_Operation
    date_comptable: Date_Comptable
    libelle:  Designation
    budget:   Budget
    lieu:     Lieu
    montant:  amount(montant_signe, devise_iso)
    mode:     mode_norme
    cheque:   cheque_norme
    imprimee: Date_Impression
  operations:
    cache.push("virement", reference_virement, me) if reference_virement is not null
