# Les réglages de la version : le type de composant, puis le composant, puis la propriété. Sous field, les types
# du catalogue avec leurs défauts et les types dérivés de l'entrepôt ; à la racine, les profils de confidentialité,
# des déclarations nommées.

# Les champs
field:

  # Le type text
  # Les défauts de tout champ texte ; un champ peut surcharger avec sa propre expression.
  text:

    # La normalisation
    # La valeur lue est rognée de ses blancs, à la frontière ; me désigne la valeur.
    normalize: trim(me)

  # Le type date_pmi
  # Les dates de PMI, écrites AAAAMMJJ : une date lue au masque yyyymmdd ; les colonnes de dates des sources
  # l'emploient.
  date_pmi:
    type: date
    mask: yyyymmdd

  # Le type time_pmi
  # Les heures de PMI : une heure lue au masque hhmmss ; une colonne en hhmm surcharge le masque au champ.
  time_pmi:
    type: time
    mask: hhmmss

  # Le type amount
  # Les défauts de tout montant.
  amount:

    # La devise
    # La monnaie de l'entreprise, pour les prix que PMI écrit sans colonne de devise ; les tiers, les tarifs et les
    # commandes portent la leur.
    currency: "EUR"

# Le réglementaire
# Le bloc rgpd: du projet, hérité par les modules, les entités et les traitements : qui répond des traitements, sur
# quelle base, pour quelle finalité ; le contact et le délégué.
rgpd:

  # Le responsable des traitements
  # Un groupe d'utilisateurs : la direction répond de l'entrepôt.
  controller: direction

  # La base légale
  # L'intérêt légitime de l'entreprise : tenir le miroir de son ERP.
  legal: legitimate_interest

  # La finalité
  purpose: Tenir l'entrepôt de données de l'entreprise, miroir de l'ERP, pour le pilotage et la préparation

  # Le contact
  contact: direction@entreprise.example

  # Le délégué à la protection des données
  dpo:
    name: Le délégué de l'entreprise
    email: dpo@entreprise.example

# Le support
# Les groupes qui reçoivent les tickets ouverts depuis les écrans ; hérité par toutes les surfaces de la version.
assistance:

  # Les anomalies
  # L'administration de l'entrepôt : la reprise, la configuration.
  anomaly: administration

  # Les questions
  # La logistique, qui connaît les stocks et fait suivre aux autres services.
  question: logistique

  # Les évolutions
  # La direction, qui arbitre et planifie.
  evolution: direction
