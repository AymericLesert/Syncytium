# La journalisation — le contrat consigné (D737/D743/D750/D800, le nom D830)
# Le fichier texte, la maîtrise du niveau et de la rétention ;
# les dimensions (taille/rotation) : la syntaxe à écrire quand le domaine s'ouvrira.

log:
  # verbose | debug | info | warning | error | exception
  level: info
  output: file:${SYNCYTIUM_LOG_DIRECTORY}
  retention: 90d
