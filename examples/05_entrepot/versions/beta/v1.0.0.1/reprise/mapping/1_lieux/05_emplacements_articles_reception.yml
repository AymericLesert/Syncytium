# Les emplacements de la réception, trouvés dans les fiches articles
ARTICLE:
  description: >-
    La deuxième origine des emplacements : le couple dépôt + emplacement de la réception de chaque fiche article, un
    couple distinct par emplacement ; le dépôt se retrouve par son code. Un emplacement né ici est inactif et sans
    libellé ; déjà connu, il n'est pas touché.
  to: stock.emplacement
  distinct: [ARCTCODEPR, ARCTCOEMPR]
  filter: ARCTCODEPR != null and ARCTCOEMPR != null
  fields:
    depot: ARCTCODEPR
    code:  ARCTCOEMPR
  report:
    when: [migration]
    to: [logistique]
    by: [notification, mail]
