# Le dépôt — le référentiel des dépôts de PMI, construit à quatre origines
# (D962, D1008) : les paramètres de Cegid (PARAM — les dépôts actifs, avec
# leur libellé), les fiches articles (ARCTCODEP), les mouvements (MVCTDEPOT
# — « le distinct permet de référencer toutes les valeurs y compris
# dépassées ») et les niveaux de stock non nuls (DPKTDEPOT — « uniquement
# si la quantité != 0 ») ; les valeurs distinctes de chaque source (D658). Une
# liste courte, mais une entité : le dépôt se référence (D396) et porte
# ses niveaux et ses emplacements.
name: depot
description: Un dépôt de stockage
label: "{code} — {libelle}"
identity: [code]
history: true

fields:
  code:
    type: text[..6]
    required: true
    label:
      fr: Code

  libelle:
    # « le libellé des emplacements est dans les paramètres. Dans les
    # autres cas, il n'est pas connu » (D962) — alimenté par la règle des
    # paramètres, vide pour un dépôt né des mouvements ou des fiches
    type: text[..40]
    label:
      fr: Libellé

  actif:
    # « les paramètres sont les emplacements actifs… tout nouvel
    # emplacement est ajouté et inactif » (D962) — la règle des paramètres
    # le vaut vrai ; né d'une autre origine, le dépôt naît au défaut (D941)
    type: boolean
    required: true
    default: false
    label:
      fr: Actif

  niveaux:
    # l'accès retour aux niveaux du dépôt (D394), nommé en vue dérivée
    # (D405)
    type: association with stock.niveau if depot = me
    label:
      fr: Niveaux

  mouvements:
    # l'accès retour aux mouvements du dépôt (D394/D405) — la source de la
    # matrice de contrôle
    type: association with stock.mouvement if depot = me
    label:
      fr: Mouvements

  # ------ La règle de contrôle (D1013/D1014) ------

  controle_stock:
    # « la règle de contrôle s'effectue par un champ calculé d'une matrice
    # à 2 dimensions : emplacement × article = somme des quantités en
    # entrée du mouvement − somme des quantités en sortie du mouvement »
    # (D1014) — l'hypercube (D897) en calculé : les dimensions sont
    # celles des mouvements agrégés, une cellule par couple présent, et
    # la formule s'évalue par cellule sur les mouvements de ce couple
    # (forme mienne : les dimensions portent les noms des champs des
    # enregistrements agrégés, qui restreignent l'agrégat) ; la mesure
    # dans l'unité de stock de l'article (D1009). Le tableau de bord du
    # morceau 5 la compare aux niveaux (D859).
    type: 'list of [emplacement: stock.emplacement, article: technique.article]'
    formula: mouvements.sum(quantite if sens = "entree") - mouvements.sum(quantite if sens = "sortie")
    label:
      fr: Contrôle du stock par les mouvements

  # ------ Champs calculés ------

  valeur:
    # la valeur du stock du dépôt — le tableau de bord (D859) ;
    # restreinte (D859)
    type: amount
    formula: niveaux.sum(valeur)
    confidentiality: ${settings.confidentiality.financier}
    label:
      fr: Valeur du stock
