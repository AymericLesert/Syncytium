# L'article
# La table des articles de l'ERP, standardisée : les champs que l'analyse retient, cohérents sans être exhaustifs.
# L'article est le parent d'une hiérarchie, instanciable lui-même : le code de gestion fait l'héritage — le produit
# fabriqué, le semi-fini et le fantôme, ses trois dérivés, portent la nomenclature ; la grille tarifaire reste ici. La
# suppression emporte ses compositions et ne touche pas les commandes qui le référencent. Une évolution possible, hors
# du cas : séparer la définition de l'article de l'article physique — le lot, la péremption, le packaging —, qui se
# lisent aujourd'hui sur chaque mouvement.
name: article

# La description de l'entité
description: >-
  Un article de l'entreprise — son identité, sa famille, ses unités, ses prix de revient et ses tarifs ; le parent des
  produits fabriqués, semi-finis et fantômes

# Le visage texte
# Le code et le libellé.
label: "{code}[{complement}] — {libelle}"

# L'identité
# Le code et son complément, souvent vide.
identity: [code, complement]

# L'historique
# Les prix, le statut, la famille bougent au fil des ans.
history: true

# Les champs
# Rangés par groupe ; la nomenclature et ses calculés vivent chez les trois dérivés qui la portent.
fields: ~{fields.yml}

# Les groupes de champs
# Une vue sur les champs : un compartiment du diagramme, une section du dictionnaire, un onglet du formulaire ; le
# code, son complément et les libellés restent hors groupe, en en-tête de l'écran.
groups:

  # La classification
  classification:
    title: La classification
    fields: [type, famille, sous_famille, perissable, gestion, matieres]

  # Les unités et les dimensions
  unites:
    title: Les unités et les dimensions
    fields: [unite_stock, unite_commande, unite, poids, longueur, largeur, epaisseur, volume]

  # Les codes-barres
  codes_barres:
    title: Les codes-barres
    fields: [ean13]

  # Le stock de référence
  stock_reference:
    title: Le stock de référence
    fields: [stock_minimum, stock_maximum, quantite_economique]

  # Les prix
  prix:
    title: Les prix
    fields: [prix_revient, prix_moyen_pondere, prix_achat]

  # La vie de l'article
  vie:
    title: La vie de l'article
    fields: [actif, date_creation, date_modification, plans]

  # Le stockage et les quatre lieux
  stockage:
    title: Le stockage et les quatre lieux
    fields:
      - gere_en_stock
      - depot_expedition
      - emplacement_expedition
      - depot_reception
      - emplacement_reception
      - depot_fabrication
      - emplacement_fabrication
      - depot_consommation
      - emplacement_consommation

  # Les liens
  liens:
    title: Les liens
    fields:
      - fournisseur_defaut
      - tarifs
      - commandes_vente
      - commandes_achat
      - dernier_fournisseur
      - mouvements
      - mouvements_par_emplacement
      - stock_par_emplacement

  # Les champs calculés
  calcules:
    title: Les champs calculés
    fields: [dormant, derniere_sortie]

# La cohérence des données converties
validation:
  - rule: stock_maximum >= stock_minimum if stock_maximum != null and stock_minimum != null
    message: Le stock maximum {stock_maximum} est sous le stock minimum {stock_minimum}.
  - rule: date_modification >= date_creation if date_modification != null
    message: L'article est modifié le {date_modification}, avant sa création le {date_creation}.
