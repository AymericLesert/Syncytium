# Le tarif — la table TARIF de PMI (TAKTGENRE, TAKTCODE, TAKTCODART,
# TAKTCOMART, TAKTTARIF, TAKJAPLI) : le prix unitaire d'un article pour
# un tiers et une tranche de quantité, à une date d'application. La
# composition de l'article (D399) ; l'identité au sein de l'article :
# le tiers, la tranche et la date — toutes les dates vivent à plat,
# le tarif planifié compris (D894 : « une grille tarifaire se définit
# à l'avance et donne de la visibilité aux commandes futures »). Le
# tarif en vigueur est un calculé, pas une valeur.
name: tarif
description: Un tarif — le prix unitaire d'un article pour un tiers et une tranche, à partir d'une date
label: "{tiers} — tranche {tranche} — du {date_application}"
identity: [tiers, tranche, date_application]
history: true

fields:
  tiers:
    # TAKTGENRE + TAKTCODE — le client ou le fournisseur : le parent
    # des deux (l'héritage D353), la référence (D396)
    type: tiers.tiers
    required: true
    label:
      fr: Tiers

  tranche:
    # TACNTRANCH — la référence à la grille de tranches
    type: technique.tranche
    required: true
    label:
      fr: Tranche

  date_application:
    # TAKJAPLI — AAAAMMJJ au masque (D820)
    type: date
    required: true
    label:
      fr: Date d'application
    hint:
      fr: Le tarif vaut à partir de cette date, jusqu'au suivant.

  numero:
    # TAKTTARIF nchar(1) — le numéro de tarif de PMI
    type: text[1]
    label:
      fr: Numéro de tarif

  prix:
    # TACNPU + TACTDEVISE — le prix unitaire à devise dans la valeur
    # (D771/D882)
    type: amount
    required: true
    label:
      fr: Prix unitaire

  forfait:
    # TACNFORFAI
    type: amount
    label:
      fr: Forfait

  valide:
    # TACTVALID
    type: boolean
    required: true
    default: true
    label:
      fr: Valide

  commentaire:
    # TACTCOMMEN
    type: text[..20]
    label:
      fr: Commentaire

  date_modification:
    # TACJMAJ
    type: date
    label:
      fr: Modifié le

  # ------ Champs calculés ------

  planifie:
    # le tarif à venir — visible avant sa date (D894)
    type: boolean
    formula: date_application > context.now
    label:
      fr: Planifié

  en_vigueur:
    # le tarif applicable aujourd'hui : sa date est passée et aucun
    # tarif plus récent du même tiers et de la même tranche ne l'est —
    # la condition seule dans any (D887), les tarifs frères par owner
    # (D760)
    type: boolean
    formula: >-
      valide and date_application <= context.now
      and not owner.tarifs.any(tiers = me.tiers and tranche = me.tranche
      and date_application > me.date_application and date_application <= context.now)
    label:
      fr: En vigueur
