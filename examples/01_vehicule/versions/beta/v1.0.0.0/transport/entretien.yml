# L'entretien — le journal de vie (D826) : des frais, des événements
# sans montant (« Choc avec une biche », « Fuite de gasoil »), l'achat
# en première ligne et la vente en recette négative (−2 477).
name: entretien
label: "${name}"
fields:
  numero: counter
  date:        { type: date, required: true, searchable: range }
  designation: { type: text[..200], required: true, searchable: mutualizable[recherche] }   # multi-ligne déduit de la taille (D366)
  montant:     decimal                 # optionnel — l'événement sans montant est licite ; la devise est visuelle (D832)
  km:          integer[0..]
  # la ligne est une révision — sinon : une intervention hors révision
  # (l'arbitrage : la référence à la règle n'avait pas d'intérêt, le
  # booléen suffit ; les révisions faites restent des lignes du journal D831)
  revision:    boolean
validation:
  - date >= owner.date_achat

# La présentation graphique — inline (l'éclatement libre D767)
gui:
  forms:
    record:
      title:
        create: { fr: "Nouvelle ligne d'entretien" }
        read:   { fr: "{designation}" }
        update: { fr: "Modification de la ligne du {date}" }
        delete: { fr: "Suppression de la ligne du {date}" }
      items:
        - field[date]
        - field[designation]         # le multi-ligne déduit (D366)
        - field[montant]             # optionnel — l'événement sans montant
        - field[km]
        - field[revision]            # la coche : une révision, ou non
  lists:
    journal:                         # la feuille ENTRETIEN — le journal de vie
      title: { fr: "Le journal de vie" }
      searchable:
        - vehicule: { select: mono, required: true }
        - date                       # la plage (D784)
        - recherche                  # le champ mutualisé (D780) — la désignation
      columns: [date, designation, montant, km, revision]
      sort: [date, numero]
      selection: multiple
