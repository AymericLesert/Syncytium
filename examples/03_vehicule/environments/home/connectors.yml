# Les connecteurs de l'environnement : la base, l'authentification, le mail et le dossier des classeurs. Chaque
# connecteur porte sa famille (type), son implémentation (class) et, au besoin, les paramètres de l'implémentation ;
# quand le nom du connecteur est sa famille, le type ne s'écrit pas. Les chemins viennent des variables du .env de
# l'environnement.

# La base du foyer
# Le natif du domestique : un fichier SQLite, sans paramètre.
database:
  type: storage
  class: sqlite

# L'authentification
# Pas de secrets dans la famille : aucune.
authentication:
  class: none

# Le mail sortant
# Muet, assumé : les notifications de l'échéancier restent dans l'application ; à revoir si le mail devient utile.
smtp:
  class: none

# Le legacy
# La base d'origine de la reprise : les classeurs Excel d'un dossier hors du dépôt — un classeur par véhicule, les
# feuilles pour entités sources.
legacy:
  type: storage
  class: xlsx

  # Les paramètres du dossier
  parameters:
    directory: ${SYNCYTIUM_LEGACY_DIRECTORY}

  # La carte des entités vers les classeurs
  # Chaque entité nomme ses fichiers (files, un motif) et sa lecture : single, un seul enregistrement par classeur — la
  # feuille-formulaire aux cellules adressées — ; range, la plage FEUILLE!cellules dont la première ligne porte les
  # entêtes. La borne de la plage a trois formes : explicite (A3:H100) ; « ... », l'arrêt à la première ligne vide sur
  # toutes les colonnes ; ouverte (A3:H), la fin de la feuille, les lignes vides sautées. Une liste de plages se replie
  # sur la première qui existe. Une plage peut mêler des cellules d'autres onglets, répétées par ligne. Chaque entité
  # expose ses colonnes (fields) : le type, et la cellule adressée (reference) ou l'entête de la colonne dans la plage
  # (label) ; la migration exploite cette exposition.
  entities:

    # Les feuilles-formulaires, un enregistrement par classeur
    identification:
      files: [ '.*\.xlsx?' ]
      single: true

      # Les colonnes
      # Sept cellules de la feuille IDENTIFICATION ; l'image s'adresse à la feuille, son ancre varie d'un classeur à
      # l'autre.
      fields:

        nom:
          type: text[..40]
          reference: IDENTIFICATION!B1

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        mode_achat:
          type: text[..40]
          reference: IDENTIFICATION!H1

        lieu_achat:
          type: text[..60]
          reference: IDENTIFICATION!H2

        date_debut:
          type: date
          reference: IDENTIFICATION!K1

        date_fin:
          type: date
          reference: IDENTIFICATION!K2

        photo:
          type: image
          reference: IDENTIFICATION

    titre_consommation:
      files: [ '.*\.xlsx?' ]
      single: true

      # Les colonnes
      # La plaque, lue sur la feuille IDENTIFICATION, et le titre de la feuille CONSOMMATION.
      fields:

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        titre:
          type: text[..60]
          reference: CONSOMMATION!A1

    regle_revision:
      files: [ '.*\.xlsx?' ]
      single: true

      # Les colonnes
      # La plaque, lue sur la feuille IDENTIFICATION, et le titre du bloc droit de la feuille ENTRETIEN.
      fields:

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        titre:
          type: text[..60]
          reference: ENTRETIEN!I1

    credit_parametres:
      files: [ '.*\.xlsx?' ]
      single: true

      # Les colonnes
      # La plaque, lue sur la feuille IDENTIFICATION, et les trois cellules du paramétrage du crédit.
      fields:

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        capital:
          type: decimal
          reference: CREDIT!C3

        taux_annuel:
          type: decimal
          reference: CREDIT!C4

        assurance:
          type: decimal
          reference: CREDIT!C5

    # Les tableaux en plage ouverte
    # La ligne vide qui suit l'entête interdit « ... » ; la plage de l'entretien borne d'elle-même le bloc droit aux
    # entêtes homonymes.
    consommation:
      files: [ '.*\.xlsx?' ]
      range: CONSOMMATION!A3:H

      # Les colonnes
      # La plaque, une cellule d'un autre onglet répétée sur chaque ligne, puis les colonnes de la plage, chacune par
      # son entête ; les entêtes diffèrent entre le thermique et l'électrique.
      fields:

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        date:
          type: date
          label: Date

        total_km:
          type: integer
          label: Total Km

        nb_litres:
          type: decimal
          label: Nb Litres

        charge:
          type: decimal
          label: Charge électrique

        prix_litre:
          type: decimal
          label: Prix au Litre

        prix_kwh:
          type: decimal
          label: Prix au KwH

    entretien:
      files: [ '.*\.xlsx?' ]
      range: ENTRETIEN!A3:H

      # Les colonnes
      # La plaque, une cellule d'un autre onglet répétée sur chaque ligne, puis les colonnes de la plage.
      fields:

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        date:
          type: date
          label: Date

        designation:
          type: text[..200]
          label: Désignation

        montant:
          type: decimal
          label: Montant

        km:
          type: integer
          label: KM

    # L'échéancier, le même format sur deux feuilles
    # La première plage existante sert ; « ... » s'arrête à la première ligne vide.
    echeance:
      files: [ '.*\.xlsx?' ]
      range:
        - CREDIT!A8:G...
        - LOA!A3:G...

      # Les colonnes
      # La plaque, une cellule d'un autre onglet répétée sur chaque ligne, puis les colonnes de la plage.
      fields:

        immatriculation:
          type: text[..12]
          reference: IDENTIFICATION!E1

        date:
          type: date
          label: Date

        interet:
          type: decimal
          label: Intérêt

        amortissement:
          type: decimal
          label: Amortissement

        assurance:
          type: decimal
          label: Assurance

        mensualite:
          type: decimal
          label: Mensualité
