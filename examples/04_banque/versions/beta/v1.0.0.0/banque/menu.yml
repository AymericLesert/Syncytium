# Le menu du module : des adresses, dans l'ordre d'affichage. Sans menu déclaré, le défaut ne connaît qu'une liste par
# entité ; les trois listes de l'écriture ont ici chacune leur entrée, en sous-menu. Une liste absente du menu et
# d'un écran n'est documentée nulle part. Le nom d'un sous-menu est une clé du dictionnaire de libellés du module.

# L'accueil du module
- banque[accueil]

# Les comptes
- banque.compte

# Les écritures, en sous-menu — une entrée par liste
- ecritures:
    - banque.ecriture[par_operation]
    - banque.ecriture[par_comptable]
    - banque.ecriture[pointage]

# Les référentiels
- banque.budget
- banque.lieu
