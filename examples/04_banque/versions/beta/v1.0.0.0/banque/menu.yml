# Le menu du module : des adresses, dans l'ordre d'affichage. Sans menu déclaré, le défaut ne connaît qu'une liste par
# entité ; les trois listes de l'écriture ont ici chacune leur entrée, en sous-menu. Une liste absente du menu et
# d'un écran n'est documentée nulle part. Le nom d'un sous-menu est une clé du dictionnaire de libellés du module.

# L'accueil du module
accueil:
  label:
    fr: Tableau de bord
    en: Dashboard
    es: 
  link: banque[accueil]

# Les comptes
comptes:
  label:
    fr: Comptes bancaires
    en: Accounts
    es: Apuntas
  link: banque.compte

# Les écritures, en sous-menu — une entrée par liste
ecritures:
  label:
    fr: Comptes bancaires
    en: Accounts
    es: Apuntas
  items:
    operations:
      link: banque.ecriture[par_operation]
    comptable:
      link: banque.ecriture[par_comptable]
    rapprochement:
      link: banque.ecriture[pointage]

# Les référentiels
referential:
  items:
    bugdets:
      link: banque.budget
    lieux:
      link: banque.lieu
