# Les connecteurs de l'environnement de staging (D617/D945 — chaque
# environnement les siens ; les secrets = les paramètres marqués *
# (D944), par variable d'environnement chiffrée, jamais dans le dépôt
# — D321/D902).

# L'entrepôt d'essai — le storage cible : un schéma PostgreSQL (D860)
# distinct de la production ; le .env du staging nomme son serveur et sa
# base (les mêmes noms de variables, un .env par environnement — D902).
entrepot:
  type: storage
  class: postgresql
  parameters:
    host: ${ENTREPOT_HOST}
    database: ${ENTREPOT_DATABASE}
    schema: entrepot
    user: ${ENTREPOT_USER}
    password*: ${ENTREPOT_PASSWORD}   # la marque * : confidentiel, la variable chiffrée

# Cegid PMI — le storage source : LA COPIE de la base PMI (D945 — jamais
# la production depuis le staging), le schéma d'une instance SQL Server
# (D860), en lecture seule (D175). Pas de carte
# entities: (D829 — optionnelle, la base se décrit elle-même) : la
# comparaison du schéma réel à la description (D861/D868) doit voir
# toutes les tables, les non définies comprises.
cegid:
  type: storage
  class: sqlserver
  parameters:
    server: ${CEGID_SERVER}
    database: ${CEGID_DATABASE}
    schema: dbo
    user: ${CEGID_USER}
    password*: ${CEGID_PASSWORD}
  # La facette des types portée par le connecteur (D876) — la convention
  # de nommage de PMI, <XX><K|C|I><T|N|J|S><nom> (D865), surchargeable à
  # l'entité ou au champ (D877). LA FORME EST EN PROPOSITION (D876 la
  # renvoyait à l'assise) : le motif à groupes nommés (D817) découpe la
  # colonne ; identity: dit les lettres de la clé ; types: la lettre du
  # type — le type SQL tranche entre entier et décimal pour N.
  convention:
    columns: '^(?<prefix>[A-Z]{2})(?<kind>[KCI])(?<type>[TNJS])(?<name>[A-Z0-9]+)$'
    identity: [K, I]
    types:
      T: text
      N: decimal
      J: date[yyyymmdd]
      S: time[hhmm]                 # « hhmm seulement » (D992)

# Les plans des articles — le connecteur file en complément du storage
# source (D883), le répertoire d'essai du staging : le nom du fichier vient d'ARTICLE (ARCTFICPLA), le
# contenu du répertoire des plans (D634 — get_file).
plans:
  type: file
  class: file_std
  parameters:
    directory: ${PLANS_DIRECTORY}

# L'authentification — le même locataire Microsoft 365 (D692/D945), une
# inscription d'application propre au staging par son .env ; le secret
# est un paramètre marqué * (D944).
authentication:
  class: azure_ad
  parameters:
    tenant: ${AZURE_TENANT}
    client_id: ${AZURE_CLIENT_ID}
    client_secret*: ${AZURE_CLIENT_SECRET}

# Le mail sortant — le relais de l'entreprise (D628/D626/D945), l'expéditeur
# et la boîte du staging par son .env : les rapports d'essai n'atteignent
# pas les utilisateurs de la production.
smtp:
  class: smtp_std
  parameters:
    host: ${SMTP_HOST}
    port: 587
    from: ${SMTP_FROM}
    password*: ${SMTP_PASSWORD}
