# Les surfaces de la commande d'achat — la même structure que la vente
# (D882) ; les montants restreints (D859) se masquent avec la
# confidentialité (D247). Lecture seule.

lists:
  commandes:                         # le menu : commande.commande_achat
    title: { fr: "Les commandes d'achat" }
    searchable:
      - fournisseur: { select: mono }
      - date
      - statut
    columns: [ numero, indice, fournisseur, date, date_echeance, statut, nombre_lignes, reste_a_recevoir, total ]
    sort: { date: "-", numero: "-" }
    selection: 1..
    exports: [ csv, 'excel[commandes_achat.xlsx]' ]

  en_cours:
    title: { fr: "Les commandes en cours" }
    filter: statut = "en_cours"
    searchable: [ fournisseur, date ]
    columns: [ numero, indice, fournisseur, date, date_echeance, reste_a_recevoir, total ]
    sort: { date_echeance: "+" }

forms:
  fiche:
    title: "{numero}-{indice} — {fournisseur}"
    mode: read-only
    header:
      items: [ 'field[numero]', 'field[indice]', 'field[statut]' ]
    page:
      - sections:
          layout: row
          items:
            - section:
                title: { fr: Fournisseur }
                items: [ 'field[fournisseur]', 'field[reference_fournisseur]', 'field[devise]', 'field[taux_change]' ]
            - section:
                title: { fr: Dates }
                items: [ 'field[date]', 'field[date_echeance]', 'field[derniere_reception]', 'field[derniere_facture]' ]
      - field[lignes]
    footer:
      items: [ 'field[nombre_lignes]', 'field[reste_a_recevoir]', 'field[total]' ]
