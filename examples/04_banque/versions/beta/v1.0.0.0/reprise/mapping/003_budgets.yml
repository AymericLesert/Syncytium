# La phase 2, le préalable (D814/D824) — le référentiel des budgets (D658)
# Les marqueurs OUVERTURE/FERMETURE entrent au référentiel (D824) — leur usage
# est gardé par la validation de l'entité ecriture (la date = l'ouverture ou
# la clôture du compte).

budget:
  to: banque.budget
  distinct: [Budget]
  fields:
    libelle: Budget                # la valeur devient l'identité (D658/D930)
