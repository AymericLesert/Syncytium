# Le module déclare ses entités (D765) — les chemins relatifs au
# fichier courant (D768) : depuis technique/
# « technique » : les données techniques de PMI (D859 — les articles,
# les gammes et nomenclatures, les tarifs), le premier des quatre
# modules de l'entrepôt (D882). L'historisation se déclare entité par
# entité (D411) — toutes les entités du cas sauf les mouvements (D882).
name: technique
description: Les données techniques — les articles, leurs nomenclatures et gammes, leurs tarifs

# L'entrepôt est en lecture seule pour ses usagers (D882) — l'allow à
# l'étage du module (D886 : l'application, le module, l'entité ou le
# champ, le plus proche l'emporte) ; migrate écrit par le privilège de
# la reprise (D175).
allow:
  create: false
  update: false
  delete: false

entities:
  - article/article.yml
  - ligne_nomenclature/ligne_nomenclature.yml
  - tarif/tarif.yml
  - tranche/tranche.yml
