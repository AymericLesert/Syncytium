# La table ECOMCLI de PMI — 91 colonnes, les mêmes que ECOMFOU : l'entête
# de commande, la source de commande.commande_vente (D882 — sans héritage entre
# les ventes et les achats). L'identité : le numéro et l'indice de révision
# (D865/D951) — une ligne d'entête par révision, ses lignes avec elle. La
# lecture par plage de numéros (D880). Les colonnes lues typées et
# renvoyées, les autres non lues (D947).
name: ECOMCLI
description: Les entêtes de commandes de vente de PMI — la source de commande.commande_vente

filter: ECKTSOC = "100"
identity: [ECKTNUMERO, ECKTINDICE]
coverage: ECKTNUMERO[10000]
# la couverture : la partition par plage de dix mille numéros, la reprise
# depuis la dernière valeur parcourue (D878–D880)

fields:
  ECKTSOC:     text[3]                                        # la société — le filtre (D663)
  ECKTNUMERO:  text[6]                                        # → commande_vente.numero — l'identité (D871)
  ECKTINDICE:  text[3]                                        # → commande_vente.indice — l'identité (D871)
  ECCJCRE:     { type: date, mask: "yyyymmdd" }               # → commande_vente.date
  ECCTCODE:    CLIENT.CLKTCODE                                # → commande_vente.client — la référence (D648)
  ECCTREFCDE:  text[20]                                       # → commande_vente.reference_client
  ECCJECHFOR:  { type: date, mask: "yyyymmdd" }               # → commande_vente.date_echeance
  ECCJDERBL:   { type: date, mask: "yyyymmdd" }               # → commande_vente.derniere_livraison
  ECCJDERFA:   { type: date, mask: "yyyymmdd" }               # → commande_vente.derniere_facture
  ECCTDEVISE:  text[3]                                        # → commande_vente.devise — la devise des montants (D771)
  ECCNTXDEVI:  decimal                                        # → commande_vente.taux_change
  ECCTSTATUT:  text[2]                                        # → commande_vente.statut — les valeurs de l'exemple au mapping (D946)
