# Les surfaces du mouvement — le journal des stocks, des millions de
# lignes (D863) : la recherche par plage de dates d'abord (D784), le
# tri par l'horodatage (D1001). Lecture seule (D882).

lists:
  journal:                           # le menu : stock.mouvement
    title: { fr: "Le journal des mouvements" }
    searchable:
      - date: { required: true }     # la plage, obligatoire : jamais la totalité (D863)
      - article
      - depot
      - emplacement
      - type
      - sens
    columns: [ date, horodatage, article, depot, emplacement, type, sens, quantite, masse, prix_unitaire, valeur, utilisateur ]
    sort: { horodatage: "-" }
    selection: 1..
    exports: [ csv, 'excel[mouvements.xlsx]' ]

  par_article:
    title: { fr: "Les mouvements d'un article" }
    searchable:
      - article: { select: mono, required: true }
      - date
    columns: [ date, horodatage, depot, emplacement, type, sens, quantite, stock_avant, stock_apres, document ]
    sort: { horodatage: "-" }

  invalides:                         # le calculé valide (D1009) — les mouvements à zéro
    title: { fr: "Les mouvements à quantité nulle" }
    filter: valide = false
    searchable: [ date, article ]
    columns: [ date, horodatage, article, depot, type, sens, document, utilisateur ]
    sort: { horodatage: "-" }

forms:
  fiche:
    title: "{horodatage} — {article}"
    mode: read-only
    page:
      - sections:
          layout: row
          items:
            - section:
                title: { fr: Origine }
                items: [ 'field[document]', 'field[ligne]', 'field[indice]', 'field[composant]', 'field[utilisateur]' ]
            - section:
                title: { fr: Mouvement }
                items: [ 'field[article]', 'field[depot]', 'field[emplacement]', 'field[lot]', 'field[date]', 'field[horodatage]', 'field[type]', 'field[sens]' ]
            - section:
                title: { fr: Quantités }
                items: [ 'field[quantite]', 'field[masse]', 'field[stock_avant]', 'field[stock_apres]', 'field[prix_unitaire]', 'field[valeur]' ]
