# Le nom de l'entité source
# Les écritures du legacy : deux fichiers du même format, une seule entité — l'union des lignes. Le marqueur fait foi,
# pas le fichier : le fichier actif porte aussi des comptes clos. Le CSV : point-virgule, Windows-1252, les dates
# jj/mm/aaaa, le point décimal.
name: budget

# La description de l'entité source
description: Les écritures des comptes du legacy — les fichiers actifs et archivés

# Les colonnes
# Toute colonne du fichier est décrite, et toutes servent ; les calculés de normalisation, en fin de liste, se
# consomment comme des colonnes par les règles.
fields:

  Numero_Compte:
    type: text[..23]
    description: Le numéro du compte, l'identité du compte dans l'entrepôt.

  Date_Operation:
    type: date
    mask: "dd/mm/yyyy"
    description: La date de l'opération ; le masque lit le jj/mm/aaaa du legacy.

  Date_Comptable:
    type: date
    mask: "dd/mm/yyyy"
    description: La date comptable, vide tant que l'écriture n'est pas pointée.

  Designation:
    type: text[..100]
    description: Le libellé ; le réel monte à 93 caractères.

  Budget:
    type: text[..30]
    description: Le budget de l'écriture, dont les marqueurs OUVERTURE et FERMETURE des comptes.

  Debit:
    type: decimal
    description: Le débit ; la notation scientifique du legacy se lit (7.629395E-5).

  Credit:
    type: decimal
    description: Le crédit.

  Nature:
    type: text[..40]
    description: >-
      Un texte mixte : CB, PRELEVEMENT, VIREMENT ou VIREMENT-<référence>, un numéro de chèque, des espèces… ; les
      calculés en tirent le mode, le numéro de chèque et la référence du virement.

  Devise:
    type: enum { E, F }
    description: E l'euro, F le franc ; toute autre valeur est une anomalie — le typage en garde.

  Lieu:
    type: text[..30]
    description: La ville, vide sur 3 634 lignes.

  Date_Impression:
    type: date
    mask: "dd/mm/yyyy"
    description: La date d'impression du relevé.

  # Les calculés de normalisation

  montant_signe:
    formula: round(iif(Credit != null, Credit, 0) - iif(Debit != null, Debit, 0), 2)
    description: Le montant signé, arrondi au centime — les poussières flottantes du legacy s'éteignent.

  devise_iso:
    formula: iif(Devise = "E", "EUR", "FRF")
    description: La devise au code ISO du type amount.

  mode_norme:
    formula: >-
      iif(Nature = "CB", "cb",
      iif(Nature = "PRELEVEMENT", "prelevement",
      iif(Nature = "VIREMENT" or Nature like "^VIREMENT-.*" or Nature = "Guichet", "virement",
      "autre")))
    description: >-
      La nature mixte ramenée au mode de l'écriture ; les chèques, les espèces, le liquide et le vide vont à autre. like
      est la comparaison régulière.

  cheque_norme:
    formula: iif(Nature like "^[0-9]+$", Nature, null)
    description: Le numéro de chèque, quand la nature n'est qu'un nombre.

  reference_virement:
    formula: extract(Nature, "^VIREMENT-(.*)$")
    description: >-
      L'identifiant du miroir d'un virement, nul hors des virements référencés ; extract rend la capture unique, et des
      groupes nommés décomposeraient plusieurs noms au point.
