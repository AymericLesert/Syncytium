# Les soldes de clôture
budget:
  description: >-
    La phase 3 : le montant du marqueur de fermeture est la dernière écriture du compte, posée avant la clôture — le
    solde s'enregistre sur le compte encore ouvert. Le libellé est conventionnel, le mode autre.
  to: banque.ecriture
  filter: Budget = "FERMETURE" and montant_signe != 0
  parent: { compte: Numero_Compte }
  fields:
    date_operation: Date_Operation
    date_comptable: Date_Comptable
    libelle:  "Solde de clôture"
    budget:   Budget
    montant:  amount(montant_signe, devise_iso)
    mode:     "autre"
