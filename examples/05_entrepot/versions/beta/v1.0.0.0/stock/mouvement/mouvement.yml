# Le mouvement de stock — la table MVTSTO de PMI (34 colonnes, des
# millions de lignes — D863). Sans colonne K : sa clé est portée par ses
# colonnes I (D869 — l'origine du mouvement : le document, la ligne,
# l'indice, le composant), complétée de l'article et de l'horodatage de
# saisie — « la date et l'heure du mouvement avec les secondes » :
# MVCJSAI + MVCTSAI (D1001) — le contrôle de l'identité avant la
# migration tranchera sur le réel (D871 ; l'échantillon : 70 valeurs
# distinctes sur 100 pour les cinq I seules, 100 avec le complément).
# La seule entité du cas sans historique (D882) : les retouches des
# outils maison (D864) remplacent (D878) ; la lecture par partition
# (D878–D880) s'écrit à la source : coverage: MVCJMVT[month - 3].
name: mouvement
description: Un mouvement de stock — l'entrée ou la sortie d'un article, à une date, sur un dépôt
label: "{horodatage} — {article} {quantite}"
identity: [document, ligne, indice, composant, article, horodatage]
# l'opt-out (D168/D411) — le mouvement ne s'historise pas (D882)
history: false

fields: ~{fields.yml}

# aucune validation sur la quantité (D1009) ; « la ligne est valide si la
# quantité est non nulle » : le calculé valide, pas un rejet

# Les graphiques du mouvement — le tableau de bord du module (D1019) :
# les entrées et les sorties par mois, la matrice de contrôle en croisé
# (D1014 en présentation : le pivot, D246).
gui:
  charts:
    par_mois:
      component: chart.bars
      x: date[month]                   # la temporalité (D240)
      y: [ sum(quantite if sens = "entree"), sum(quantite if sens = "sortie") ]   # deux séries (D887)
      filter: date >= context.today - 12m   # les douze derniers mois (D838)
      title: { fr: "Entrées et sorties par mois" }
    controle:
      component: pivot
      rows: [depot, emplacement]       # la hiérarchie pliable (D246)
      columns: [article]
      value: 'sum(sens.select(entree: quantite, sortie: -quantite))'   # la règle de contrôle (D1014), à la cellule
      filter: date >= context.today - 1m
      title: { fr: "Contrôle des stocks par les mouvements (le mois)" }
