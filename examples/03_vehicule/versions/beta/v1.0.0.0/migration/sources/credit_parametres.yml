# Le nom de l'entité source
# L'en-tête de la feuille CREDIT, le tableau d'amortissement : les paramètres en cellules, un enregistrement par
# classeur à feuille CREDIT ; la feuille absente d'un classeur en LOA ne donne rien.
name: credit_parametres

# La description de l'entité source
description: Le paramétrage du crédit — le capital, le taux, l'assurance

# Les colonnes
# La plaque vient d'un autre onglet, la jointure au véhicule ; la durée du contrat ne se lit pas, le nombre d'échéances
# la donne pour tous les régimes.
fields:

  immatriculation:
    type: text[..12]
    reference: IDENTIFICATION!E1
    description: La plaque du classeur.

  capital:
    type: decimal
    reference: CREDIT!C3

  taux_annuel:
    type: decimal
    reference: CREDIT!C4

  assurance:
    type: decimal
    reference: CREDIT!C5
    description: L'assurance mensuelle.
