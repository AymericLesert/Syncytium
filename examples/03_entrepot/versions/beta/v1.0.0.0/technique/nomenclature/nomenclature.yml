# La nomenclature — la ligne de la vue NOMENC de PMI (décrite comme une
# table — D866 ; « à renommer ligne_nomenclature par nomenclature »,
# D946), qui réunit la nomenclature et la gamme : la
# nature de la ligne se déduit du type de l'article référencé (D937) —
# la main d'œuvre et la sous-traitance font l'opération (les temps), le
# reste le composant (une matière, un article). La composition du
# produit fabriqué, du semi-fini et du fantôme — les trois dérivés de
# l'article qui portent une nomenclature (D399/D940) ; le composant
# référence un article, de tout type — la composition auto-référencée
# (D135), l'acyclicité validée par le moteur.
# L'indice de révision des commandes ne couvre pas la nomenclature :
# l'historique la porte (D882).
name: nomenclature
description: Une ligne de la nomenclature ou de la gamme d'un article — un composant ou une opération
label: "{numero} — {designation}"
# la clé fonctionnelle au sein de l'article (NOKNLIGNOM) — l'accès par
# la clé owner.nomenclature[n] (D841)
identity: [numero]
history: true

fields: fields.yml

# Aucune règle inter-champs (D404) : le composant est obligatoire, la
# nature se déduit (D937) ; l'ordre des bornes de la période n'a pas à
# s'écrire, début ≤ fin est intégré au type (D391 ; les sous-items min,
# max, gap — D890). La quantité est NOCNQTECOM (D946).
