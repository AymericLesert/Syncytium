# le natif du domestique (D729)
database:
  type: storage
  class: sqlite

# « pas de secrets dans la famille » (D759)
authentication:
  class: none

# le mail muet, assumé (D763) — les notifications de l'échéancier (D826)
# restent dans l'application ; à revoir si le mail devient utile
smtp:
  class: none

# le legacy de la reprise (le morceau 5) — le storage xlsx sur le dossier :
# un classeur = un véhicule, les feuilles = les entités source (D826/D828)
legacy:
  type: storage
  class: xlsx
  # le paramétrage technique de la classe
  parameters:
    # le chemin hors dépôt (D321)
    directory: ${SYNCYTIUM_LEGACY_DIRECTORY}
  # la carte entités → fichiers (D828) — toutes les entités source lisent
  # les mêmes classeurs (le pattern D806) ; la feuille et la forme de
  # lecture vivent à la déclaration source (reprise/source/*.yml)
  entities:
    identification:      [ ".*\.xlsx?" ]
    titre_consommation:  [ ".*\.xlsx?" ]
    consommation:        [ ".*\.xlsx?" ]
    entretien:           [ ".*\.xlsx?" ]
    regle_revision:      [ ".*\.xlsx?" ]
    credit_parametres:   [ ".*\.xlsx?" ]
    credit_echeance:     [ ".*\.xlsx?" ]
    loa_echeance:        [ ".*\.xlsx?" ]
