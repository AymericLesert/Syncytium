# --- l'origine du mouvement — les colonnes I de PMI (D869) ---

document:
  # MVITNUMERO nchar(6) — le document d'origine (la commande, l'ordre de
  # fabrication…)
  type: text[..6]
  label:
    fr: Document

ligne:
  # MVITLIGNE
  type: text[..3]
  label:
    fr: Ligne

indice:
  # MVITINDLIG
  type: text[..3]
  label:
    fr: Indice

composant:
  # MVITCOMPOS
  type: text[..5]
  label:
    fr: Composant

# --- l'article et le lieu ---

article:
  # MVCTCODART + MVCTCOMART — la référence (D396)
  type: technique.article
  required: true
  label:
    fr: Article

depot:
  # MVCTDEPOT
  type: stock.depot
  label:
    fr: Dépôt

emplacement:
  # MVCTCODMPL
  type: stock.emplacement
  label:
    fr: Emplacement

lot:
  # MVCTNUMLOT
  type: text[..18]
  label:
    fr: Lot

# --- le moment — la date et l'heure gardées séparées : le time seul
# (D881 — la couverture des types), la partition au mois de la date
# (D880) ---

date:
  # MVCJMVT — « la date du mouvement à enregistrer dans le système »
  # (D1001), la clé de partition (D880) ; MVCSMVT, la semaine, se déduit
  # du jour (D1000)
  type: date
  required: true
  label:
    fr: Date

horodatage:
  # MVCJSAI + MVCTSAI — « la date et l'heure du mouvement avec les
  # secondes correspondent à la combinaison des champs MVCJSAI (jour) et
  # MVCTSAI (heure) » — « la date et heure de saisie du mouvement. Un
  # mouvement peut être enregistré a posteriori » (D1001) : le
  # constructeur datetime(jour, heure) (D659) ; dans l'identité
  type: datetime
  required: true
  label:
    fr: Horodatage

# --- le mouvement ---

type:
  # MVCTGENRE nchar(1) — le genre du mouvement, la liste close de PMI en
  # énuméré (D883/D952), les six genres nommés par l'auteur (D953) : C
  # consommation, D déplacement, E expédition, F fabrication, I
  # inventaire, R réception — les codes traduits au mapping (D893) ; le
  # morceau 2 les lisait en MVCTTYPE, avec des valeurs inventées
  type: enum
  required: true
  label:
    fr: Type
  values:
    consommation:
      label:
        fr: Consommation
    deplacement:
      label:
        fr: Déplacement
    expedition:
      label:
        fr: Expédition
    fabrication:
      label:
        fr: Fabrication
    inventaire:
      label:
        fr: Inventaire
    reception:
      label:
        fr: Réception

sens:
  # MVCTTYPE — E l'entrée, S la sortie (D952 : la lecture de l'échantillon,
  # 25 E et 75 S ; D953) ; le morceau 2 le lisait en MVCTGENRE
  type: enum
  required: true
  label:
    fr: Sens
  values:
    entree:
      label:
        fr: Entrée
    sortie:
      label:
        fr: Sortie

quantite:
  # MVCNQTE — signée chez PMI ; l'entrepôt garde la quantité et le sens
  type: decimal
  required: true
  label:
    fr: Quantité

prix_unitaire:
  # MVCNPUNIT — la valorisation du mouvement : restreinte (D859)
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix unitaire

utilisateur:
  # MVCTNOMUTI — l'opérateur qui a saisi ; un nom de personne (D695)
  type: text[..20]
  rgpd: personal
  label:
    fr: Saisi par

stock_avant:
  # MVCNAVQTST — la quantité en stock avant le mouvement
  type: decimal
  label:
    fr: Stock avant

# ------ Champs calculés ------

valeur:
  # MVCNVAL chez PMI ; recalculée ici — restreinte comme le prix
  type: amount
  formula: prix_unitaire * quantite if prix_unitaire != null
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Valeur

stock_apres:
  type: decimal
  # le « : » du .select (D833) oblige les guillemets YAML — le manque M9
  formula: 'stock_avant + sens.select(entree: quantite, sortie: -quantite)'
  label:
    fr: Stock après
