# Les opérations du véhicule — le cycle de vie de l'échéancier (D831).
# L'opération automatique : le when: est SON déclencheur (D428), une
# expression évaluée à chaque mise à jour de l'entité (D435 —
# every: continuous est le défaut), déclenchée à la première vraie
# (le cliquet D354). Le hook EST l'opération (D609).
creer_echeancier:                # à la validation du financement — la validation est l'opération (D775)
  when: financement = credit or financement = loa
  commit: auto
clore_echeancier:                # la clôture purge les non payées — le cliquet joue une fois
  when: statut = cloture
  commit: auto
