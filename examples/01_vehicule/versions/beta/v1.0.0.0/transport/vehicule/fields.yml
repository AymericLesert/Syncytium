# --- l'identification (la feuille IDENTIFICATION) ---

nom: text[..40]

immatriculation: text[..12]        # AA-999-AA et les formats anciens — pas de masque unique

photo: image[512x512]              # le visage porté par l'image (D386), la vignette automatique

# l'unité vit dans le type, pas dans la valeur (D826)
type:
  type: enum
  required: true
  values:
    thermique:
      label:
        fr: Thermique
    electrique:
      label:
        fr: Électrique

# la devise est visuelle (D832) : les montants restent nus, la devise
# habille l'affichage — le véhicule vit dans une seule devise
devise:
  type: enum
  required: true
  values:
    euro:
      label:
        fr: "€"
    franc:
      label:
        fr: "F"                    # les classeurs antérieurs au passage (1992-2001)

# --- le cycle de vie (D424–D427) : Création → Actif → Clôture ---
# la naissance au default (D424) ; l'activation libre — la liste
# navigatrice (D426) ; la clôture = l'automatisme du cliquet
# (D354/D427) — la vente posée bascule d'elle-même, sans retour
statut:
  type: enum
  required: true
  default: creation
  values:
    creation:
      label:
        fr: Création
      allow: [create, read, update, delete]
      promote:
        - to: actif
    actif:
      label:
        fr: Actif
      allow: [create, read, update]      # le journal s'écrit (D422 — create = le sous-composant)
      promote:
        - to: cloture
          when: date_vente != null
    cloture:
      label:
        fr: Clôture
      allow: [read]                      # l'archive — la vie ne se réécrit pas

mode_achat: text[..40]             # « Acheté concessionnaire », « Acheté en LOA »

lieu_achat: text[..60]

date_achat:
  type: date
  required: true

# la vente ou la restitution — elle bascule le statut (le cliquet) et
# clôt l'échéancier ; APRÈS LA CLÔTURE, ELLE NE SE MODIFIE PLUS : l'état
# ne porte que read (D422), sans demote (D425) — et aucune opération n'y touche
date_vente: date

km_initial:
  type: integer[0..]
  required: true                   # le compteur au retrait (4, 39)

# --- le financement (la feuille CREDIT | LOA) — à plat (D831) ---

financement:
  type: enum
  values:
    comptant:
      label:
        fr: Comptant
    credit:
      label:
        fr: Crédit
    loa:
      label:
        fr: LOA

capital: decimal                   # crédit — 24 500

taux_annuel: percentage            # crédit — 6,187

assurance_mensuelle: decimal       # crédit — 34,40

mensualite: decimal                # LOA — 434,48 ; crédit : reportée aux échéances

duree_echeances: integer[0..]      # 60, 36

premier_mois: date[yyyy-mm]        # le premier mois du financement — 2016-02, 2023-10

jour_echeance: integer[1..31]      # le jour d'échéance du mois (D831) — le 10, le 5 ; la coche Payé s'en déduit

km_annuel: integer[0..]            # LOA — 23 000 km/an (le « km prév. »)

# --- les compositions (D399) — le grain d'écriture ---

consommations: list of consommation

entretiens: list of entretien

revisions: list of revision        # l'échéancier des règles (D826)

# engendrées à la validation du financement (creer_echeancier), closes
# à la vente — les non payées supprimées (clore_echeancier) — D831
echeances: list of echeance

# ------ Champs calculés ------

# l'unité de la quantité, dérivée du type — le .select des énumérés (D833)
unite:
  type: text
  formula: type.select(thermique: "litres", electrique: "kWh")

# --- le bilan (la feuille BILAN) — tout calculé, les formules du réel ---

km_courant:
  type: integer
  formula: iif(entretiens.max(km) > consommations.max(total_km), entretiens.max(km), consommations.max(total_km))

nb_jours:                          # 3 789 jours
  type: duration
  formula: consommations.sum(nb_jours)

km_total:                          # 300 460 km
  type: integer
  formula: consommations.sum(km)

quantite_totale:                   # 17 755,77 litres
  type: decimal
  formula: consommations.sum(quantite)

conso_moyenne:                     # 5,91 aux 100 km
  type: decimal
  formula: 100 * quantite_totale / km_total

duree_moyenne:                     # 9,3 jours/plein
  type: decimal
  formula: nb_jours.days / consommations.count()

total_entretien:                   # l'achat et la vente sont des lignes du journal
  type: decimal
  formula: entretiens.sum(montant)

total_energie:
  type: decimal
  formula: consommations.sum(prix_total)

# le coût du financement : les intérêts du crédit, les loyers payés de la LOA
cout_financement:
  type: decimal
  formula: financement.select(credit: echeances.sum(interet if paye), loa: echeances.sum(mensualite if paye), comptant: 0)

cout_total:
  type: decimal
  formula: total_entretien + total_energie + cout_financement

prix_energie_km:                   # 0,088 €/km
  type: decimal
  formula: total_energie / km_total

prix_km:                           # 0,249 €/km
  type: decimal
  formula: cout_total / km_total

prix_jour:                         # 19,71 €/jour
  type: decimal
  formula: cout_total / nb_jours.days
