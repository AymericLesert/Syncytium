# L'emplacement — le référentiel des emplacements de PMI, construit à
# quatre origines comme le dépôt (D962, D1008) : les paramètres de Cegid
# (PARAM — les emplacements actifs, avec leur libellé), les fiches articles
# (ARCTCODEP + ARCTCODMPL), les mouvements (MVCTDEPOT + MVCTCODMPL) et les
# niveaux de stock non nuls (DPKTDEPOT + DPKTCODMPL) ; les valeurs
# distinctes de chaque source (D658). « L'identité d'un
# emplacement est un couple (dépôt, emplacement) » (D962).
name: emplacement
description: Un emplacement de stockage dans un dépôt
label: "{depot} / {code}"
identity: [depot, code]
history: true

fields:
  depot:
    # l'emplacement appartient à un dépôt — la référence (D396), part de
    # l'identité (D962)
    type: stock.depot
    required: true
    label:
      fr: Dépôt

  code:
    type: text[..10]
    required: true
    label:
      fr: Code

  libelle:
    # connu par les paramètres seulement (D962)
    type: text[..40]
    label:
      fr: Libellé

  actif:
    # les paramètres = les emplacements actifs ; « tout nouvel emplacement
    # est ajouté et inactif » (D962) — né des mouvements ou des fiches, il
    # naît au défaut (D941)
    type: boolean
    required: true
    default: false
    label:
      fr: Actif

  mouvements_par_article:
    # le second accès aux mouvements (D1016) — la vue dérivée (D405)
    # groupée par article : une cellule par article passé par cet
    # emplacement
    type: association with stock.mouvement if emplacement = me
    group: [article]
    label:
      fr: Mouvements par article

  # ------ Champs calculés ------

  stock_par_article:
    # la quantité par article déduite des mouvements — la somme par
    # cellule de l'association groupée (D1015/D1016), signée par le sens
    # (D1009), chaque cellule dans l'unité de stock de son article
    type: 'list of [article: technique.article]'
    formula: 'mouvements_par_article.sum(sens.select(entree: quantite, sortie: -quantite))'
    label:
      fr: Stock par article

gui: ~{gui.yml}                  # les surfaces — le morceau 5 (D767)
