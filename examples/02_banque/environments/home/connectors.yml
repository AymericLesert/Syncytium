# le natif du domestique (D729)
database:
  type: storage
  class: sqlite

# « pas de secrets dans la famille » (D759)
authentication:
  class: none

# le mail muet, assumé (D763)
smtp:
  class: none

# le legacy de la reprise (le morceau R1) — le storage csv sur le dossier :
# une entité sur un ou plusieurs fichiers du même format (D816)
legacy:
  type: storage
  class: csv
  parameters:                                  # le paramétrage technique de la classe
    directory: ${SYNCYTIUM_LEGACY_DIRECTORY}   # le chemin hors dépôt (D321)
    encoding: windows-1252
    separator: ";"
  entities:                                    # la carte entités → fichiers (D828/D845)
    # le défaut (D845) : la première ligne du CSV = les entêtes existantes —
    # elles nomment les colonnes (ici, les noms de la source budget) ; les
    # écarts se déclarent à l'objet : files: + headers: [..] (l'entête de
    # substitution, l'ordre des colonnes) + skipheader: false (sans entête)
    budget: [budget.txt, budget-clos.txt]      # une entité, plusieurs fichiers — l'union (D816)
