# La phase 10 — l'échéancier EN DONNÉES : les valeurs figées des
# tableaux CREDIT ou LOA (la source fusionnée D847) ; la coche Payé
# et le reste dû se recalculent d'eux-mêmes (D831). Le rang = la
# ligne de la plage.

echeance:
  to: transport.echeance
  parent:
    vehicule: connector.filename
  # la ligne des totaux de la LOA (les sommes sans date) s'écarte
  filter: date != null
  fields:
    numero:        connector.line
    date:          date
    interet:       interet
    amortissement: amortissement
    assurance:     assurance
    mensualite:    mensualite
