# Les niveaux de stock
STDEPLOT:
  description: >-
    Les niveaux de stock. L'identité : l'article par sa clé composée, le lot en texte, sans référentiel, l'emplacement
    par le couple dépôt + code, le dépôt par son code, le code d'enregistrement tel quel. Les lieux et les articles
    précèdent ; un niveau sur un lieu inconnu est isolé au pré-contrôle. Les niveaux non nuls font naître leurs lieux ;
    un niveau à zéro sur un lieu inconnu reste une anomalie. Le prix du lot est à la devise de l'entreprise ; la
    péremption des périssables se vérifie dans l'entrepôt. La table est un état, pas un journal : relue en entier chaque
    nuit, sans historique — les mouvements portent l'histoire, le stock à une date se reconstitue d'eux.
  to: stock.niveau
  fields:
    article:        { code: DPKTCODART, complement: DPKTCOMART }
    lot:            DPKTNUMLOT
    emplacement:    { depot: DPKTDEPOT, code: DPKTCODMPL }
    depot:          DPKTDEPOT
    enregistrement: DPKTCODENR
    quantite:            DPCNSTOPHY
    quantite_reservee:   DPCNRESFER
    quantite_en_cours:   DPCNENCOUR
    stock_minimum:       DPCNSTOMIN
    prix_unitaire:       amount(DPCNPULOT)
    dernier_mouvement:   DPCJMOU
    peremption:          DPCJPEREMP
    inventaire:
      formula: DPCJJINV
      description: Le jour de l'inventaire ; la semaine se déduit du jour.
    quantite_inventaire: DPCNQTINV
  report:
    when: [migration]
    to: [logistique]
    by: [notification, mail]
