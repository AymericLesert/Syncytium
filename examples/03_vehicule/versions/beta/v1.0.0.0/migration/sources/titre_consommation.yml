# Le nom de l'entité source
# Le titre de la feuille CONSOMMATION, le discriminant du type — « CONSOMMATION D'ESSENCE » pour le thermique,
# « CONSOMMATION D'ELECTRICITE » pour l'électrique ; un enregistrement par classeur.
name: titre_consommation

# La description de l'entité source
description: Le titre de la feuille de consommation — thermique ou électrique

# Les colonnes
# Le connecteur expose la plaque, lue sur un autre onglet pour la jointure au véhicule, et le titre ; la source
# ajoute une description et le calculé qui tire le type du titre.
fields:

  immatriculation:
    description: La plaque du classeur.

  type_vehicule:
    formula: '"electrique" if titre like ".*ELECTRIC.*" else "thermique"'
    description: Le type du véhicule au vocabulaire du modèle.
