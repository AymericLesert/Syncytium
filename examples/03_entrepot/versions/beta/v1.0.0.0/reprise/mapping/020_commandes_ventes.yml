# L'étape 20 — les commandes de vente : ECOMCLI vers commande.commande_vente,
# l'entête (D882 — sans héritage entre les ventes et les achats). Les
# clients (008) et les articles (013–016) précèdent (D662). L'identité :
# le numéro et l'indice de révision (D865/D951) — une ligne d'entête par
# révision ; le numéro est un counter dont la migration surcharge la
# valeur (D883, le privilège de la reprise D175) : la valeur vient du
# calculé numero de la source, la clé convertie à la lecture (D990). Le
# client par sa clé (D654 — le raccourci à un champ, D931). Le statut de
# l'entête n'est pas repris — « ECCTSTATUT peut être ignoré » (D1002), les
# lignes portent le leur. L'adresse de livraison propre à la commande, sans GPS :
# la forme texte du constructeur (D961) ; absente quand la ville manque.
# Les lignes viennent à l'étape 21, par parent: (D931).

ECOMCLI:
  to: commande.commande_vente
  fields:
    # --- l'identité (D930) ---
    numero:  numero                       # le calculé de la source — le counter surchargé (D883/D990)
    indice:  ECKTINDICE
    # --- le client et la référence ---
    client:  ECCTCODE                     # la référence par la clé (D654/D931)
    reference_client: ECCTREFCDE
    # --- les dates (date_pmi aux settings — D992) ---
    date:               ECCJCRE
    date_echeance:      ECCJECHFOR
    derniere_livraison: ECCJDERBL
    derniere_facture:   ECCJDERFA
    # --- les conditions ---
    devise:      ECCTDEVISE               # les lignes la lisent par owner (D760)
    taux_change: ECCNTXDEVI
    # --- la livraison (D961 — la forme texte, sans GPS chez PMI) ---
    livraison_nom: ECCTNOMLIV
    livraison_adresse: >-
      geolocation(ECCTRUE1LI + " " + ECCTRUE2LI + " " + ECCTRUE3LI + ", " + ECCTCPLIV + " " + ECCTVILLIV + ", " + ECCTPAYSLI)
        if ECCTVILLIV != null
  operations:
    commande_vente.numero.update(numero)   # la méthode du type counter, le champ adressé par le point : le compteur se positionne sur la plus grande valeur reprise (D998/D999)
  report:
    when: [migration]
    to: [commercial]                      # les ventes, c'est le commercial qui corrige (D945)
    by: [notification, mail]
