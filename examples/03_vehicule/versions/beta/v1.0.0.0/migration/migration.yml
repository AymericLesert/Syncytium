# La migration classeurs
# La reprise des classeurs historiques, un par véhicule, sur le patron de la banque ; l'ordre des migrations
# déclarées est leur ordre d'exécution.
classeurs:

  # La base d'origine
  # Le storage xlsx de l'environnement : les classeurs du dossier du legacy.
  from: legacy

  # Le mode
  # absolute : le tout ou rien — un passage en erreur n'écrit rien.
  mode: absolute

  # La remise à zéro
  # Chaque passage repart de zéro.
  reset: true

  # Les entités sources
  # Sept feuilles ou plages des classeurs ; chacune porte la plaque du véhicule, lue sur la feuille d'identification,
  # pour se joindre à lui.
  sources:
    - ~{sources/identification.yml}
    - ~{sources/titre_consommation.yml}
    - ~{sources/consommation.yml}
    - ~{sources/entretien.yml}
    - ~{sources/regle_revision.yml}
    - ~{sources/credit_parametres.yml}
    - ~{sources/echeance.yml}

  # Les règles
  # Dix règles : le numéro du fichier fait l'ordre des étapes. Une règle porte le nom de son entité source : sa
  # description, sa cible (to), son filtre (filter), son possesseur (parent) et ses affectations (fields — la
  # formule, ou en forme longue formula, description et message).
  mapping:
    - ~{mapping/[0-9]+_.*\.yml}
