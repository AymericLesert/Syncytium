# Le format de la configuration
# La version de la grammaire que parle ce projet : un moteur qui ne la connaît pas refuse le projet à la lecture de
# cette seule ligne ; un format plus ancien est converti à l'ingestion.
from: Syncytium-1.0

# Le nom du projet
name: entrepot

# La langue technique de l'instance
# Celle des journaux, des traces et des erreurs techniques, parmi les langues du core et des hooks de langue ;
# elle ne change plus.
language: fr

# La description du projet
description: L'entrepôt de données de l'entreprise — les données de Cegid PMI standardisées, harmonisées et fiabilisées

# Le concepteur
# Celui qui a conçu l'entrepôt ; la documentation le nomme.
author: Aymeric Lesert

# Le contact
# L'adresse des demandes d'évolution et des questions sur l'application, hors de l'application.
contact: entrepot@entreprise.example

# Les droits d'auteur
# Le titulaire des droits sur la configuration de l'entrepôt.
copyright: © 2026 L'entreprise

# La promotionnelle
# L'entrepôt est un miroir interne de l'ERP : il n'a pas de documentation promotionnelle et n'en aura pas.
promotional: false

# La page d'accueil
# Globale, hors des versions : la présentation de l'entrepôt et la mention d'information du RGPD, ancrée là.
home: ~{documentation/home.md}

# Les profils de confidentialité
# Un niveau et les groupes qui voient le champ, nommés une fois et référencés au champ ; chaque profil porte son
# niveau (level) et ses groupes (groups) : confidentiality: ${confidentiality.financier}.
confidentiality:

  # Le profil financier
  # Les prix de revient, les prix d'achat, les valeurs de stock, le bancaire.
  financier:
    level: protected
    groups: [achats, direction]

  # Le profil de la direction
  # Les marges, les commissions.
  direction:
    level: protected
    groups: [direction]

  # Le profil commercial
  # Les conditions commerciales.
  commercial:
    level: protected
    groups: [commercial, direction]

# Les environnements d'exécution
# Chaque environnement porte le storage de l'application, ses connecteurs, sa journalisation et son nettoyage ; rien ne
# se déduit de l'arborescence, la déclaration fait foi.
environments: ~{environments/environments.yml}

# Les versions de l'application
# Le statut d'une version est son dossier : beta sur le staging, production sur la production.
versions: ~{versions/versions.yml}
