# La journalisation du staging (D830 — logging.yml, la clé logging:
# à l'environnement ; D343 : l'actif en info + puits de logs ; D800 : la
# maîtrise des dimensions, de la taille et de la rotation)

# Verbose ou non

verbose: True    # le staging plus verbeux que la production (mien)

# Configuration du rafraîchissement du fichier de configuration

syncytium:
    reload-disable:
        # time laps between 2 checks of evolution configuration (if {date} appears into an item)
        interval: 60

    cleanup-disable:
        # time laps between 2 checks of cleaning up log directory (remove older file)
        interval: 86400
        directory: ${SYNCYTIUM_LOG_DIRECTORY}
        # Fait référence à la propriété "name" du fichier syncytium.yml
        # la date lue dans le nom du fichier — le groupe nommé (D1070/D1071)
        pattern: "^${....name}-(?<date>[0-9]{4}-[0-9]{2}-[0-9]{2})\\.log(\\.[0-9]+)?$"

        # Durée de rétention des fichiers de journalisation
        retention: 30d

# Configuration du composant Logging de Python

version: 1

formatters:
    standard:
        format: "%(asctime)s [%(levelname)-5s] (%(process)d:%(processName)s) %(message)s"

handlers:
    console:
        class: logging.StreamHandler
        level: INFO
        formatter: standard
        stream: ext://sys.stdout

    file:
        class: logging.handlers.RotatingFileHandler
        level: INFO
        formatter: standard
        filename: ${SYNCYTIUM_LOG_DIRECTORY}\${....name}-${now:yyyy-mm-dd}.log
        maxBytes: 134217728 # 128Mb
        backupCount: 10
        encoding: utf8

root:
    level: INFO
    handlers: [console, file]
