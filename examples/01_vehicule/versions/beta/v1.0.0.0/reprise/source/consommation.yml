# La feuille CONSOMMATION (la carte du connecteur porte la lecture —
# D845 : sheet, skiprows ; la ligne système `ligne` = le rang parmi les
# données, cf. le manque R2). Les entêtes diffèrent entre le thermique et
# l'électrique : chaque champ porte son entête en label (D236), les
# colonnes absentes d'un classeur restent nulles ; les colonnes
# calculées du classeur (Km, Nb Litres/100, Prix Total…) sont IGNORÉES —
# le modèle les recalcule (D648/D657).

name: consommation
description: Les lignes de ravitaillement — le plein du thermique, la charge de l'électrique


fields:
  date:
    type: date
    label:
      fr: Date
  total_km:
    type: integer
    label:
      fr: Total Km
  nb_litres:
    type: decimal
    label:
      fr: Nb Litres
  charge:
    type: decimal
    label:
      fr: Charge électrique
  prix_litre:
    type: decimal
    label:
      fr: Prix au Litre
  prix_kwh:
    type: decimal
    label:
      fr: Prix au KwH

  # les calculés de normalisation (D660) — les deux colonnes en une (D684)
  quantite_n:
    formula: iif(nb_litres != null, nb_litres, charge)
  prix_unitaire_n:
    formula: iif(prix_litre != null, prix_litre, prix_kwh)
