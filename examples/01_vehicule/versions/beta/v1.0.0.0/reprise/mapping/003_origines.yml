# La phase 3 — la première ligne VIVANTE de consommation = l'origine
# du véhicule : le retrait (la date, le compteur initial) — au réel,
# CONSOMMATION!B5 et D5 (la ligne vivante = au moins un champ déclaré
# servi ; la ligne du paramètre C4 de la Zoe et la ligne blanche du
# Partner se sautent — cf. le manque R2). Elle ne devient
# PAS une consommation (la phase 4 l'écarte). Le Partner y prend sa
# date d'achat (pas de K1) — la Zoe garde la sienne (l'écrasement est
# sans perte : la même valeur au jour du retrait près, l'approximation
# assumée). La devise par l'année : les classeurs d'avant 2002 vivent
# en francs (.year — les sous-items du date, D838).

consommation:
  to: transport.vehicule
  key: fichier
  filter: ligne = 1
  fields:
    date_achat: date
    km_initial: total_km
    devise:     iif(date.year < 2002, "franc", "euro")
