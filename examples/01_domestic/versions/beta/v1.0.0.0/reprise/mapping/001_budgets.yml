# Le référentiel des budgets — les valeurs distinctes (D658)
# La même règle sur les deux tables source : l'union se fait par la clé (D654)

budget:
  to: banque.budget
  distinct: [Budget]
  key: Budget
  fields:
    libelle: Budget
  # « Ces 2 budgets sont exclus de la liste des budgets à sélectionner » (D811) :
  # ils naissent inactifs — la sélection = les actifs seuls (D137/D398) ; en proposition
  inactive: Budget = "OUVERTURE" or Budget = "FERMETURE"

budget_clos:
  to: banque.budget
  distinct: [Budget]
  key: Budget
  fields:
    libelle: Budget
  inactive: Budget = "OUVERTURE" or Budget = "FERMETURE"
