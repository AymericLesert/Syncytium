# La déclaration de la présentation graphique — le morceau 4.
# Pas de formulaire déclaré : le défaut du socle suffit — la saisie
# vit dans la liste (l'édition en ligne, D205/D445).
lists:
  journal:                         # la feuille ENTRETIEN — le journal de vie
    title: { fr: "Le journal de vie" }
    searchable:
      - vehicule: { select: mono, required: true }
      - date                       # la plage (D784)
      - recherche                  # le champ mutualisé (D780) — la désignation
    columns: [date, designation, montant, km, revision]
    editable: [date, designation, montant, km, revision]
    sort: [date, numero]
    selection: multiple
