# Le nom de l'entité source
# La feuille IDENTIFICATION, une feuille-formulaire et non un tableau : les cellules sont adressées, un enregistrement
# par classeur. Les classeurs anciens n'ont pas les cellules des dates : elles restent nulles, les dates viendront de
# la première ligne de consommation et de la ligne de vente du journal.
name: identification

# La description de l'entité source
description: La carte d'identité du classeur — le nom, la plaque, l'achat

# Les colonnes
# Le connecteur expose les colonnes, leur type et leur cellule ; la source ajoute ce qu'il ne porte pas, ici des
# descriptions.
fields:

  immatriculation:
    description: La plaque, l'identité du véhicule.

  date_debut:
    description: L'achat ; le classeur récent seul la porte.

  date_fin:
    description: La restitution prévue ; le classeur récent seul la porte.

  photo:
    description: >-
      L'image présente sur la feuille : son ancre varie d'un classeur à l'autre, la référence désigne la feuille, pas la
      cellule.
