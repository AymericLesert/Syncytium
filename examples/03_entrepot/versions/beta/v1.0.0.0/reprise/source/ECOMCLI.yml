# La table ECOMCLI de PMI — 91 colonnes, les mêmes que ECOMFOU : l'entête
# de commande, la source de commande.commande_vente (D882 — sans héritage entre
# les ventes et les achats). L'identité : le numéro et l'indice de révision
# (D865/D951) — une ligne d'entête par révision, ses lignes avec elle. La
# lecture par plage de numéros (D880). Les colonnes lues typées et
# renvoyées, les autres non lues (D947).
name: ECOMCLI
description: Les entêtes de commandes de vente de PMI — la source de commande.commande_vente

filter: ECKTSOC = "100"
identity: [ECKTNUMERO, ECKTINDICE]
coverage: ECKTNUMERO[10000]
# la couverture : la partition par plage de dix mille numéros, la reprise
# depuis la dernière valeur parcourue (D878–D880)

fields:
  ECKTSOC:     text[3]                                        # la société — le filtre (D663)
  ECKTNUMERO:  text[6]                                        # → commande_vente.numero — l'identité (D871) ; le counter surchargé par la migration (D883), converti par le calculé numero (D990)
  ECKTINDICE:  text[3]                                        # → commande_vente.indice — l'identité (D871)
  ECCJCRE:     date_pmi                                       # → commande_vente.date
  ECCTCODE:    CLIENT.CLKTCODE                                # → commande_vente.client — la référence (D648)
  ECCTNOMLIV:  text[40]                                       # → commande_vente.livraison_nom
  ECCTRUE1LI:  text[40]                                       # → commande_vente.livraison_adresse
  ECCTRUE2LI:  text[40]                                       # → commande_vente.livraison_adresse
  ECCTCPLIV:   text[16]                                       # → commande_vente.livraison_adresse
  ECCTVILLIV:  text[40]                                       # → commande_vente.livraison_adresse
  ECCTPAYSLI:  text[20]                                       # → commande_vente.livraison_adresse
  ECCTREFCDE:  text[20]                                       # → commande_vente.reference_client
  ECCJECHFOR:  date_pmi                                       # → commande_vente.date_echeance
  ECCJDERBL:   date_pmi                                       # → commande_vente.derniere_livraison
  ECCJDERFA:   date_pmi                                       # → commande_vente.derniere_facture
  ECCTDEVISE:  text[3]                                        # → commande_vente.devise — la devise des montants (D771)
  ECCNTXDEVI:  decimal                                        # → commande_vente.taux_change
  ECCTSTATUT:  text[2]                                        # → commande_vente.statut — les codes de l'exemple inventés, traduits au mapping (D946/D963)
  ECCTRUE3LI:  text[40]                                       # → commande_vente.livraison_adresse

  # --- le numéro de commande en nombre (D990 : la conversion d'une clé se
  # fait à la lecture, jamais dans la règle ni dans parent:) : le nchar(6)
  # de PMI vers la valeur du counter (D883) — un calculé de la source (D660) ---
  numero:
    formula: integer(ECKTNUMERO)
