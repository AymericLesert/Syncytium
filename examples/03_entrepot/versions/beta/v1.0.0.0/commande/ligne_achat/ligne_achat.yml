# La ligne de commande d'achat — la table LCOMFOU de PMI (la même
# structure que LCOMCLI) : la composition de la commande d'achat
# (D399). La ligne référence l'article (D396).
name: ligne_achat
description: Une ligne de commande d'achat — l'article, les quantités, le prix, les délais
label: "{numero} — {article}"
identity: [numero, sous_numero]
history: true

allow:
  create: false
  update: false
  delete: false

fields: fields.yml

validation:
  - quantite > 0
  - quantite_recue <= quantite
