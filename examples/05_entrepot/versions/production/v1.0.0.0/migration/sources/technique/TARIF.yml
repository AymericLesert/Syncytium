# Le nom de la table
# La table TARIF de PMI, 15 colonnes : une ligne par article, tiers, lettre de tarif et date d'application.
name: TARIF

# La description de la table
description: Les tarifs de PMI — la source de article.tarifs, la grille tarifaire en hypercube

# Le périmètre lu
# La société 100, les tarifs des clients (genre 1) et des fournisseurs (genre 2).
filter: TAKTSOC = "100" and TAKTGENRE in ["1", "2"]

# L'identité d'une ligne
# Le genre et le code du tiers, l'article, la lettre de tarif et la date d'application.
identity: [TAKTGENRE, TAKTCODE, TAKTCODART, TAKTCOMART, TAKTTARIF, TAKJAPLI]

# Le rapport des anomalies de la table
# Le commercial corrige les tarifs de vente, les achats les tarifs d'achat.
report:
  when: [migration]
  to: [commercial, achats]
  by: [notification, mail]

# Le possesseur d'une ligne
# L'article du tarif, par son code et son complément.
parent:
  ARTICLE: { ARKTCODART: TAKTCODART, ARKTCOMART: TAKTCOMART }

# Les colonnes
# Chaque colonne lue porte son type et sa description ; une colonne écartée porte le type ignored et son motif ; les
# colonnes que la table ne cite pas ne sont pas lues.
fields:

  TAKTSOC:
    type: text[3]
    description: La société ; seule la société 100 est lue.

  TAKTGENRE:
    type: text[1]
    description: "Le genre du tiers, un chiffre de 0 à 9 : 1 le client, 2 le fournisseur."

  TAKTCODE:
    type: text[6]
    description: Le code du tiers, client ou fournisseur selon le genre.

  TAKTCODART:
    type: text[18]
    description: Le code de l'article.

  TAKTCOMART:
    type: text[6]
    description: Le complément du code de l'article.

  TAKTTARIF:
    type: text[1]
    matches: "^[A-Za-z]$"
    description: La lettre de tarif, une seule lettre.

  TAKJAPLI:
    type: date_pmi
    description: La date d'application du prix.

  TACNPU:
    type: decimal
    description: Le prix unitaire.

  TACNTRANCH:
    type: integer
    description: Le seuil de quantité à partir duquel le prix vaut.

  TACTCOMMEN:
    type: text[20]
    description: Le commentaire du tarif.

  TACTDEVISE:
    type: text[3]
    description: La devise du prix.

  TACTVALID:
    type: enum { O, N }
    description: "O : le tarif est valide, N : archivé."

  TACNFORFAI:
    type: decimal
    description: Le forfait.

  # Les colonnes calculées
  # Le tiers du tarif, selon le genre : la règle alimente la dimension tiers avec celui des deux qui est renseigné.
  client:
    type: CLIENT.CLKTCODE
    description: Le client du tarif, pour le genre 1.
    formula: TAKTCODE if TAKTGENRE = "1"

  fournisseur:
    type: FOURNIS.CLKTCODE
    description: Le fournisseur du tarif, pour le genre 2.
    formula: TAKTCODE if TAKTGENRE = "2"
