# Le nom de la table
# La table FOURNIS de PMI, 167 colonnes — les mêmes que la table CLIENT : les fournisseurs de l'entreprise.
name: FOURNIS

# La description de la table
description: Les fournisseurs de PMI — la source de tiers.tiers et de tiers.fournisseur

# Le périmètre lu
# La seule société 100.
filter: CLKTSOC = "100"

# L'identité d'une ligne
# Le code du fournisseur.
identity: [CLKTCODE]

# Le rapport des anomalies de la table
# Les achats corrigent les fiches fournisseurs à l'origine.
report:
  when: [migration]
  to: [achats]
  by: [notification, mail]

# Les colonnes
# Chaque colonne lue porte son type et sa description ; une colonne écartée porte le type ignored et son motif ; les
# colonnes que la table ne cite pas ne sont pas lues.
fields:

  CLKTSOC:
    type: text[3]
    description: La société ; seule la société 100 est lue.

  CLKTCODE:
    type: text[6]
    description: Le code du fournisseur.

  CLCTABRE:
    type: text[10]
    description: Le nom abrégé.

  CLCTNOM:
    type: text[40]
    description: Le nom ou la raison sociale.

  CLCTRUE1:
    type: text[40]
    description: La première ligne de rue.

  CLCTRUE2:
    type: text[40]
    description: La deuxième ligne de rue.

  CLCTCP:
    type: text[16]
    description: Le code postal.

  CLCTVILLE:
    type: text[40]
    description: La ville.

  CLCTPAYS:
    type: text[20]
    description: Le nom du pays.

  CLCTCPAYS:
    type: text[3]
    description: Le code du pays, tel que PMI l'écrit ; il déborde la norme ISO.

  CLCTSIRET:
    type: text[20]
    description: Le numéro SIRET.

  CLCTNOTVA:
    type: text[20]
    description: Le numéro de TVA intracommunautaire.

  CLCTTELEP1:
    type: text[20]
    description: Le téléphone.

  CLCTFAX1:
    type: text[20]
    description: Le fax.

  CLCTCECHEA:
    type: text[3]
    description: Le nombre de jours d'échéance, sur trois chiffres.

  CLCTBECHEA:
    type: enum { 1, 3, 6 }
    description: |
      La base du calcul de l'échéance.

      | Code | Libellé            |
      |------|--------------------|
      | 1    | Date de facture    |
      | 3    | Fin de mois        |
      | 6    | Fin de mois, le 10 |

  CLCTMREG:
    type: ignored
    description: Le mode de règlement, hors du modèle.

  CLCTLANGUE:
    type: enum { 01, 03, 05, 07 }
    description: |
      La langue du tiers.

      | Code | Libellé  |
      |------|----------|
      | 01   | Français |
      | 03   | Anglais  |
      | 05   | Allemand |
      | 07   | Espagnol |

  CLCTDEVISE:
    type: text[3]
    description: La devise des montants du fournisseur.

  CLCTBLOCAG:
    type: enum { E, C }
    description: Le motif de blocage ; vide, le fournisseur n'est pas bloqué.

  CLCJCRE:
    type: date_pmi
    description: La date de création.

  CLCJMOU:
    type: date_pmi
    description: La date de modification.

  CLCTEMAIL:
    type: text[60]
    description: L'adresse électronique.

  CLCTSITE:
    type: text[40]
    description: Le site web.

  CLCTJOURFO:
    type: text[1]
    description: Le délai de livraison du fournisseur.

  CLCTSWIFT:
    type: text[11]
    description: Le code BIC de la banque.

  CLCTIBAN:
    type: text[35]
    description: L'IBAN du compte bancaire.

  CLCTACTIF:
    type: enum { O, N }
    description: "O : le fournisseur est actif, N : inactif ; vide, il est actif."

  CLCTRUE3:
    type: text[40]
    description: La troisième ligne de rue.

  CLCNGPSX:
    type: decimal
    description: La longitude.

  CLCNGPSY:
    type: decimal
    description: La latitude.
