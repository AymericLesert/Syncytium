# Le titre de la feuille CONSOMMATION — le discriminant du type :
# « CONSOMMATION D'ESSENCE » (thermique) / « CONSOMMATION D'ELECTRICITE »
# (électrique). Un item par classeur.

name: titre_consommation
description: Le titre de la feuille de consommation — thermique ou électrique


fields:
  # la plaque du classeur — la cellule d'un autre onglet, répétée sur
  # chaque item (le mixte D848) : la jointure du mapping (D850)
  immatriculation:
    type: text[..12]
    reference: IDENTIFICATION!E1
  titre:
    type: text[..60]
    reference: CONSOMMATION!A1

  # le calculé de normalisation (D660)
  type_vehicule:
    formula: iif(titre like ".*ELECTRIC.*", "electrique", "thermique")
