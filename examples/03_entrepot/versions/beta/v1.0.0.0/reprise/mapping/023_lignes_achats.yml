# L'étape 23 — les lignes de commandes d'achat : LCOMFOU vers
# commande.ligne_achat, la composition de l'entête (D399) — la même
# structure que LCOMCLI. Le possesseur (numéro, indice) par le calculé et
# la colonne de la source (D931/D951/D990) ; l'article par sa clé
# composée ; les prix restreints à la cible (D859) — la règle n'en sait
# rien, elle écrit par le privilège de la reprise (D175/D942) ; l'expédié
# de PMI est le reçu ; les délais sont des jours (D1000).

LCOMFOU:
  to: commande.ligne_achat
  parent:
    commande_achat: { numero: numero, indice: LCKTPSF }
  fields:
    # --- l'identité au sein de la commande (D930) ---
    numero:  ligne
    # --- l'article ---
    article: { code: LCCTCODART, complement: LCCTCOMART }
    # --- les quantités ---
    quantite:       LCCNQTECDE
    unite:          LCCTUNICDE
    quantite_recue: LCCNQTEEXP            # « l'expédié » de PMI, reçu chez l'acheteur
    # --- les prix — la devise dans la valeur (D771) ---
    prix_brut: amount(LCCNPUBRUT, LCCTDEVISE)
    prix_net:  amount(LCCNPUNET, LCCTDEVISE)
    # --- les délais — des jours (D1000) ---
    delai_demande:   LCCJDELDDE
    delai_accuse:    LCCJDELARR
    delai_reception: LCCJDELEXP
    # --- l'état ---
    statut: 'LCCTSTATUT.select(null: "non_traite", A: "en_cours", P: "partielle", S: "soldee", T: "terminee")'   # les valeurs de PMI (D1002) ; le vide = le nul (D366) ; sans "..." : hors liste = rejet
  report:
    when: [migration]
    to: [achats]
    by: [notification, mail]
