# Les origines
consommation:
  description: >-
    La phase 3 : la première ligne vivante de consommation est l'origine du véhicule — le retrait, sa date et le
    compteur initial ; une ligne vivante sert au moins une colonne déclarée, les lignes de paramètre et les lignes
    blanches se sautent. Elle ne devient pas une consommation, la phase suivante l'écarte. Le classeur sans date d'achat
    la prend ici ; l'autre garde la sienne, l'écrasement est sans perte au jour du retrait près. La devise par l'année :
    les classeurs d'avant 2002 vivent en francs.
  to: transport.vehicule
  filter: connector.line = 1
  fields:
    immatriculation: immatriculation
    date_achat:      date
    km_initial:      total_km
    devise:          '"franc" if date.year < 2002 else "euro"'
