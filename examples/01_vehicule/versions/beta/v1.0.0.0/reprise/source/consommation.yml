# La feuille CONSOMMATION (la lecture à la carte — D845/D848 ;
# `connector.line` = l'identifiant de la ligne par rapport à la zone,
# la ligne vivante — D849). Les entêtes diffèrent entre le thermique et
# l'électrique : chaque champ porte son entête en label (D236), les
# colonnes absentes d'un classeur restent nulles ; les colonnes
# calculées du classeur (Km, Nb Litres/100, Prix Total…) sont IGNORÉES —
# le modèle les recalcule (D648/D657).

name: consommation
description: Les lignes de ravitaillement — le plein du thermique, la charge de l'électrique


fields:
  # la plaque du classeur — la cellule d'un autre onglet, répétée sur
  # chaque item (le mixte D848) : la jointure du mapping (D850)
  immatriculation:
    type: text[..12]
    reference: IDENTIFICATION!E1
  date:
    type: date
    label:
      fr: Date
  total_km:
    type: integer
    label:
      fr: Total Km
  nb_litres:
    type: decimal
    label:
      fr: Nb Litres
  charge:
    type: decimal
    label:
      fr: Charge électrique
  prix_litre:
    type: decimal
    label:
      fr: Prix au Litre
  prix_kwh:
    type: decimal
    label:
      fr: Prix au KwH

  # les calculés de normalisation (D660) — les deux colonnes en une (D684)
  quantite_n:
    formula: iif(nb_litres != null, nb_litres, charge)
  prix_unitaire_n:
    formula: iif(prix_litre != null, prix_litre, prix_kwh)
