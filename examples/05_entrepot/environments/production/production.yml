# La description de l'environnement de production — la vie courante de l'application
description: L'environnement de production — l'entrepôt alimenté chaque nuit depuis la base PMI de production

# La base de l'application
# Le connecteur storage qui porte le modèle et ses données ; les autres
# storages de l'environnement servent la reprise.
storage: entrepot

# La journalisation
# Le niveau des traces, leur format et le fichier du journal de
# l'environnement.
logging: ~{logging.yml}

# Le nettoyage des fichiers
# Les règles de rétention de l'environnement : le journal, le détail des
# migrations, les dépôts des watchers.
cleanup: ~{cleanup.yml}

# Les connecteurs
# Les bases, les services et les annuaires que l'application utilise dans
# cet environnement ; leurs paramètres viennent des variables du .env de
# l'environnement, les secrets y sont chiffrés.
connectors: ~{connectors.yml}

# Les réglages de l'environnement
# Ce qui vaut pour toutes les versions exécutées dans cet environnement.
settings: ~{settings.yml}
