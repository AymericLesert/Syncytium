# --- l'identité ---

article:
  # DPKTCODART + DPKTCOMART — la référence (D396)
  type: technique.article
  required: true
  label:
    fr: Article

lot:
  # DPKTNUMLOT nchar(18) — le numéro de lot ; Stock.Batch le décrit
  # chez PMI, l'entrepôt le garde en texte (l'analyse dira)
  type: text[..18]
  required: true
  label:
    fr: Lot

emplacement:
  # DPKTCODMPL — la référence à l'emplacement
  type: stock.emplacement
  required: true
  label:
    fr: Emplacement

depot:
  # DPKTDEPOT — la référence au dépôt
  type: stock.depot
  required: true
  label:
    fr: Dépôt

enregistrement:
  # DPKTCODENR nchar(1) — le code d'enregistrement de PMI, part de la clé
  type: text[1]
  required: true
  label:
    fr: Code d'enregistrement

# --- les quantités (l'unité de stock de l'article) ---

quantite:
  # DPCNSTOPHY — le stock physique
  type: decimal
  required: true
  label:
    fr: Quantité physique

quantite_reservee:
  # DPCNRESFER — réservée ferme
  type: decimal
  required: true
  default: 0
  label:
    fr: Réservée

quantite_en_cours:
  # DPCNENCOUR — en cours d'entrée
  type: decimal
  label:
    fr: En cours

stock_minimum:
  # DPCNSTOMIN — le minimum du niveau (celui de l'article vaut par
  # défaut)
  type: decimal
  label:
    fr: Stock minimum

# --- la valeur — restreinte (D859) ---

prix_unitaire:
  # DPCNPULOT — le prix du lot ; la devise de l'entreprise (le setting)
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix unitaire du lot

# --- les dates (AAAAMMJJ au masque) ---

dernier_mouvement:
  # DPCJMOU
  type: date
  label:
    fr: Dernier mouvement

peremption:
  # DPCJPEREMP
  type: date
  label:
    fr: Péremption

inventaire:
  # DPCJJINV — la date du dernier inventaire ; DPCSSINV, la semaine,
  # se déduit du jour (D1000/D1001)
  type: date
  label:
    fr: Dernier inventaire

quantite_inventaire:
  # DPCNQTINV
  type: decimal
  label:
    fr: Quantité inventoriée

mouvements:
  # l'accès retour aux mouvements du niveau (D394), nommé en vue dérivée
  # (D405) : les mouvements de l'article sur ce lot, à cet emplacement
  type: association with stock.mouvement if article = me.article and depot = me.depot and emplacement = me.emplacement and lot = me.lot
  label:
    fr: Mouvements

# ------ Champs calculés ------

stock_reconstitue:
  # « un comparatif entre les mouvements et le stockage peut être mené
  # par une règle de contrôle » (D1013) — la règle de contrôle en
  # calculé (forme mienne) : la quantité inventoriée plus les mouvements
  # depuis le dernier inventaire, signés par le sens (D1009) ; la mesure
  # dans l'unité de stock de l'article (D1009), la matrice empruntée
  type: measure
  unit: article.unite
  formula: >-
    measure(quantite_inventaire, article.unite_stock)
      + mouvements.sum(sens.select(entree: quantite, sortie: -quantite) if date > inventaire)
  label:
    fr: Stock reconstitué

ecart_mouvements:
  # le stock lu chez PMI moins le stock reconstitué — zéro attendu ; le
  # tableau de bord du morceau 5 le montre (D859)
  type: measure
  unit: article.unite
  formula: measure(quantite, article.unite_stock) - stock_reconstitue
  label:
    fr: Écart mouvements

disponible:
  type: decimal
  formula: quantite - quantite_reservee
  label:
    fr: Disponible

valeur:
  # la valeur du niveau — restreinte comme le prix
  type: amount
  formula: prix_unitaire * quantite if prix_unitaire != null
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Valeur

sous_minimum:
  # le tableau de bord (D859)
  type: boolean
  formula: quantite < stock_minimum if stock_minimum != null
  label:
    fr: Sous le minimum

perime:
  type: boolean
  formula: peremption < context.today if peremption != null
  label:
    fr: Périmé
