# La feuille ENTRETIEN (la lecture à la carte — D845 : le bloc droit
# aux entêtes homonymes écarté par range: A..H, cf. le manque R4).
# Les lignes de continuation de la Zoe (la désignation sur plusieurs
# lignes, sans date) : l'anomalie signalée à la migration — l'utilisateur
# ajuste la source et rejoue (D851).

name: entretien
description: Le journal de vie du classeur — les frais, les événements, l'achat, la vente


fields:
  # la plaque du classeur — la cellule d'un autre onglet, répétée sur
  # chaque item (le mixte D848) : la jointure du mapping (D850)
  immatriculation:
    type: text[..12]
    reference: IDENTIFICATION!E1
  date:
    type: date
    label:
      fr: Date
  designation:
    type: text[..200]
    label:
      fr: Désignation
  montant:
    type: decimal
    label:
      fr: Montant
  km:
    type: integer
    label:
      fr: KM
