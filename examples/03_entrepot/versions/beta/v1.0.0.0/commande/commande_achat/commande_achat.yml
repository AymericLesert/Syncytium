# La commande d'achat — la table ECOMFOU de PMI (la même structure
# qu'ECOMCLI, le même préfixe EC) et sa composition LCOMFOU. Séparée de
# la commande de vente, sans héritage (D882) — la structure se répète.
name: commande_achat
description: Une commande d'achat — l'entête, le fournisseur, les conditions et ses lignes
label: "{numero}-{indice} — {fournisseur}"
identity: [numero, indice]
history: true

fields: ~{fields.yml}
gui: ~{gui.yml}                  # les surfaces — le morceau 5 (D767)

validation:
  - date_echeance >= date if date_echeance != null
