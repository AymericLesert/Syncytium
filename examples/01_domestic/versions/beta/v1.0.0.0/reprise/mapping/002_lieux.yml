# Le référentiel des lieux — les valeurs distinctes (D658)

budget:
  to: banque.lieu
  distinct: [Lieu]
  filter: Lieu != null           # la valeur vide ne fait pas un lieu (D663) — 3 634 lignes sans lieu
  key: Lieu
  fields:
    libelle: Lieu

budget_clos:
  to: banque.lieu
  distinct: [Lieu]
  filter: Lieu != null
  key: Lieu
  fields:
    libelle: Lieu
