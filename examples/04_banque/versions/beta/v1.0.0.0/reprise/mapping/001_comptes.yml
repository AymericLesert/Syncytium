# La phase 1 (D814) — le filtre OUVERTURE crée les comptes (D811)
# La ligne-marqueur porte le numéro, le libellé (la Désignation) et l'ouverture.

budget:
  to: banque.compte
  filter: Budget = "OUVERTURE"
  fields:
    numero:    Numero_Compte        # l'identité alimentée — la phase 3 la retrouve (D654/D930)
    libelle:   Designation
    ouverture: Date_Operation
