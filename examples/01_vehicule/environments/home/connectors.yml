# le natif du domestique (D729)
database:
  type: storage
  class: sqlite

# « pas de secrets dans la famille » (D759)
authentication:
  class: none

# le mail muet, assumé (D763) — les notifications de l'échéancier (D826)
# restent dans l'application ; à revoir si le mail devient utile
smtp:
  class: none

# le legacy de la reprise (le morceau 5) — le storage xlsx sur le dossier :
# un classeur = un véhicule, les feuilles = les entités source (D826/D828)
legacy:
  type: storage
  class: xlsx
  # le paramétrage technique de la classe
  parameters:
    # le chemin hors dépôt (D321)
    directory: ${SYNCYTIUM_LEGACY_DIRECTORY}
  # la carte entités → fichiers (D828/D845/D846) — toutes les entités
  # source lisent les mêmes classeurs (le pattern D806). LA PLAGE AU
  # NOMMAGE EXCEL (D846) : la zone de nom, ou FEUILLE!cellules — la
  # première ligne de la plage porte les entêtes existantes (le défaut
  # D845 ; la substitution headers: sinon) ; la borne haute est un
  # plafond, la lecture s'arrête à la première ligne vide (cf. R1) ;
  # les feuilles-formulaires s'adressent aux champs (cell: — le même
  # nommage, un item par classeur)
  entities:
    identification:
      files: [ ".*\.xlsx?" ]
    titre_consommation:
      files: [ ".*\.xlsx?" ]
    consommation:
      files: [ ".*\.xlsx?" ]
      # l'entête à la ligne 3 — la plage embrasse entêtes + données
      range: CONSOMMATION!A3:H1000
    entretien:
      files: [ ".*\.xlsx?" ]
      # la plage borne d'elle-même le bloc droit homonyme (l'ex-R4)
      range: ENTRETIEN!A3:H100
    regle_revision:
      files: [ ".*\.xlsx?" ]
    credit_parametres:
      files: [ ".*\.xlsx?" ]
    credit_echeance:
      files: [ ".*\.xlsx?" ]
      range: CREDIT!A8:G100
    loa_echeance:
      files: [ ".*\.xlsx?" ]
      range: LOA!A3:G100
