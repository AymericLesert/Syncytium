# Les réglages de la version — l'étage instance de la cascade des
# settings (D359/D588 : l'application → le module → l'entité, le plus
# proche l'emporte). Le fichier est référencé par version.yml (le
# morceau 1).

# Les paramètres par défaut d'un type se déclarent sous le nom du type
# (D991 — les settings portent les défauts des types et la définition de
# nouveaux types, D359) : pour text, la normalisation à la frontière
# (D870/D872) — les blancs de fin des nchar de PMI rognés à la lecture,
# me désigne la valeur ; un champ surcharge avec sa propre expression
# (normalize: right("0000" + me, 4)).
text:
    normalize: trim(me)

# Les types dérivés (D992/D359) : la même forme qu'un type du catalogue —
# la clé est le nom, type: la base, le reste ses défauts, surchargeables
# au champ ; les colonnes de PMI les emploient par la forme courte (D356)
date_pmi:                       # les dates AAAAMMJJ de PMI (D820/D866)
    type: date
    mask: "yyyymmdd"
time_pmi:                       # les heures HHMMSS de PMI (le pendant, mien)
    type: time
    mask: "hhmmss"

# La devise de l'entreprise (D970) — les prix de l'article n'ont pas de
# colonne de devise chez PMI : la monnaie de l'entreprise, implicite ;
# les règles la lisent par context.settings.currency (D588), les tiers,
# les tarifs et les commandes portent la leur (D771)
currency: EUR

# Les profils de confidentialité (D885) — le niveau (D25) et les groupes
# (D26) nommés une fois, référencés au champ par l'interpolation de la
# configuration : confidentiality: ${settings.confidentiality.financier}
# (D321/D802 — « on exploite une capacité de la configuration »).
confidentiality:
  # les prix de revient, les prix d'achat, les valeurs de stock, le
  # bancaire — les achats et la direction
  financier:
    level: protected
    groups: [achats, direction]
  # les marges, les commissions — la direction seule
  direction:
    level: protected
    groups: [direction]
  # les conditions commerciales — le commercial et la direction
  commercial:
    level: protected
    groups: [commercial, direction]
