# La table CONTACT de PMI — 48 colonnes : les personnes chez un tiers,
# rejointes par le type de compte et le code (D950). La source de la
# composition contacts du tiers (D399) ; les champs nominatifs portent le
# marquage RGPD au modèle (D695). Six paires type/numéro de téléphone :
# la première va au téléphone, la seconde au portable (D950). Les
# colonnes lues typées et renvoyées, quelques-unes ignorées, les autres
# non lues (D947).
name: CONTACT
description: Les contacts de PMI — la source de tiers.contact

filter: CTKTSOC = "100" and CTCTTYPCPT in ["C", "F"]
identity: [CTKNID]

fields:
  CTKTSOC:     text[3]                                        # la société — le filtre (D663)
  CTKNID:      integer                                        # → contact.identifiant — l'identité (D871)
  CTCTTYPCPT:  text[1]                                        # le type de compte : C le client, F le fournisseur (D950) — les calculés ci-dessous
  CTCTCOMPTE:  text[6]                                        # le code du tiers, selon le type
  CTCTCIVILI:  text[6]                                        # → contact.civilite — traduite au mapping (D893)
  CTCTNOM:     text[40]                                       # → contact.nom
  CTCTPRENOM:  text[20]                                       # → contact.prenom
  CTCTFONCTI:  text[3]                                        # → contact.fonction — le code de fonction de PMI, le libellé au mapping
  CTCTACTIF:   text[1]                                        # → contact.actif — O actif ; le vide vaut actif (D950)
  CTCJANNIV:   date_pmi                                       # → contact.anniversaire — personnelle (D695)
  CTCTTYTEL1:  ignored                                        # le type de la première paire — la place décide (D950)
  CTCTNOTEL1:  text[30]                                       # → contact.telephone
  CTCTTYTEL2:  ignored                                        # le type de la seconde paire — idem
  CTCTNOTEL2:  text[30]                                       # → contact.portable
  CTCTMAIL1:   text[60]                                       # → contact.email
  CTCJCRE:     date_pmi                                       # → contact.date_creation

  # --- le tiers, selon le type de compte (D950 : « C ou F ») : deux
  # calculés typés référence (D660/D648), résolus avant de partir (D874) ;
  # le possesseur est l'un des deux — parent: ne sait pas choisir, le
  # mapping route par le type, une règle par tiers (D931/D933) ---
  client:
    type: CLIENT.CLKTCODE
    formula: CTCTCOMPTE if CTCTTYPCPT = "C"
  fournisseur:
    type: FOURNIS.CLKTCODE
    formula: CTCTCOMPTE if CTCTTYPCPT = "F"
