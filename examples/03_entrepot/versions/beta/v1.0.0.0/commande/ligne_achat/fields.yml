# --- l'identité (LCKTLIGNE, LCKTPSF) ---

numero:
  # LCKTLIGNE
  type: integer[1..]
  required: true
  label:
    fr: Ligne

# --- l'article ---

article:
  # LCCTCODART + LCCTCOMART — la référence (D396)
  type: technique.article
  required: true
  label:
    fr: Article

# la désignation de la ligne n'est plus ici : le commentaire vit dans
# LIBEL40, hors de l'exemple (D989)

# --- les quantités ---

quantite:
  # LCCNQTECDE
  type: decimal
  required: true
  label:
    fr: Quantité commandée

unite:
  # LCCTUNICDE
  type: text[..2]
  label:
    fr: Unité

quantite_recue:
  # LCCNQTEEXP — chez le fournisseur, l'expédié de PMI est le reçu
  type: decimal
  required: true
  default: 0
  label:
    fr: Quantité reçue

# --- les prix — restreints aux achats et à la direction (D859) ---

prix_brut:
  # LCCNPUBRUT + LCCTDEVISE
  type: amount
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix unitaire brut

prix_net:
  # LCCNPUNET + LCCTDEVISE
  type: amount
  required: true
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Prix unitaire net

# --- les délais — des jours, la colonne S est la semaine (D1000) ---

delai_demande:
  # LCCJDELDDE
  type: date
  label:
    fr: Délai demandé

delai_accuse:
  # LCCJDELARR
  type: date
  label:
    fr: Délai accusé

delai_reception:
  # LCCJDELEXP — la réception prévue
  type: date
  label:
    fr: Réception prévue

# --- l'état ---

statut:
  # LCCTSTATUT nchar(2) — les valeurs de PMI (D1002) : « A » acompte / en
  # cours, « » (vide) non traité, « S » soldé, « T » terminé, « P »
  # partiel — la liste close en énuméré (D883), les codes traduits à la
  # règle (D893) ; LCCTETACDE porte un état aux valeurs inconnues,
  # ignorée. Le vide de PMI est le nul du texte (D366) : non traité
  type: enum
  required: true
  label:
    fr: Statut
  values:
    non_traite:
      label:
        fr: Non traitée
    en_cours:
      label:
        fr: En cours
    partielle:
      label:
        fr: Partiellement reçue
    soldee:
      label:
        fr: Soldée
    terminee:
      label:
        fr: Terminée

# ------ Champs calculés ------

devise:
  type: text[3]
  formula: owner.devise
  label:
    fr: Devise

fournisseur:
  # le fournisseur de la commande, par l'accès montant (D760/D997)
  type: tiers.fournisseur
  formula: owner.fournisseur
  label:
    fr: Fournisseur

montant:
  type: amount
  formula: prix_net * quantite
  confidentiality: ${settings.confidentiality.financier}
  label:
    fr: Montant

reste_a_recevoir:
  type: decimal
  formula: quantite - quantite_recue
  label:
    fr: Reste à recevoir

en_retard:
  type: boolean
  formula: delai_reception < context.today and statut not in ["soldee", "terminee"]
  label:
    fr: En retard
