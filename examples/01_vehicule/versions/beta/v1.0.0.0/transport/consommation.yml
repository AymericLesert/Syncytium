# La consommation — la feuille CONSOMMATION : le suivi de la
# consommation du véhicule (D831), une ligne par plein ou par charge.
# Les calculés reportent les formules du classeur, colonne par colonne.
# Chaque ligne porte son numéro de 1 à n (D831) : la première ligne se
# déduit (numero = 1 part du km_initial du véhicule), le précédent
# s'atteint au rang (numero - 1).
name: consommation
label: "${name}"
fields:
  numero:   { type: integer[1..], required: true }      # le rang dans la vie du véhicule
  date:     { type: date, required: true, searchable: range }
  total_km: { type: integer[0..], required: true }      # le compteur du tableau de bord (saisi)
  quantite: { type: decimal, required: true }           # la valeur seule (D826) — litres ou kWh selon owner.unite
  prix_unitaire: decimal                                # la devise est visuelle (D832) — owner.devise
  # H = F × G — le total calculé du classeur
  prix_total: { type: decimal, formula: quantite * prix_unitaire }
  # A = B(n) − B(n−1) — la première ligne reste nulle (le classeur la laisse vide)
  nb_jours: { type: duration, formula: iif(numero = 1, null, date - owner.consommations.max(date if numero = me.numero - 1)) }
  # E = D(n) − D(n−1) — la première part du compteur au retrait (D831)
  km: { type: integer, formula: total_km - iif(numero = 1, owner.km_initial, owner.consommations.max(total_km if numero = me.numero - 1)) }
  conso_100: { type: decimal, formula: 100 * quantite / km }   # I = 100 × F / E — aux 100 km
  # C = C4/12 + C(n−1) au classeur — une ligne ≈ un mois : l'approximation.
  # L'intention (D834) : le « km prév. » suit le temps — les mois écoulés
  # depuis l'achat, bornés à la date de vente, × le douzième du forfait ;
  # km_annuel nul (thermique, comptant) → la colonne reste nulle
  km_prevu:
    type: decimal
    formula: (iif(owner.date_vente != null and owner.date_vente < date, owner.date_vente, date) - owner.date_achat).months * owner.km_annuel / 12
validation:
  - date >= owner.date_achat
  - total_km >= owner.km_initial

# La présentation graphique — inline (l'éclatement libre D767)
gui:
  forms:
    record:                          # la saisie du plein / de la charge — les saisies seules
      title:
        create: { fr: "Nouveau ravitaillement" }
        read:   { fr: "Ravitaillement du {date}" }
        update: { fr: "Modification du ravitaillement du {date}" }
        delete: { fr: "Suppression du ravitaillement du {date}" }
      items:
        - field[numero]
        - field[date]                # le calendar + les steppers (D785)
        - field[total_km]
        - field[quantite]            # la valeur seule — litres ou kWh selon le véhicule
        - field[prix_unitaire]
  lists:
    par_date:                        # la feuille CONSOMMATION, colonne à colonne
      title: { fr: "La consommation" }
      searchable:
        - vehicule: { select: mono, required: true }   # le possesseur (le patron banque)
        - date                       # la plage — le champ porte sa facette (D784)
      columns: [nb_jours, date, km_prevu, total_km, km, quantite, prix_unitaire, prix_total, conso_100]
      sort: [date, numero]
      selection: multiple
  charts:
    evolution_consommation:          # la feuille GRAPHIQUE (D826)
      title: { fr: "L'évolution de la consommation" }
      searchable:                    # le patron des listes (D782/D784/D798)
        - vehicule: { select: mono, required: true }
        - date                       # la plage — la facette range (D784)
      x: date[month]                 # le mois — le découpage temporel (D516)
      y: avg(conso_100)              # la moyenne du mois (D517/D580)
