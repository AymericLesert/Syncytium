# le natif du domestique (D729)
database:
  type: storage
  class: sqlite

# « pas de secrets dans la famille » (D759)
authentication:
  class: none

# le mail muet, assumé (D763)
smtp:
  class: none

# le legacy de la reprise (le morceau R1) — le storage csv sur le dossier :
# une entité sur un ou plusieurs fichiers du même format (D816)
legacy:
  type: storage
  class: csv
  parameters:
    directory: ${SYNCYTIUM_LEGACY_DIRECTORY}   # le chemin hors dépôt (D321)
    encoding: windows-1252
    separator: ";"
    file: [budget.txt, budget-clos.txt]   # un ou plusieurs fichiers (D816) — la liste ou le pattern (D806)
