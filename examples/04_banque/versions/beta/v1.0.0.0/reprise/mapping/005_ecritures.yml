# Les écritures
budget:
  description: >-
    La phase 2 : les écritures courantes, hors marqueurs. La règle est sans identité — création seule : le legacy n'a
    aucune clé naturelle, 54 doublons du quintuple compte, date, libellé, montant ; la migration en absolute avec remise
    à zéro l'admet, la garde de l'ingestion le vérifie. Le numéro d'écriture naît au fil de la création, dans l'ordre du
    fichier. La règle empile les virements référencés au cache — la première phase du rapprochement.
  to: banque.ecriture
  filter: Budget != "OUVERTURE" and Budget != "FERMETURE"
  parent: { compte: Numero_Compte }
  fields:
    date_operation: Date_Operation
    date_comptable: Date_Comptable
    libelle:  Designation
    budget:   Budget
    lieu:     Lieu
    montant:  amount(montant_signe, devise_iso)
    mode:     mode_norme
    cheque:   cheque_norme
    imprimee: Date_Impression
  operations:
    cache.push("virement", reference_virement, me) if reference_virement != null
