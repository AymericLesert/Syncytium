# Le type text
# Les défauts de tout champ texte ; un champ peut surcharger avec sa propre expression.
text:

  # La normalisation
  # La valeur lue est rognée de ses blancs, à la frontière ; me désigne la valeur.
  normalize: trim(me)

# Le type date_pmi
# Les dates de PMI, écrites AAAAMMJJ : une date lue au masque yyyymmdd ; les colonnes de dates des sources l'emploient.
date_pmi:
  type: date
  mask: yyyymmdd

# Le type time_pmi
# Les heures de PMI : une heure lue au masque hhmmss ; une colonne en hhmm surcharge le masque au champ.
time_pmi:
  type: time
  mask: hhmmss

# Le type amount
# Les défauts de tout montant.
amount:

  # La devise
  # La monnaie de l'entreprise, pour les prix que PMI écrit sans colonne de devise ; les tiers, les tarifs et les
  # commandes portent la leur.
  currency: EUR

# Les profils de confidentialité
# Un niveau et les groupes qui voient le champ, nommés une fois et référencés au champ ; chaque profil porte son niveau
# (level) et ses groupes (groups) : confidentiality: ${settings.confidentiality.financier}.
confidentiality:

  # Le profil financier
  # Les prix de revient, les prix d'achat, les valeurs de stock, le bancaire.
  financier:
    level: protected
    groups: [achats, direction]

  # Le profil de la direction
  # Les marges, les commissions.
  direction:
    level: protected
    groups: [direction]

  # Le profil commercial
  # Les conditions commerciales.
  commercial:
    level: protected
    groups: [commercial, direction]
