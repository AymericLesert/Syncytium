# L'adresse complémentaire — la table ADRESSE de PMI (ADKTTYPCPT le
# type de compte — C le client, F le fournisseur (D950) —, ADKTCOMPTE
# le code, ADKNNUMERO le numéro) : les adresses de livraison et de
# facturation d'un tiers. La
# composition du tiers (D399) ; le numéro l'identifie au sein du
# possesseur (D841).
name: adresse
description: Une adresse complémentaire d'un tiers — livraison ou facturation
label: "{usage} — {nom}"
identity: [numero]
history: true

fields:
  numero:
    # ADKNNUMERO int
    type: integer[1..]
    required: true
    label:
      fr: Numéro

  usage:
    # ADCTTYPE nchar(20) — l'usage de l'adresse chez PMI, traduit au
    # mapping vers les trois valeurs de l'exemple (D893/D950)
    type: enum
    required: true
    label:
      fr: Usage
    values:
      livraison:
        label:
          fr: Livraison
      facturation:
        label:
          fr: Facturation
      autre:
        label:
          fr: Autre

  nom:
    # ADCTNOM — le nom de l'adresse (l'établissement, le site)
    type: text[..40]
    label:
      fr: Nom

  adresse:
    # ADCTRUE1, ADCTRUE2, ADCTRUE3, ADCTCP, ADCTVILLE, ADCTCPAYS,
    # ADCTPAYS, ADCNGPSX, ADCNGPSY — en géolocalisation (D638), le
    # constructeur au mapping (D659) ; le téléphone du morceau 2 est
    # retiré : ADRESSE n'en porte pas (D950)
    type: geolocation
    label:
      fr: Adresse

  date_creation:
    # ADCJCREA — AAAAMMJJ au masque
    type: date
    label:
      fr: Créée le
