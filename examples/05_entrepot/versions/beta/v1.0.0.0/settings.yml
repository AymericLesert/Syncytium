# Le type text
# Les défauts de tout champ texte ; un champ peut surcharger avec sa propre expression.
text:

  # La normalisation
  # La valeur lue est rognée de ses blancs, à la frontière ; me désigne la valeur.
  normalize: trim(me)

# Le type date_pmi
# Les dates de PMI, écrites AAAAMMJJ ; les colonnes de dates des sources l'emploient.
date_pmi:

  # Le type de base
  type: date

  # Le masque de lecture
  mask: yyyymmdd

# Le type time_pmi
# Les heures de PMI, écrites hhmmss ; une colonne en hhmm surcharge le masque au champ.
time_pmi:

  # Le type de base
  type: time

  # Le masque de lecture
  mask: hhmmss

# Le type amount
# Les défauts de tout montant.
amount:

  # La devise
  # La monnaie de l'entreprise, pour les prix que PMI écrit sans colonne de devise ; les tiers, les tarifs et les
  # commandes portent la leur.
  currency: EUR

# Les profils de confidentialité
# Un niveau et les groupes qui voient le champ, nommés une fois et référencés au champ : confidentiality:
# ${settings.confidentiality.financier}.
confidentiality:

  # Le profil financier
  # Les prix de revient, les prix d'achat, les valeurs de stock, le bancaire.
  financier:

    # Le niveau de confidentialité
    level: protected

    # Les groupes qui voient le champ
    groups: [achats, direction]

  # Le profil de la direction
  # Les marges, les commissions.
  direction:

    # Le niveau de confidentialité
    level: protected

    # Les groupes qui voient le champ
    groups: [direction]

  # Le profil commercial
  # Les conditions commerciales.
  commercial:

    # Le niveau de confidentialité
    level: protected

    # Les groupes qui voient le champ
    groups: [commercial, direction]
