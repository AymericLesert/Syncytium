# Le module déclare ses entités (D765) — les chemins relatifs au
# fichier courant (D768) : depuis stock/
# « stock » : la gestion des stocks et les mouvements (D859), le
# quatrième module de l'entrepôt. L'entité du niveau de stock se nomme
# « niveau » (le niveau de stock : article × lot × emplacement × dépôt
# — STDEPLOT ; l'arbitrage de l'auteur au morceau 2, D884). Le
# mouvement est la seule entité du cas sans historique (D882) : les
# retouches des outils maison (D864) remplacent la valeur (D878) et se
# comptent au bloc de modification.
name: stock
description: Les stocks — les niveaux par dépôt, emplacement et lot, et les mouvements

entities:
  - niveau/niveau.yml
  - mouvement/mouvement.yml
  - depot/depot.yml
  - emplacement/emplacement.yml
