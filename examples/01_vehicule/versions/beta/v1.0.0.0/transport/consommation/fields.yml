numero:
  type: integer[1..]
  required: true
  label:
    fr: N°
  comment:
    fr: Le rang dans la vie du véhicule — la première ligne part du kilométrage initial.

date:
  type: date
  required: true
  label:
    fr: Date

total_km:
  type: integer[0..]
  required: true
  label:
    fr: Kilométrage compteur
  comment:
    fr: Le compteur du tableau de bord au moment du ravitaillement.

quantite:
  type: decimal
  required: true
  label:
    fr: Quantité
  # la valeur seule (D826) — l'unité au type du véhicule
  comment:
    fr: Les litres ou les kWh du ravitaillement, selon le véhicule.

prix_unitaire:
  # la devise est visuelle (D832) — owner.devise
  type: decimal
  label:
    fr: Prix unitaire
  comment:
    fr: Le prix du litre ou du kWh.

# ------ Champs calculés ------

prix_total:
  # H = F × G — le total calculé du classeur
  type: decimal
  formula: quantite * prix_unitaire
  label:
    fr: Prix total

nb_jours:
  # A = B(n) − B(n−1) — la première ligne reste nulle (le classeur la laisse vide)
  type: duration
  formula: iif(numero = 1, null, date - owner.consommations.max(date if numero = me.numero - 1))
  label:
    fr: Nb de jours
  comment:
    fr: Depuis le ravitaillement précédent.

km:
  # E = D(n) − D(n−1) — la première part du compteur au retrait (D831)
  type: integer
  formula: total_km - iif(numero = 1, owner.km_initial, owner.consommations.max(total_km if numero = me.numero - 1))
  label:
    fr: Km parcourus
  comment:
    fr: Depuis le ravitaillement précédent.

conso_100:
  # I = 100 × F / E
  type: decimal
  formula: 100 * quantite / km
  label:
    fr: Aux 100 km
  comment:
    fr: La consommation de l'intervalle — litres ou kWh aux 100 km.

km_prevu:
  # C = C4/12 + C(n−1) au classeur — une ligne ≈ un mois : l'approximation.
  # L'intention (D834) : les mois écoulés depuis l'achat, bornés à la
  # vente, × le douzième du forfait ; km_annuel nul → la colonne reste nulle
  type: decimal
  formula: (iif(owner.date_vente != null and owner.date_vente < date, owner.date_vente, date) - owner.date_achat).months * owner.km_annuel / 12
  label:
    fr: Km prévu
  comment:
    fr: Le prorata du forfait annuel de la LOA depuis l'achat.
