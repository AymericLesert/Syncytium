# L'écriture bancaire (D758)
name: ecriture
label: "{libelle}"
fields:
  numero:    counter                 # le compteur auto (D409) — masqué aux surfaces
  date:      { type: date, required: true }   # la date d'opération
  comptable: date                    # la date comptable — renseignée au pointage
  libelle:   text[..60]
  budget:    banque.budget           # le référentiel dynamique (D355)
  montant:                           # signé — la devise vit dans la valeur (D771)
    type: amount
    currencies: [EUR, FRF]           # FRF : l'historique antérieur au passage
    required: true
  mode:
    type: enum
    values:
      cb:          { label: { fr: CB } }
      prelevement: { label: { fr: Prélèvement } }
      virement:    { label: { fr: Virement } }
      autre:       { label: { fr: Autre } }
  cheque:    text[..10]              # le n° de chèque (le mode autre)
  liee:      banque.ecriture         # l'écriture miroir du virement (D758)
  lieu:      banque.lieu             # la ville — dynamique (D355)
  imprimee:  date                    # le marqueur du relevé (Date_Impression)
  # les montants convertis (D770/D771) — des amount à devise unique,
  # le taux fixe du passage franc→euro ; currency : la fonction du type
  montant_euro:
    type: amount
    currencies: [EUR]
    formula: montant.currency.select(EUR: montant, FRF: amount(montant.value / 6.55957, EUR))
  montant_franc:
    type: amount
    currencies: [FRF]
    formula: montant.currency.select(FRF: montant, EUR: amount(montant.value * 6.55957, FRF))
  solde:
    type: amount
    currencies: [EUR]
    formula: owner.ecritures.sum(montant_euro if date <= me.date)   # D760/D770 — continu
