# La déclaration de la présentation graphique — le morceau 4.
# Pas de formulaire déclaré : le formulaire par défaut du socle
# suffit (l'arbitrage — basique, sans description) ; la saisie vit
# dans la liste (l'édition en ligne, D205/D445).
lists:

  # la feuille CONSOMMATION, colonne à colonne
  consommations:
    title:
      fr: "La consommation"
    columns: [nb_jours, date, km_prevu, total_km, km, quantite, prix_unitaire, prix_total, conso_100]
    # les saisies — les calculés se refont (D255)
    editable: [numero, date, total_km, quantite, prix_unitaire]
    sort: [date, numero]

charts:

  # la feuille GRAPHIQUE (D826)
  evolution_consommation:
    title:
      fr: "L'évolution de la consommation"
    # le mois — le découpage temporel (D516)
    x: date[month]
    # la moyenne du mois (D517/D580)
    y: avg(conso_100)
