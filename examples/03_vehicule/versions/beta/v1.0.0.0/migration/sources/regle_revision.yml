# Le nom de l'entité source
# Le bloc droit de la feuille ENTRETIEN ne porte que sa règle, dans son titre — « Révisions tous les 25.000 km » ; un
# enregistrement par classeur.
name: regle_revision

# La description de l'entité source
description: La règle de révision du classeur — le pas en kilomètres

# Les colonnes
# Le connecteur expose la plaque, lue sur un autre onglet pour la jointure au véhicule, et le titre ; la source
# ajoute une description et le calculé qui tire le pas du titre.
fields:

  immatriculation:
    description: La plaque du classeur.

  pas_km_n:
    formula: round(extract(titre, "tous les ([0-9.]+) km") * 1000)
    description: >-
      Le pas en kilomètres : « 25.000 » se lit 25.0, le point de milliers pris pour une décimale, et le × 1000 le
      redresse ; le réel ne porte que 25.000 et 20.000.
