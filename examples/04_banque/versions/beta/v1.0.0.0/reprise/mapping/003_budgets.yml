# Les budgets
budget:
  description:
    fr: >-
      La phase 2, le préalable : le référentiel des budgets, une valeur distincte par budget — la valeur devient
      l'identité. Les marqueurs OUVERTURE et FERMETURE entrent au référentiel ; leur usage est tenu par la validation de
      l'écriture.
    en: >-
      Phase 2, the prerequisite: the budget reference list, one distinct value per budget — the value becomes the
      identity. The OUVERTURE and FERMETURE markers enter the list; their use is governed by the entry's validation.
    es: >-
      La fase 2, el requisito previo: el referencial de presupuestos, un valor distinto por presupuesto — el valor se
      convierte en la identidad. Los marcadores OUVERTURE y FERMETURE entran en el referencial; su uso lo rige la
      validación del apunte.
  to: banque.budget
  distinct: [Budget]
  fields:
    libelle: Budget
