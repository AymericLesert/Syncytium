# Les surfaces de la commande de vente — le lot 1 du morceau 5. Le statut
# se déduit des lignes (D1003) ; la date porte la plage de recherche
# (D784). Lecture seule (D882) : le double-clic consulte.

lists:
  commandes:                         # le menu : commande.commande_vente
    title: { fr: "Les commandes de vente" }
    searchable:
      - client: { select: mono }     # un client à la fois (D782)
      - date                         # la plage — le champ porte sa facette (D784)
      - statut
    columns:
      - numero
      - indice
      - client
      - date
      - date_echeance
      - statut
      - nombre_lignes
      - reste_a_livrer
      - total                        # la somme des lignes (D771)
    sort: { date: "-", numero: "-" }     # les cascades (D441) — les plus récentes en tête
    selection: 1..
    exports: [ csv, 'excel[commandes_vente.xlsx]' ]

  en_cours:
    title: { fr: "Les commandes en cours" }
    filter: statut = "en_cours"
    searchable: [ client, date ]
    columns: [ numero, indice, client, date, date_echeance, reste_a_livrer, total ]
    sort: { date_echeance: "+" }

forms:
  fiche:
    title: "{numero}-{indice} — {client}"
    mode: read-only
    header:
      items: [ 'field[numero]', 'field[indice]', 'field[statut]' ]
    page:
      - sections:
          layout: row
          items:
            - section:
                title: { fr: Client }
                items: [ 'field[client]', 'field[reference_client]', 'field[devise]', 'field[taux_change]' ]
            - section:
                title: { fr: Dates }
                items: [ 'field[date]', 'field[date_echeance]', 'field[derniere_livraison]', 'field[derniere_facture]' ]
            - section:
                title: { fr: Livraison }
                items: [ 'field[livraison_nom]', 'field[adresse_livraison]' ]   # le calculé géocodé (D1004)
      - field[lignes]                # la composition — la liste embarquée (D486)
    footer:
      items: [ 'field[nombre_lignes]', 'field[reste_a_livrer]', 'field[total]' ]
