# Le produit fabriqué — l'article dont le code de gestion vaut 01 chez PMI
# (ARCTFATN, D936/D940) : un dérivé de l'article
# (D143/D353 — « le code de gestion assurera l'héritage »). Le parent
# décrit le commun, l'enfant ne porte que ce qui lui est propre : la
# nomenclature et la gamme, déclarées sur chacun des trois dérivés qui
# en ont besoin — le fabriqué, le semi-fini, le fantôme (D940 : « la
# nomenclature n'apparaît pas dans les autres types d'articles »).
name: fabrique
description: Un produit fabriqué — l'article que l'entreprise produit, avec sa nomenclature et sa gamme
label: "{code} — {libelle}"
inheritance: article
history: true

fields:
  client_defaut:
    # ARCTNOFOU1 — le compte 1 de PMI : « dans le cas d'un produit
    # fabriqué, le compte 1 fait alors référence au client de référence »
    # (D996) ; l'élément spécifique du fabriqué (D997), le parent porte
    # le fournisseur par défaut de l'acheté ; absent chez l'inactif
    type: tiers.client
    label:
      fr: Client de référence

  clients:
    # « une liste de clients (déduites des commandes de vente passées) »
    # (D996) — l'association dérivée (D405) : les clients des lignes de
    # vente de l'article, la projection D889 sur la liste calculée
    type: association with tiers.client if client in me.commandes_vente.client
    label:
      fr: Clients

  nomenclature:
    # la composition (D399) — la nomenclature et la gamme réunies, comme
    # chez PMI (NOMENC) ; la composition auto-référencée (D135) : le
    # composant est un article, de tout type (D937)
    type: list of nomenclature
    label:
      fr: Nomenclature et gamme

  # ------ Champs calculés ------

  dernier_client:
    # le compte 2 de PMI (ARCTNOFOU2) — « se calcule, ne se stocke pas »
    # : « dernier_client: commandes_vente.last().client — le tri est
    # porté par la liste calculée » (D997)
    type: tiers.client
    formula: commandes_vente.last().client
    label:
      fr: Dernier client

  nombre_composants:
    type: integer
    formula: nomenclature.count(nature = "composant")
    label:
      fr: Composants
    hint:
      fr: Le nombre de composants de la nomenclature.

  nombre_operations:
    type: integer
    formula: nomenclature.count(nature = "operation")
    label:
      fr: Opérations
    hint:
      fr: Le nombre d'opérations de la gamme.

  temps_gamme:
    # la somme des temps d'ouverture des opérations — une durée (D378)
    type: duration
    formula: nomenclature.sum(temps_ouverture if nature = "operation")
    label:
      fr: Temps de gamme
    hint:
      fr: Le temps total des opérations de la gamme.

gui: ~{gui.yml}                  # les surfaces — le morceau 5 (D767)
