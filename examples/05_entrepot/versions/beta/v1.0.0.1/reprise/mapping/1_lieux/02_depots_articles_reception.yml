# Les dépôts de la réception, trouvés dans les fiches articles
ARTICLE:
  description: >-
    La deuxième origine des dépôts : le dépôt de la réception de chaque fiche article, une valeur distincte par dépôt ;
    une fiche sans dépôt n'en fait pas. Un dépôt né ici est inactif et sans libellé ; déjà connu, il n'est pas touché.
  to: stock.depot
  distinct: [ARCTCODEPR]
  filter: ARCTCODEPR != null
  fields:
    code: ARCTCODEPR
  report:
    when: [migration]
    to: [logistique]
    by: [notification, mail]
