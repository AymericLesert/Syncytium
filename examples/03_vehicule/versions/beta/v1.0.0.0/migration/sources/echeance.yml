# Le nom de l'entité source
# Les tableaux CREDIT et LOA partagent le format — la date, le reste dû, l'intérêt, l'amortissement, l'assurance, la
# mensualité, la coche Payé — : une seule entité, la liste de plages de la carte fait le repli. Le réel discrimine les
# régimes : l'intérêt vide est la LOA. Le reste dû et la coche ne sont pas lus, le modèle les calcule.
name: echeance

# La description de l'entité source
description: Les échéances du financement — la ligne des tableaux CREDIT ou LOA

# Les colonnes
# Le connecteur expose les colonnes de la plage, chacune par son entête, et la plaque, lue sur un autre onglet pour
# la jointure au véhicule ; la source ajoute des descriptions.
fields:

  immatriculation:
    description: La plaque du classeur.

  interet:
    description: Vide pour la LOA.
