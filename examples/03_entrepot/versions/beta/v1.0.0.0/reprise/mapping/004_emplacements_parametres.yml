# L'étape 4 — les emplacements des paramètres de Cegid (D962 : la
# première des trois origines — les fiches articles à l'étape 5, les
# mouvements à l'étape 6) : PARAM_EMPLACEMENTS, l'entité nommée sur la
# table PARAM au filtre du paramètre 170 (l'alias, D966), une ligne par
# emplacement actif — le couple Dépôt.Emplacement (PACTEXT210) découpé à
# la source en deux calculés (D660/D817), le libellé en PACTEXT140 :
# « le libellé des emplacements est dans les paramètres. Dans les autres
# cas, il n'est pas connu ». L'identité de l'emplacement est le couple
# (dépôt, emplacement) (D962) ; le dépôt, créé à l'étape 1, se résout par
# la clé (D654). Les emplacements nés ici sont les actifs ; ceux des
# étapes 5 et 6 naissent inactifs (D941).

PARAM_EMPLACEMENTS:
  to: stock.emplacement
  fields:
    depot:   depot                    # la référence par la clé (D654) — part de l'identité
    code:    emplacement              # l'identité (D930) — le calculé de la source
    libelle: PACTEXT140
    actif:   true                     # les paramètres = les emplacements actifs (D962)
  report:
    when: [migration]
    to: [production]
    by: [notification, mail]
