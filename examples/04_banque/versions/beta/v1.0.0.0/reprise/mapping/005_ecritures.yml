# Les écritures
budget:
  description:
    fr: >-
      La phase 2 : les écritures courantes, hors marqueurs. La règle est sans identité — création seule : le legacy n'a
      aucune clé naturelle, 54 doublons du quintuple compte, date, libellé, montant ; la migration en absolute avec
      remise à zéro l'admet, la garde de l'ingestion le vérifie. Le numéro d'écriture naît au fil de la création, dans
      l'ordre du fichier. La règle empile les virements référencés au cache — la première phase du rapprochement.
    en: >-
      Phase 2: the ordinary entries, markers excluded. The rule has no identity — creation only: the legacy has no
      natural key, 54 duplicates of the quintuple account, date, description, amount; the absolute migration with a
      reset allows it, the ingestion guard checks it. The entry number is born as entries are created, in the order of
      the file. The rule pushes the referenced transfers onto the cache — the first phase of the matching.
    es: >-
      La fase 2: los apuntes corrientes, sin los marcadores. La regla no tiene identidad — solo creación: el legacy no
      tiene ninguna clave natural, 54 duplicados del quíntuple cuenta, fecha, concepto, importe; la migración en
      absolute con puesta a cero lo admite, la guarda de la ingestión lo verifica. El número de apunte nace al hilo de
      la creación, en el orden del fichero. La regla apila las transferencias referenciadas en la caché — la primera
      fase de la conciliación.
  to: banque.ecriture
  filter: Budget != "OUVERTURE" and Budget != "FERMETURE"
  parent: { compte: Numero_Compte }
  fields:
    date_operation: Date_Operation
    date_comptable: Date_Comptable
    libelle:  Designation
    budget:   Budget
    lieu:     Lieu
    montant:  amount(montant_signe, devise_iso)
    mode:     mode_norme
    cheque:   cheque_norme
    imprimee: Date_Impression
  operations:
    cache.push("virement", reference_virement, me) if reference_virement != null
