# L'étape 12 — les contacts des fournisseurs : la seconde règle sur
# CONTACT (D950), filtrée sur le type de compte F ; le possesseur est le
# fournisseur. Les mêmes conversions que l'étape 11.

CONTACT:
  to: tiers.contact
  filter: CTCTTYPCPT = "F"
  parent: { fournisseur: CTCTCOMPTE }
  fields:
    identifiant:  CTKNID
    civilite:     'CTCTCIVILI.select(M: "monsieur", MME: "madame")'   # inventé (D963)
    nom:          CTCTNOM
    prenom:       CTCTPRENOM
    fonction:     'CTCTFONCTI.select(DIR: "Direction", ACH: "Acheteur", COM: "Commercial", TEC: "Technicien", "...": CTCTFONCTI)'   # inventé (D963)
    telephone:    CTCTNOTEL1
    portable:     CTCTNOTEL2
    email:        CTCTMAIL1
    anniversaire: CTCJANNIV
    actif:        CTCTACTIF != "N"
    date_creation: CTCJCRE
  report:
    when: [migration]
    to: [achats]
    by: [notification, mail]
