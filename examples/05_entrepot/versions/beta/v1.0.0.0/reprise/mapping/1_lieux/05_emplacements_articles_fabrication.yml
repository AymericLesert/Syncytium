# Les emplacements de la fabrication, trouvés dans les fiches articles
ARTICLE:
  description: >-
    La deuxième origine des emplacements : le couple dépôt + emplacement de la fabrication de chaque fiche article, un
    couple distinct par emplacement ; le dépôt se retrouve par son code. Un emplacement né ici est inactif et sans
    libellé ; déjà connu, il n'est pas touché.
  to: stock.emplacement
  distinct: [ARCTCODEPF, ARCTCOEMPF]
  filter: ARCTCODEPF != null and ARCTCOEMPF != null
  fields:
    depot: ARCTCODEPF
    code:  ARCTCOEMPF
  report:
    when: [migration]
    to: [logistique]
    by: [notification, mail]
