# La déclaration de la présentation graphique — le morceau 4.
# Pas de formulaire déclaré : le défaut du socle suffit — l'échéance
# se reprend dans la liste (l'édition en ligne, l'arbitrage de
# l'auteur) ; les lignes naissent de creer_echeancier, se remettent
# au paramétrage par ajuster_echeancier, la coche Payé est calculée.
lists:
  echeancier:                      # le tableau CREDIT | LOA du classeur
    title: { fr: "L'échéancier" }
    searchable:
      - vehicule: { select: mono, required: true }
    columns: [numero, date, reste_du, interet, amortissement, assurance, mensualite, paye]
    editable: [numero, date, interet, amortissement, assurance, mensualite]   # les données ; paye et reste_du se calculent
    sort: [numero]
    selection: 1
