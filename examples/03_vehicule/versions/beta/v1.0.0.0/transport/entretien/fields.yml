numero:
  type: counter
  description: Le compteur automatique, masqué aux surfaces.

date:
  type: date
  required: true
  label: Date

designation:
  type: text[..200]
  required: true
  label: Désignation
  placeholder: Changement du pneu avant droit
  hint: Le fait marquant — un frais, un événement, l'achat, la vente.
  description: Le multi-ligne se déduit de la taille.

montant:
  type: decimal
  label: Montant
  hint: Optionnel — l'événement sans montant est licite, la vente en recette négative.
  description: La devise est visuelle, celle du véhicule.

km:
  type: integer[0..]
  label: Kilométrage

revision:
  type: boolean
  label: Révision ?
  hint: La ligne est une révision — sinon, une intervention hors révision.
  description: >-
    Le booléen suffit, la référence à la règle n'avait pas d'intérêt ; les révisions faites restent des lignes du
    journal.
