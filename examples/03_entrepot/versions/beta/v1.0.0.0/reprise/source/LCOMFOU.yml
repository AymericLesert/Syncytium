# La table LCOMFOU de PMI — 124 colonnes, les mêmes que LCOMCLI : la ligne
# de commande, la source de commande.ligne_achat, la composition de l'entête
# (D399). La clé porte le numéro, la ligne et l'indice de la commande —
# LCKTPSF, « l'indice de la commande » (D951) : le possesseur est la
# révision (numéro, indice). Les colonnes lues typées et renvoyées, les
# autres non lues (D947).
name: LCOMFOU
description: Les lignes de commandes dachat de PMI — la source de commande.ligne_achat

filter: LCKTSOC = "100"
identity: [LCKTNUMERO, LCKTPSF, LCKTLIGNE]
coverage: LCKTNUMERO[10000]
parent:
  ECOMFOU: { ECKTNUMERO: LCKTNUMERO, ECKTINDICE: LCKTPSF }
# la même partition que l'entête (l'écho de D880 — mien) ; le possesseur
# par ses colonnes de clé (D931), l'indice sous un autre nom (D951)

fields:
  LCKTSOC:     text[3]                                        # la société — le filtre (D663)
  LCKTNUMERO:  text[6]                                        # l'identité (D871), la clé du possesseur — convertie par le calculé numero (D990)
  LCKTLIGNE:   text[3]                                        # → ligne_achat.numero — l'identité (D871), convertie par le calculé ligne (D990)
  LCKTPSF:     text[3]                                        # l'identité — l'indice de la commande (D951), la clé du possesseur
  LCCTCODART:  ARTICLE.ARKTCODART                             # → ligne_achat.article — la référence par la clé composée, colonne par colonne (D648/D931)
  LCCTCOMART:  ARTICLE.ARKTCOMART                             # → ligne_achat.article
  LCCNQTECDE:  decimal                                        # → ligne_achat.quantite
  LCCTUNICDE:  text[2]                                        # → ligne_achat.unite
  LCCNPUBRUT:  decimal                                        # → ligne_achat.prix_brut
  LCCNPUNET:   decimal                                        # → ligne_achat.prix_net
  LCCNQTEEXP:  decimal                                        # → ligne_achat.quantite_recue
  LCCSDELEXP:  ignored                                        # la semaine du délai — « se déduit du jour », non reprise (D1000)
  LCCJDELEXP:  date_pmi                                       # → ligne_achat.delai_reception
  LCCSDELFAB:  ignored                                        # la semaine de la fin de fabrication — déduite du jour (D1000)
  LCCTDEVISE:  text[3]                                        # → ligne_achat.prix_brut, prix_net — la devise des prix (D771)
  LCCJDELDDE:  date_pmi                                       # → ligne_achat.delai_demande
  LCCJDELARR:  date_pmi                                       # → ligne_achat.delai_accuse
  LCCSDELARR:  ignored                                        # la semaine du délai accusé — déduite du jour (D1000)
  LCCTSTATUT:  text[2]                                        # → ligne_achat.statut — les valeurs de l'exemple au mapping (D946) ; LCCTETACDE non lue (D951)

  # --- les clés en nombre (D990 : la conversion à la lecture) : le numéro de
  # la commande possédante et le numéro de ligne — deux calculés (D660) ---
  numero:
    formula: integer(LCKTNUMERO)
  ligne:
    formula: integer(LCKTLIGNE)
