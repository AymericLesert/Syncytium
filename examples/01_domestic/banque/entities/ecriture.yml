# L'écriture bancaire (D758)
name: ecriture
label: "{libelle}"
fields:
  numero:    counter                 # le compteur auto (D409) — masqué aux surfaces
  date_operation: { type: date, required: true, searchable: range }   # D784
  date_comptable: { type: date, searchable: range }   # renseignée au pointage
  libelle:   { type: text[..60], searchable: mutualizable[recherche] }   # D780
  budget:    { type: banque.budget, searchable: mutualizable[recherche] }   # le référentiel dynamique (D355)
  montant:                           # signé — la devise vit dans la valeur (D771)
    type: amount
    currencies: [EUR, FRF]           # FRF : l'historique antérieur au passage
    required: true
  mode:
    type: enum
    values:
      cb:          { label: { fr: CB } }
      prelevement: { label: { fr: Prélèvement } }
      virement:    { label: { fr: Virement } }
      autre:       { label: { fr: Autre } }
  cheque:    text[..10]              # le n° de chèque (le mode autre)
  liee:      banque.ecriture         # l'écriture miroir du virement (D758)
  lieu:      { type: banque.lieu, searchable: mutualizable[recherche] }   # la ville — dynamique (D355)
  imprimee:  date                    # le marqueur du relevé (Date_Impression)
  # les montants convertis (D770/D771) — des amount à devise unique,
  # le taux fixe du passage franc→euro ; currency : la fonction du type
  montant_euro:
    type: amount
    currencies: [EUR]
    formula: montant.currency.select(EUR: montant, FRF: amount(montant.value / 6.55957, EUR))
  montant_franc:
    type: amount
    currencies: [FRF]
    formula: montant.currency.select(FRF: montant, EUR: amount(montant.value * 6.55957, FRF))
  solde:
    type: amount
    currencies: [EUR]
    formula: owner.ecritures.sum(montant_euro if date_operation <= me.date_operation)   # D760/D770 — continu
  # les calculés d'affichage (D779) — le montant signé en deux colonnes
  debit:  { type: amount, currencies: [EUR, FRF], formula: iif(montant.value < 0, -montant, null) }
  credit: { type: amount, currencies: [EUR, FRF], formula: iif(montant.value > 0, montant, null) }

# les opérations du projet (D776 — les hooks) et leur usage (D609)
operations:
  clone:                       # la duplication entre deux dates (D774)
    label: { fr: Cloner }
    form: clonage              # le pas + du/au (D775 — la validation est l'opération)
    commit: confirm            # la relecture : nb_creations (D598)
  propager:                    # les similaires (D774)
    label: { fr: Propager }
    form: propagation          # le nouveau libellé/montant → liste → sélection → masse
    commit: confirm
  virer:                       # les deux écritures liées
    label: { fr: Virer }
    form: virement             # le compte cible, le montant
    commit: confirm
# le pointage : sans opération — l'édition en ligne de `date_comptable`
# dans la liste « sans date comptable » (D205/D446)

# les surfaces (le morceau 4 — D779–D790)
gui:
  forms:
    record:                            # les cinq usages (D199/D788)
      title:                           # le titre au mode d'ouverture (D789–D790)
        create: { fr: "Création d'une écriture" }
        read:   { fr: "Écriture '{libelle}' du {date_operation}" }
        update: { fr: "Modification de l'écriture '{libelle}' du {date_operation}" }
        delete: { fr: "Suppression de l'écriture '{libelle}' du {date_operation}" }
      items:
        - field[date_operation]        # le calendar + les steppers [-]/[+] (D785)
        - field[date_comptable]
        - field[libelle]
        - field[budget]                # le picker à création directe (D355)
        - field[montant]
        - field[mode]                  # les radios
        - field[cheque]: { visible: mode = autre }   # le visible: vivant (D567)
        - field[lieu]                  # le picker à création directe

    # les formulaires d'appel (D775) — leur validation EST l'opération ;
    # les items déclarent des champs libres : les paramètres du hook
    clonage:                           # l'appel de clone (D774)
      title: { fr: "Cloner l'écriture '{libelle}'" }
      items:
        - pas: { type: enum, required: true, values:
                 { jour: { label: { fr: Jour } }, semaine: { label: { fr: Semaine } },
                   mois: { label: { fr: Mois } }, trimestre: { label: { fr: Trimestre } } } }
        - du:  { type: date, required: true }
        - au:  { type: date, required: true }

    propagation:                       # l'appel de propager (D774)
      title: { fr: "Propager depuis '{libelle}'" }
      items:
        - libelle_nouveau: { type: text[..60], required: true }
        - montant_nouveau: { type: amount, currencies: [EUR], required: true }
        # le déroulé du hook : la liste des similaires → la sélection → la masse

    virement:                          # l'appel de virer
      title: { fr: "Virement" }
      items:
        - vers:    { type: banque.compte, required: true }   # le compte cible
        - montant: { type: amount, currencies: [EUR], required: true }

  lists:
    par_operation:                    # la première déclarée = le défaut (D437)
      title: { fr: "Par date d'opération" }
      searchable:                     # la zone de recherche (D782–D784)
        - compte: { select: mono, required: true }
        - date_operation                # la plage — le champ porte sa facette (D784)
        - recherche                     # le champ mutualisé (D780)
      columns: [date_operation, date_comptable, libelle, budget, debit, credit, solde]
      sort: [date_operation, numero]
      selection: multiple
      actions: [copy]                 # le duplicate du socle (D574)

    par_comptable:
      title: { fr: "Par date comptable" }
      filter: date_comptable != null  # les pointées seules (D783)
      searchable:
        - compte: { select: mono, required: true }
        - date_comptable                # la plage — le champ porte sa facette (D784)
        - recherche
      columns: [date_operation, date_comptable, libelle, budget, debit, credit, solde]
      sort: [date_comptable, numero]
      selection: multiple
      actions: [copy]
      exports: [releve]               # le [PDF] — ici seulement (D780)

    pointage:
      title: { fr: "Sans date comptable" }
      filter: date_comptable = null   # la partition avec par_comptable (D783)
      searchable:
        - compte: { select: mono, required: true }
        - recherche
      columns:
        - date_operation: { editable: true }
        - date_comptable: { editable: true }   # le pointage en ligne (D205)
        - libelle: { editable: true }
        - budget: { editable: true }
        - debit
        - credit
        - solde
      sort: [date_operation, numero]
      selection: multiple
