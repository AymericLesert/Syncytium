# Les emplacements de l'expédition, trouvés dans les fiches articles
ARTICLE:
  description: >-
    La deuxième origine des emplacements : le couple dépôt + emplacement de l'expédition de chaque fiche article, un
    couple distinct par emplacement ; le dépôt se retrouve par son code. Un emplacement né ici est inactif et sans
    libellé ; déjà connu, il n'est pas touché.
  to: stock.emplacement
  distinct: [ARCTCODEP, ARCTCODMPL]
  filter: ARCTCODEP != null and ARCTCODMPL != null
  fields:
    depot: ARCTCODEP
    code:  ARCTCODMPL
  report:
    when: [migration]
    to: [logistique]
    by: [notification, mail]
