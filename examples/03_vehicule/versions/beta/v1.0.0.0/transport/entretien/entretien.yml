# L'entretien
# Le journal de vie : des frais, des événements sans montant — un choc, une fuite —, l'achat en première ligne et la
# vente en recette négative.
name: entretien

# La description de l'entité
description: Une ligne du journal de vie — un frais, un événement, l'achat, la vente

# Le visage texte
label: "${name}"

# Les champs
fields: ~{fields.yml}

# La cohérence des données
validation:
  - rule: date >= owner.date_achat
    message: L'entretien du {date} précède l'achat du {owner.date_achat}.

# L'interface
# La liste éditable.
gui: ~{gui.yml}
