# La déclaration de la présentation graphique — le morceau 4.
# Pas de formulaire déclaré : le défaut du socle suffit — la règle
# s'écrit dans la liste (l'édition en ligne, D205/D445).
widgets:
  annonce:                         # le widget de l'échue — un seul texte : UNE ALERTE,
                                   # rien de plus (pas de lien vers le véhicule ou la
                                   # règle — « nous n'avons pas plus de 2 véhicules »)
    items:
      - paragraph:                 # le gabarit mustache, les chemins D71, l'alinéa au if: (la fiche paragraph)
          if: prochaine_date != null
          label: { fr: "Révision « {{designation}} » du véhicule {{owner.nom}} — prévue le {{prochaine_date}}" }
      - paragraph:
          if: prochaine_date = null
          label: { fr: "Révision « {{designation}} » du véhicule {{owner.nom}} — prévue à {{prochaine_km}} km" }

lists:
  toutes:                          # la première déclarée = le défaut (D437)
    title: { fr: "Les révisions" }
    searchable:
      - vehicule: { select: mono, required: true }
    columns: [designation, pas_km, pas_duree, derniere_date, derniere_km, prochaine_date, prochaine_km, echue]
    editable: [designation, pas_km, pas_duree]   # la règle ; les échéances se déduisent (D255)
    sort: [designation]
    selection: 1
  echues:                          # l'écho (D826) — TOUS les véhicules, la partition par le filtre (D783)
    title: { fr: "Les révisions échues" }
    filter: echue = true
    widget: annonce                # la liste de widgets (D492) — le texte unique par échue
    sort: [prochaine_date]         # le nul en tête (D381) — les règles au km d'abord
