# Le module banque
# Le compte bancaire du foyer : les comptes, leurs écritures, les référentiels des budgets et des lieux.
name: banque

# La description du module
description:
  fr: La gestion des comptes bancaires du foyer
  en: The household's bank accounts
  es: La gestión de las cuentas bancarias del hogar

# Les entités du module
# Les chemins sont relatifs à ce fichier ; les deux référentiels partagent un dossier.
entities:
  - ~{compte/compte.yml}
  - ~{ecriture/ecriture.yml}
  - ~{referentiel/budget.yml}
  - ~{referentiel/lieu.yml}

# Le menu du module
# Déclaré pour donner une entrée à chacune des trois listes de l'écriture ; sans lui, le défaut n'en montre qu'une.
menu: ~{menu.yml}

# L'interface du module
# L'accueil : le graphique de l'évolution des dépenses par budget ; le menu l'adresse banque[accueil].
gui:
  dashboards:

    # L'accueil
    accueil:
      title: { fr: Le foyer et ses comptes, en: The household and its accounts, es: El hogar y sus cuentas }
      items:
        - chart[ecriture.evolution_budget]
