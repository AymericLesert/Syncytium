# Le niveau de stock — la table STDEPLOT de PMI : la quantité d'un
# article, dans un lot, à un emplacement d'un dépôt (DPKTCODART +
# DPKTCOMART, DPKTNUMLOT, DPKTCODMPL, DPKTDEPOT, DPKTCODENR — D865).
# Sans historique (D1013, qui amende D882) : « pas d'historique sur
# STDEPLOT car les mouvements sont dans MVTSTO. Sinon, cela fera doublon
# (ou presque) » — le stock à une date se reconstitue des mouvements ;
# « un comparatif entre les mouvements et le stockage peut être mené par
# une règle de contrôle » : la matrice calculée du dépôt, emplacement ×
# article (depot.controle_stock — D1014). La
# table est un état, au plus deux cent mille lignes : relue en entier
# chaque nuit, sans coverage (D1013).
name: niveau
description: Un niveau de stock — un article, un lot, un emplacement, un dépôt, et les quantités qui s'y tiennent
label: "{article} — {depot}/{emplacement} — lot {lot}"
identity: [article, lot, emplacement, depot, enregistrement]
history: false               # les mouvements portent l'histoire (D1013)

fields: ~{fields.yml}

validation:
  - quantite >= 0
  - quantite_reservee <= quantite
  # la règle de l'auteur (D954) : le lot d'un article périssable porte sa
  # date de péremption — la référence navigue (D396), la cible vérifie (D932)
  - peremption != null if article.perissable
